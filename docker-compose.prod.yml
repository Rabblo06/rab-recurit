# Production stack for Openship: Postgres + Redis + API server + queue worker.
# Put this file at the REPO ROOT and point Openship's "Compose file" setting at it.
# All secrets come from the environment (Openship .env), never from this file.

name: rab

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rab
      POSTGRES_DB: rab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Read by the init script to create rab_owner / rab_app with real passwords
      RAB_OWNER_PASSWORD: ${RAB_OWNER_PASSWORD:?set RAB_OWNER_PASSWORD}
      RAB_APP_PASSWORD: ${RAB_APP_PASSWORD:?set RAB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/rab-docker/postgres-init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab']
      interval: 5s
      timeout: 5s
      retries: 20
    # No ports: only reachable from the other services on this network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  server:
    build:
      context: .
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    restart: unless-stopped
    command: ./start.sh
    environment: &app-env
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://rab_app:${RAB_APP_PASSWORD}@postgres:5432/rab
      DATABASE_URL_UNPOOLED: postgres://rab_owner:${RAB_OWNER_PASSWORD}@postgres:5432/rab
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      APP_URL: ${APP_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-LOGGER}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-rab <no-reply@example.com>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_VERSION: ${APP_VERSION:-pilot-1}
      STORAGE_LOCAL_ROOT: /app/storage
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-}
    volumes:
      - uploads:/app/storage
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    restart: unless-stopped
    command: node packages/rab-server/dist/queue-worker/main.js
    environment:
      <<: *app-env
      # The worker never creates the first admin.
      BOOTSTRAP_ADMIN_EMAIL: ''
      BOOTSTRAP_ADMIN_PASSWORD: ''
    volumes:
      - uploads:/app/storage
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
