name: crewflow-cost

# DISPOSABLE cost/performance measurement stack (Phase M). Its own project, containers (costaudit-*), network and
# volumes, loopback-only host ports. It never mounts or reaches the dev stack (rab-devdb 15432, rab-redis-1),
# crewflow-test-db/redis (15436/16391-16399), the e2e stack or any remote database.
#
# Always driven through scripts/run.sh (or lib/common.sh's `dc`), which passes:
#   --env-file $COST_SECRETS   (generated by scripts/gen-secrets.sh, OUTSIDE the repo; letters/digits only)
#   COST_TAG                   image pair crewflow-cost/{server,worker}:$COST_TAG (scripts/build-images.sh)
#
# Resource limits mirror the 2026-10-26 audit harness: API 1 CPU / 768 MB, worker 1 CPU / 1 GB, Postgres no CPU limit.
# Runtime flags are production-like where it matters for cost: HWS_RUNTIME_ENABLED=false, WORKER_SCHEDULER=bullmq,
# STORAGE_DRIVER=S3 (MinIO), EMAIL_DRIVER=LOGGER, PUSH/REALTIME/AI off. NODE_ENV=development only because production mode
# refuses the LOGGER email driver and loopback URLs.
#
# DATABASE LIFECYCLE = PRODUCTION'S (owner-login architecture; Phase X P0-H; packages/rab-docker/docker-compose.image.yml):
#   - pg: a fresh cluster whose init is pg_stat_statements (init/00-pgss.sql), the committed one-time provider-admin SQL
#     packages/rab-docker/postgres-init/owner-login/01-crewflow-owner.sql (the crewflow_owner password comes from the
#     compose secret crewflow-owner-password, fed from CREWFLOW_OWNER_PW; never a command line) and the disposable marker
#     every harness script checks (init/02-cost-marker.sql);
#   - api: ./api-prestart.sh with CREWFLOW_MIGRATE_ON_START=true (migration child under the lock, the whole chain, then the
#     BullMQ scheduler registration), then main.js;
#   - worker (and worker2): consume-only (DISABLE_DB_MIGRATIONS, DISABLE_CRON_JOBS_REGISTRATION), after a healthy api;
#   - ONE login, crewflow_owner, in ONE PG_DATABASE_URL for api, worker, worker2 and tool. No migrate service, no rab_owner /
#     crewflow / crewflow_app / crewflow_worker login. pg_stat_statements windows filter on crewflow_owner (lib/*.js).

x-app-env: &app-env
  NODE_ENV: development
  RAB_RUNTIME_ENV: development
  TZ: UTC
  # Phase B (614796f0+): no DB_TARGET in the runtime env (command authority only; the API and the Worker refuse to start
  # with it, never-in-runtime-env.ts). The tool service sets it itself. One PG_DATABASE_URL (crewflow_owner) everywhere, on
  # the compose service name `pg` (a listed local database service host, LOCAL_DATABASE_SERVICE_HOSTS).
  APP_SECRET: ${APP_SECRET:?run scripts/gen-secrets.sh}
  REDIS_URL: redis://:${REDIS_PW:?}@costaudit-redis:6379
  EMAIL_DRIVER: LOGGER
  PUSH_ENABLED: 'false'
  PUSH_PROVIDER: FAKE
  AI_ENABLED: 'false'
  HWS_RUNTIME_ENABLED: 'false'
  # O3 C2 (production's mode): the api registers the BullMQ job schedulers on start; the workers only consume them.
  WORKER_SCHEDULER: bullmq
  STORAGE_DRIVER: S3
  STORAGE_KEY_PREFIX: ${STORAGE_KEY_PREFIX:-costaudit}
  S3_BUCKET: costaudit
  S3_REGION: us-east-1
  S3_ENDPOINT: http://costaudit-minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PW:?}
  S3_FORCE_PATH_STYLE: 'true'
  APP_URL: http://127.0.0.1:5173
  ACCOUNTS_URL: http://127.0.0.1:5173
  # screen-traffic/ (Phase C1) adds its own host Vite origin (127.0.0.1:23173) for the real web client; default unchanged.
  CORS_ORIGINS: ${COST_CORS_ORIGINS:-http://127.0.0.1:5173}
  # The load generator (a container on this network, or the host via the network gateway) presents a distinct
  # cf-connecting-ip per request so the per-IP throttles are not what is measured; throttle limits are unchanged and
  # their Redis cost is still paid.
  TRUSTED_PROXY_CIDRS: ${COST_SUBNET:-172.31.70.0/24}
  APP_VERSION: costaudit-${COST_TAG:?}

services:
  pg:
    # COST_PG_IMAGE picks the PostgreSQL major (16 default; postgres:18-alpine works: PGDATA is pinned below).
    image: ${COST_PG_IMAGE:-postgres:16-alpine}
    container_name: costaudit-pg
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      - -c
      - max_connections=200
      - -c
      - max_locks_per_transaction=256
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: ${PG_SUPER_PW:?}
      POSTGRES_DB: rab
      POSTGRES_INITDB_ARGS: --data-checksums
      PGDATA: /var/lib/postgresql/data
    secrets:
      - crewflow-owner-password
    ports:
      - '127.0.0.1:${COST_PG_PORT:-25470}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Mounted file by file: on Docker Desktop (Windows) a directory bind mount of this folder has been observed to
      # list as empty inside the container, so the entrypoint's glob found nothing and skipped initialisation.
      - ./init/00-pgss.sql:/docker-entrypoint-initdb.d/00-pgss.sql:ro
      # The committed provider-admin SQL itself, file by file (its directory also holds transition-from-separated.sql, which
      # must never run on a fresh cluster). lib/check-compose.js allows exactly this one read-only bind outside this folder.
      - ../../rab-docker/postgres-init/owner-login/01-crewflow-owner.sql:/docker-entrypoint-initdb.d/01-crewflow-owner.sql:ro
      - ./init/02-cost-marker.sql:/docker-entrypoint-initdb.d/02-cost-marker.sql:ro
    shm_size: 256m
    mem_limit: 1g
    networks: [cost]
    healthcheck:
      # Ready AND the one-time owner step completed (a half-initialised volume stays unhealthy).
      test:
        - CMD-SHELL
        - "pg_isready -U rab -d rab && psql -X -U rab -d rab -Atc \"select 1 from pg_roles where rolname = 'crewflow_owner' and rolcanlogin\" | grep -qx 1"
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: costaudit-redis
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDISCLI_AUTH" --maxmemory-policy noeviction --save "" --appendonly no']
    environment:
      REDISCLI_AUTH: ${REDIS_PW:?}
    ports:
      - '127.0.0.1:${COST_REDIS_PORT:-26470}:6379'
    mem_limit: 256m
    networks: [cost]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Community MinIO fork (quay.io/minio and minio/minio images are not pullable here); pinned by digest.
    image: ${COST_MINIO_IMAGE:-pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    container_name: costaudit-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PW:?}
      # Lets MinIO accept SSE-S3 (x-amz-server-side-encryption: AES256) exactly as the S3 driver sends it.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?}
      MINIO_BROWSER: 'off'
    ports:
      - '127.0.0.1:${COST_MINIO_PORT:-29070}:9000'
    volumes:
      - minio-data:/data
    mem_limit: 384m
    networks: [cost]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: ${COST_MINIO_IMAGE:-pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    container_name: costaudit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PW: ${MINIO_ROOT_PW:?}
    entrypoint: ['sh', '-c']
    command:
      - >
        mc alias set cost http://costaudit-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PW" >/dev/null &&
        mc mb --ignore-existing cost/costaudit &&
        mc anonymous set none cost/costaudit &&
        mc encrypt set sse-s3 cost/costaudit &&
        echo bucket-ready
    networks: [cost]
    restart: 'no'

  api:
    image: crewflow-cost/server:${COST_TAG:?}
    container_name: costaudit-api
    environment:
      <<: *app-env
      PORT: '3000'
      # The ONE application login (owner-login architecture), identical for api, worker, worker2 and tool.
      PG_DATABASE_URL: postgres://crewflow_owner:${CREWFLOW_OWNER_PW:?run scripts/gen-secrets.sh}@pg:5432/rab
      # O3 C1: migrates on start (approval mode none, the production default) under the migration lock, then registers the
      # BullMQ schedulers, then main.js.
      CREWFLOW_MIGRATE_ON_START: 'true'
      CREWFLOW_MIGRATION_APPROVAL_MODE: none
      # Same switches as the worker (Phase A acceptance: flags on = API AND worker). Default false/false = code defaults =
      # production compose. Only `measure.sh flags-up` recreates the API with them on.
      REALTIME_ENABLED: ${COST_REALTIME_ENABLED:-false}
      PUSH_ENABLED: ${COST_PUSH_ENABLED:-false}
      # Phase D (E-1): event-mode phases must set the same value on the API (its writes then NOTIFY; budget counts listeners).
      WORKER_CLAIM_MODE: ${COST_WORKER_CLAIM_MODE:-per_scope}
      WORKER_DISPATCH_MODE: ${COST_WORKER_DISPATCH_MODE:-poll}
    command: ['./api-prestart.sh']
    ports:
      - '127.0.0.1:${COST_API_PORT:-23070}:3000'
    cpus: ${COST_API_CPUS:-1}
    mem_limit: ${COST_API_MEM:-768m}
    networks: [cost]
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 30
      # A fresh install applies the whole chain before main.js listens.
      start_period: 600s

  worker: &worker-svc
    image: crewflow-cost/worker:${COST_TAG:?}
    container_name: costaudit-worker
    # Phase A measurement (2026-10-27): extra worker variables for one phase (e.g. a provisioner opt-in switch) come from
    # a harness-generated env file under the results directory (scripts/measure.sh worker_up); default: the empty
    # init/empty.env. `environment:` below wins over it, so the realtime/push switches are set by interpolation instead.
    env_file:
      - ${COST_WORKER_ENV_FILE:-./init/empty.env}
    environment:
      <<: *app-env
      # The same ONE owner login as the api (also the Worker's session-lock connection, direct). Every claim mode (per_scope
      # and global) runs on it; there is no separate Worker login any more.
      PG_DATABASE_URL: postgres://crewflow_owner:${CREWFLOW_OWNER_PW:?run scripts/gen-secrets.sh}@pg:5432/rab
      PG_POOL_MAX_CONNECTIONS: '12'
      # O3 C1/C2: never migrates, only consumes the schedulers the api registered, starts after a healthy api.
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: '0'
      # O1 (one image): no CREWFLOW_PROVISIONER_DATABASE_URL pass-through any more. Provisioning runs in-process and the
      # Worker refuses any non-empty CREWFLOW_PROVISIONER_* variable.
      # Default false/false = the code defaults, which is also what the production compose runs (it sets neither key).
      # The `idleflags` phase recreates the worker with both true (COST_REALTIME_ENABLED / COST_PUSH_ENABLED).
      REALTIME_ENABLED: ${COST_REALTIME_ENABLED:-false}
      PUSH_ENABLED: ${COST_PUSH_ENABLED:-false}
      # Phase D (D1/D2): poll vs event and per_scope vs global phases; defaults = the code defaults (production sets none).
      WORKER_CLAIM_MODE: ${COST_WORKER_CLAIM_MODE:-per_scope}
      WORKER_DISPATCH_MODE: ${COST_WORKER_DISPATCH_MODE:-poll}
      WORKER_DISPATCH_BACKSTOP_SECONDS: ${COST_WORKER_DISPATCH_BACKSTOP_SECONDS:-30}
      WORKER_DISPATCH_RECONCILE_SECONDS: ${COST_WORKER_DISPATCH_RECONCILE_SECONDS:-900}
      WORKER_DISPATCH_CLAIM_BATCH: ${COST_WORKER_DISPATCH_CLAIM_BATCH:-100}
      # What the retired launcher gave its jobs child (H1-M1), as in production.
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    # O1: the same image as `api` (scripts/build-images.sh tags one build as both), the Worker command, ONE process as
    # uid 1000 under compose's init (the watchdog's SIGKILL is ignored for PID 1).
    command: ['node', 'packages/rab-worker/dist/main.js']
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    # O1: the one image has no HEALTHCHECK of its own (the retired Worker image had one); the jobs-only per-instance check
    # the production compose uses, so measure.sh docker_health keeps reporting.
    healthcheck:
      test: ['CMD', 'env', 'CREWFLOW_PROVISIONER_ENABLED=false', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    cpus: ${COST_WORKER_CPUS:-1}
    mem_limit: ${COST_WORKER_MEM:-1g}
    networks: [cost]
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  # Second Worker replica (profile `replica`; only the `replicas` phase starts it, together with a fresh `worker`, to show
  # what two concurrently booting replicas do: storage reconciles, S3 calls, SQL). Same image, config and limits.
  worker2:
    <<: *worker-svc
    container_name: costaudit-worker2
    profiles: ['replica']

  # ---- one-off ops containers (profile `ops`; never started by `up`) -------------------------------------------------
  # Runs harness scripts that need the application's own compiled code/deps (seed, history backfill, storage CLI).
  # The harness folder is mounted read-only at /cost. The history backfill renders real PDFs (@react-pdf, no browser); O1:
  # the server and worker tags are the same image, run as uid 1000 (the image's tini entrypoint just execs the command).
  tool:
    profiles: ['ops']
    image: crewflow-cost/worker:${COST_TAG:?}
    user: '1000:1000'
    environment:
      <<: *app-env
      NODE_PATH: /app/node_modules
      DB_TARGET: local
      PG_DATABASE_URL: postgres://crewflow_owner:${CREWFLOW_OWNER_PW:?run scripts/gen-secrets.sh}@pg:5432/rab
      SEED_URL: postgres://rab:${PG_SUPER_PW:?}@costaudit-pg:5432/rab
      SEED_PW: ${SEED_PW:?}
      # Docker hardening H1-M1 (main 824f0824..2733c7fb): the image's HOME is not writable by uid 1000, and Chromium's
      # crashpad handler then aborts the launch ("--database is required", SIGTRAP), so the backfill could not render.
      # Same plan the production Worker runs with: HOME=/nonexistent (not creatable), TMPDIR a private 0700 tmpfs,
      # fontconfig state in XDG_* directories inside it.
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
    volumes:
      - ./:/cost:ro
    restart: 'no'
    networks: [cost]

secrets:
  # The crewflow_owner password for 01-crewflow-owner.sql, mounted at /run/secrets/crewflow-owner-password (the file the SQL
  # reads by default), from the operator env file ($COST_SECRETS); never on a command line.
  crewflow-owner-password:
    environment: CREWFLOW_OWNER_PW

networks:
  cost:
    name: crewflow-cost-net
    ipam:
      config:
        - subnet: ${COST_SUBNET:-172.31.70.0/24}

volumes:
  pg-data:
  minio-data:
