name: crewflow-cost

# DISPOSABLE cost/performance measurement stack (Phase M). Its own project, containers (costaudit-*), network and
# volumes, loopback-only host ports. It never mounts or reaches the dev stack (rab-devdb 15432, rab-redis-1),
# crewflow-test-db/redis (15436/16391-16399), the e2e stack or any remote database.
#
# Always driven through scripts/run.sh (or lib/common.sh's `dc`), which passes:
#   --env-file $COST_SECRETS   (generated by scripts/gen-secrets.sh, OUTSIDE the repo; letters/digits only)
#   COST_TAG                   image pair crewflow-cost/{server,worker}:$COST_TAG (scripts/build-images.sh)
#
# Resource limits mirror the 2026-10-26 audit harness: API 1 CPU / 768 MB, worker 1 CPU / 1 GB, Postgres no CPU limit.
# Runtime flags mirror it too (production-like where it matters for cost): HWS_RUNTIME_ENABLED=false,
# WORKER_SCHEDULER=interval, STORAGE_DRIVER=S3 (MinIO), EMAIL_DRIVER=LOGGER, PUSH/REALTIME/AI off. NODE_ENV=development
# only because production mode refuses the LOGGER email driver and loopback URLs.

x-app-env: &app-env
  NODE_ENV: development
  RAB_RUNTIME_ENV: development
  TZ: UTC
  # Phase B (614796f0+): no DB_TARGET in the runtime env (command authority only; the API and the Worker refuse to start
  # with it, never-in-runtime-env.ts). The migrate/tool services set it themselves. One PG_DATABASE_URL per process, on
  # the compose service name `pg` (a listed local database service host, LOCAL_DATABASE_SERVICE_HOSTS).
  APP_SECRET: ${APP_SECRET:?run scripts/gen-secrets.sh}
  REDIS_URL: redis://:${REDIS_PW:?}@costaudit-redis:6379
  EMAIL_DRIVER: LOGGER
  PUSH_ENABLED: 'false'
  PUSH_PROVIDER: FAKE
  AI_ENABLED: 'false'
  HWS_RUNTIME_ENABLED: 'false'
  WORKER_SCHEDULER: interval
  STORAGE_DRIVER: S3
  STORAGE_KEY_PREFIX: ${STORAGE_KEY_PREFIX:-costaudit}
  S3_BUCKET: costaudit
  S3_REGION: us-east-1
  S3_ENDPOINT: http://costaudit-minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PW:?}
  S3_FORCE_PATH_STYLE: 'true'
  APP_URL: http://127.0.0.1:5173
  ACCOUNTS_URL: http://127.0.0.1:5173
  # screen-traffic/ (Phase C1) adds its own host Vite origin (127.0.0.1:23173) for the real web client; default unchanged.
  CORS_ORIGINS: ${COST_CORS_ORIGINS:-http://127.0.0.1:5173}
  # The load generator (a container on this network, or the host via the network gateway) presents a distinct
  # cf-connecting-ip per request so the per-IP throttles are not what is measured; throttle limits are unchanged and
  # their Redis cost is still paid.
  TRUSTED_PROXY_CIDRS: ${COST_SUBNET:-172.31.70.0/24}
  APP_VERSION: costaudit-${COST_TAG:?}

services:
  pg:
    image: postgres:16-alpine
    container_name: costaudit-pg
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      - -c
      - max_connections=200
      - -c
      - max_locks_per_transaction=256
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: ${PG_SUPER_PW:?}
      POSTGRES_DB: rab
      POSTGRES_INITDB_ARGS: --data-checksums
      COST_RAB_OWNER_PW: ${RAB_OWNER_PW:?}
    ports:
      - '127.0.0.1:${COST_PG_PORT:-25470}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Mounted file by file: on Docker Desktop (Windows) a directory bind mount of this folder has been observed to
      # list as empty inside the container, so the entrypoint's glob found nothing and skipped initialisation.
      - ./init/00-pgss.sql:/docker-entrypoint-initdb.d/00-pgss.sql:ro
      - ./init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    shm_size: 256m
    mem_limit: 1g
    networks: [cost]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: costaudit-redis
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDISCLI_AUTH" --maxmemory-policy noeviction --save "" --appendonly no']
    environment:
      REDISCLI_AUTH: ${REDIS_PW:?}
    ports:
      - '127.0.0.1:${COST_REDIS_PORT:-26470}:6379'
    mem_limit: 256m
    networks: [cost]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Community MinIO fork (quay.io/minio and minio/minio images are not pullable here); pinned by digest.
    image: ${COST_MINIO_IMAGE:-pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    container_name: costaudit-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PW:?}
      # Lets MinIO accept SSE-S3 (x-amz-server-side-encryption: AES256) exactly as the S3 driver sends it.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?}
      MINIO_BROWSER: 'off'
    ports:
      - '127.0.0.1:${COST_MINIO_PORT:-29070}:9000'
    volumes:
      - minio-data:/data
    mem_limit: 384m
    networks: [cost]
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: ${COST_MINIO_IMAGE:-pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372}
    container_name: costaudit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PW: ${MINIO_ROOT_PW:?}
    entrypoint: ['sh', '-c']
    command:
      - >
        mc alias set cost http://costaudit-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PW" >/dev/null &&
        mc mb --ignore-existing cost/costaudit &&
        mc anonymous set none cost/costaudit &&
        mc encrypt set sse-s3 cost/costaudit &&
        echo bucket-ready
    networks: [cost]
    restart: 'no'

  api:
    image: crewflow-cost/server:${COST_TAG:?}
    container_name: costaudit-api
    environment:
      <<: *app-env
      PORT: '3000'
      PG_DATABASE_URL: postgres://crewflow_app:${CREWFLOW_APP_PW:?}@pg:5432/rab
      # Same switches as the worker (Phase A acceptance: flags on = API AND worker). Default false/false = code defaults =
      # production compose. Only `measure.sh flags-up` recreates the API with them on.
      REALTIME_ENABLED: ${COST_REALTIME_ENABLED:-false}
      PUSH_ENABLED: ${COST_PUSH_ENABLED:-false}
    command: ['node', 'packages/rab-server/dist/main.js']
    ports:
      - '127.0.0.1:${COST_API_PORT:-23070}:3000'
    cpus: ${COST_API_CPUS:-1}
    mem_limit: ${COST_API_MEM:-768m}
    networks: [cost]
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker: &worker-svc
    image: crewflow-cost/worker:${COST_TAG:?}
    container_name: costaudit-worker
    # Phase A measurement (2026-10-27): extra worker variables for one phase (e.g. a provisioner opt-in switch) come from
    # a harness-generated env file under the results directory (scripts/measure.sh worker_up); default: the empty
    # init/empty.env. `environment:` below wins over it, so the realtime/push switches are set by interpolation instead.
    env_file:
      - ${COST_WORKER_ENV_FILE:-./init/empty.env}
    environment:
      <<: *app-env
      # Phase B: also the jobs child's session-lock connection (direct), as in the e2e/production compose.
      PG_DATABASE_URL: postgres://crewflow_app:${CREWFLOW_APP_PW:?}@pg:5432/rab
      PG_POOL_MAX_CONNECTIONS: '12'
      # Pass-through (no value here): lib/common.sh load_secrets exports postgres://crewflow:<CREWFLOW_PW>@costaudit-pg:5432/rab;
      # a configuration with `-CREWFLOW_PROVISIONER_DATABASE_URL` (lib/worker-env.sh) runs compose without it, so the key is
      # ABSENT from the worker (Phase A: a disabled provisioner must not hold the URL).
      CREWFLOW_PROVISIONER_DATABASE_URL:
      # Default false/false = the code defaults, which is also what the production compose runs (it sets neither key).
      # The `idleflags` phase recreates the worker with both true (COST_REALTIME_ENABLED / COST_PUSH_ENABLED).
      REALTIME_ENABLED: ${COST_REALTIME_ENABLED:-false}
      PUSH_ENABLED: ${COST_PUSH_ENABLED:-false}
    command: ['node', '/opt/crewflow-bundle/start-worker-bundle.cjs']
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /tmp/crewflow-provisioner:uid=10001,gid=10001,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
      - /run/crewflow-health/provisioner:uid=10001,gid=10001,mode=0755
    stop_grace_period: 55s
    cpus: ${COST_WORKER_CPUS:-1}
    mem_limit: ${COST_WORKER_MEM:-1g}
    networks: [cost]
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Second Worker replica (profile `replica`; only the `replicas` phase starts it, together with a fresh `worker`, to show
  # what two concurrently booting replicas do: storage reconciles, S3 calls, SQL). Same image, config and limits.
  worker2:
    <<: *worker-svc
    container_name: costaudit-worker2
    profiles: ['replica']

  # ---- one-off ops containers (profile `ops`; never started by `up`) -------------------------------------------------
  migrate:
    profiles: ['ops']
    image: crewflow-cost/server:${COST_TAG:?}
    container_name: costaudit-migrate
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      DB_TARGET: local
      CREWFLOW_MIGRATION_PHASE: ${CREWFLOW_MIGRATION_PHASE:-}
      CREWFLOW_MIGRATION_DATABASE_URL: ${CREWFLOW_MIGRATION_DATABASE_URL:-}
      CREWFLOW_BOOTSTRAP_PASSWORD: ${CREWFLOW_PW:?}
      CREWFLOW_APP_BOOTSTRAP_PASSWORD: ${CREWFLOW_APP_PW:?}
    restart: 'no'
    networks: [cost]
    command:
      - sh
      - -c
      - |
        set -eu
        url="$${CREWFLOW_MIGRATION_DATABASE_URL:-}"
        [ -n "$$url" ] || { echo "migrate: REFUSED - no migration URL" >&2; exit 64; }
        if [ "$${CREWFLOW_MIGRATION_PHASE:-}" = "A" ]; then unset CREWFLOW_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD; fi
        echo "migrate: phase $${CREWFLOW_MIGRATION_PHASE:-?}"
        unset CREWFLOW_MIGRATION_DATABASE_URL
        exec env PG_DATABASE_URL="$$url" node packages/rab-server/dist/database/typeorm/scripts/setup-db.js

  # Runs harness scripts that need the application's own compiled code/deps (seed, history backfill, storage CLI).
  # The harness folder is mounted read-only at /cost.
  tool:
    profiles: ['ops']
    image: crewflow-cost/server:${COST_TAG:?}
    environment:
      <<: *app-env
      NODE_PATH: /app/node_modules
      DB_TARGET: local
      PG_DATABASE_URL: postgres://crewflow_app:${CREWFLOW_APP_PW:?}@pg:5432/rab
      SEED_URL: postgres://rab:${PG_SUPER_PW:?}@costaudit-pg:5432/rab
      SEED_PW: ${SEED_PW:?}
    volumes:
      - ./:/cost:ro
    restart: 'no'
    networks: [cost]

networks:
  cost:
    name: crewflow-cost-net
    ipam:
      config:
        - subnet: ${COST_SUBNET:-172.31.70.0/24}

volumes:
  pg-data:
  minio-data:
