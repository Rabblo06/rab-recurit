name: crewflow-e2e

# DISPOSABLE end-to-end system stack (wave 6 lane E2E). Its own project, containers, volumes and loopback ports; it never
# mounts or reaches the dev stack (`rab`, rab_devdb_data), crewflow-test-db (15436) or any remote database.
#
# Flags are DEV-LIKE: HWS runtime routing, workspace host routing, registry-backed origin trust and the cross-host login
# handoff are all ON, exactly as packages/rab-docker/docker-compose.yml runs them. The browser reaches the console through
# a host-run Vite (system/vite.e2e.config.ts, port 5300) that proxies /rest same-origin with the Host preserved, so
# http://<label>.localhost:5300 is a workspace host.
#
# OWNER-LOGIN LIFECYCLE (the production one: packages/rab-docker/docker-compose.image.yml + docker-compose.local-db.yml;
# Phase X P0-H). ONE database login, crewflow_owner, for the server, the worker and the bootstrap one-off; ONE PG_DATABASE_URL.
#   - postgres: a fresh, disposable cluster. Its only init steps are pg_stat_statements (init/00-pgss.sql, measurement) and
#     the committed one-time provider-admin SQL, packages/rab-docker/postgres-init/owner-login/01-crewflow-owner.sql, which
#     reads the crewflow_owner password from /run/secrets/crewflow-owner-password (a compose secret fed from
#     E2E_CREWFLOW_OWNER_PASSWORD, never a command line). transition-from-separated.sql and 01-roles.sql are never mounted.
#   - server: the image's own start, ./api-prestart.sh with CREWFLOW_MIGRATE_ON_START=true: the migration child (lock,
#     classifier, whole chain, post-checks; a first-install failure never serves), then the BullMQ job-scheduler
#     registration (WORKER_SCHEDULER=bullmq), then main.js.
#   - worker: consume-only, never migrates (DISABLE_DB_MIGRATIONS=true, DISABLE_CRON_JOBS_REGISTRATION=true,
#     CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS=0), starts after a healthy server.
#   - bootstrap: the first platform admin, a one-off of the same image on the same owner login, AFTER the server is healthy
#     (packages/rab-docker/docs/release/OWNER-LOGIN-DEPLOYMENT.md section 2 step 6), DB_TARGET=local on that run only.
# There is no migrate service, no rab_owner / crewflow / crewflow_app / crewflow_worker login and no role password.
# Not production, on purpose (disposable): NODE_ENV development (no TLS verify-full, deployment identity or https origins);
# the image's default pg_hba, so the `rab` superuser may log in over loopback for the specs' read-only evidence queries and
# pg_stat_statements (production's local-db/pg_hba.conf rejects that); LOGGER email; LOCAL storage.
#
# Images are REUSED, never built here: rab-server:latest and rab-worker:latest (built from the branch head by the dev
# rollout), or the exact images named by E2E_SERVER_IMAGE / E2E_WORKER_IMAGE (e.g. a release candidate; O1: the same image
# for both). E2E_POSTGRES_IMAGE picks the PostgreSQL major (default postgres:16-alpine; postgres:18-alpine works too, PGDATA
# is pinned below). Secrets come from an operator env file outside the repo (letters/digits only):
#   E2E_PG_SUPERUSER_PASSWORD     the `rab` superuser (initdb; evidence queries and pg_stat_statements only, never an app login)
#   E2E_CREWFLOW_OWNER_PASSWORD   crewflow_owner, the ONE application login (at least 24 characters: openssl rand -hex 32)
#   E2E_APP_SECRET                application secret (32+ chars)
#
#   C="docker compose --env-file <scratchpad>/e2e.env -f packages/rab-e2e-testing/system/docker-compose.e2e.yml"
#   $C up -d postgres redis
#   $C up -d server worker                                      # the server migrates on start; the worker follows it
#   BOOTSTRAP_ADMIN_EMAIL=... $C --profile ops run --rm --no-deps bootstrap      # as crewflow_owner, never the superuser
# run-system.sh `up` does exactly this. Teardown: `$C --profile ops down -v` (removes ONLY this project's containers and
# volumes).

x-app-env: &app-env
  NODE_ENV: development
  RAB_RUNTIME_ENV: development
  # No DB_TARGET here: it is command authority, and the API, the Worker service and its children refuse to start with it
  # (security review L-4, never-in-runtime-env.ts). The one-off CLI services below set it themselves.
  REDIS_URL: redis://redis:6379
  # O3 C2 (production's scheduler mode): the server registers the BullMQ job schedulers in api-prestart.sh; the worker only
  # consumes them. The same value on both; the code default outside production is `interval`.
  WORKER_SCHEDULER: bullmq
  APP_SECRET: ${E2E_APP_SECRET:?set E2E_APP_SECRET}
  HWS_RUNTIME_ENABLED: 'true'
  WORKSPACE_BASE_DOMAIN: localhost:5300
  WORKSPACE_HOST_ROUTING_ENABLED: 'true'
  WORKSPACE_SUBDOMAIN_ORIGIN_TRUST_ENABLED: 'true'
  AUTH_LOGIN_HANDOFF_ENABLED: 'true'
  EMAIL_DRIVER: LOGGER
  CORS_ORIGINS: http://localhost:5300,http://127.0.0.1:5300
  APP_URL: http://127.0.0.1:5300
  ACCOUNTS_URL: http://127.0.0.1:5300
  STORAGE_DRIVER: LOCAL
  STORAGE_KEY_PREFIX: e2e
  # Off by default (dev-like). Spec 04 recreates server+worker with E2E_GOOGLE_ENABLED=true so an organisation may turn
  # password sign-in off without the lockout refusal; the client id/secret are inert placeholders (no real Google sign-in
  # is ever attempted on this stack).
  AUTH_GOOGLE_ENABLED: ${E2E_GOOGLE_ENABLED:-false}
  AUTH_GOOGLE_CLIENT_ID: e2e-placeholder-client-id.apps.googleusercontent.com
  AUTH_GOOGLE_CLIENT_SECRET: e2e-placeholder-not-a-secret
  AUTH_GOOGLE_CALLBACK_URL: http://127.0.0.1:5300/rest/v1/auth/google/callback
  # Not trusted unless set (dev-like default ''). The performance phase sets it to the Docker bridge gateway so a load
  # generator on this host can present distinct client IPs (X-Forwarded-For) instead of tripping the per-IP throttles.
  TRUSTED_PROXY_CIDRS: ${E2E_TRUSTED_PROXY_CIDRS:-}

services:
  postgres:
    image: ${E2E_POSTGRES_IMAGE:-postgres:16-alpine}
    command:
      - postgres
      - -c
      - max_locks_per_transaction=256
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - password_encryption=scram-sha-256
      # Statement counts for measurement windows (run-system.sh `idle`): the rows of crewflow_owner sessions, the one app login.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: ${E2E_PG_SUPERUSER_PASSWORD:?set E2E_PG_SUPERUSER_PASSWORD}
      POSTGRES_DB: rab_e2e
      POSTGRES_INITDB_ARGS: --data-checksums
      # Pinned so the same volume path works on postgres:16 and postgres:18 (18 moved its default PGDATA).
      PGDATA: /var/lib/postgresql/data
    secrets:
      - crewflow-owner-password
    ports:
      - '127.0.0.1:15470:5432'
    volumes:
      - e2e-postgres-data:/var/lib/postgresql/data
      # File by file: the owner-login directory also holds transition-from-separated.sql, which must never run on a fresh
      # cluster.
      - ./init/00-pgss.sql:/docker-entrypoint-initdb.d/00-pgss.sql:ro
      - ../../rab-docker/postgres-init/owner-login/01-crewflow-owner.sql:/docker-entrypoint-initdb.d/01-crewflow-owner.sql:ro
    mem_limit: 1536m
    shm_size: 256m
    healthcheck:
      # Ready AND the one-time owner step completed: a half-initialised volume without crewflow_owner stays unhealthy, as
      # docker-compose.local-db.yml checks it.
      test:
        - CMD-SHELL
        - "pg_isready -U rab -d rab_e2e && psql -X -U rab -d rab_e2e -Atc \"select 1 from pg_roles where rolname = 'crewflow_owner' and rolcanlogin\" | grep -qx 1"
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:16470:6379'
    volumes:
      - e2e-redis-data:/data
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ${E2E_SERVER_IMAGE:-rab-server:latest}
    environment:
      <<: *app-env
      # The ONE application login (owner-login architecture), identical on the server, the worker and bootstrap.
      PG_DATABASE_URL: postgres://crewflow_owner:${E2E_CREWFLOW_OWNER_PASSWORD:?set E2E_CREWFLOW_OWNER_PASSWORD}@postgres:5432/rab_e2e
      # O3 C1: the server migrates on start (approval mode none, the production default), under the migration lock.
      CREWFLOW_MIGRATE_ON_START: 'true'
      CREWFLOW_MIGRATION_APPROVAL_MODE: none
    volumes:
      - e2e-local-storage:/app/storage
    # The image's default command, stated as production states it: env refusals, the migration child, the scheduler
    # registration, then main.js.
    command: ['./api-prestart.sh']
    ports:
      - '127.0.0.1:3300:3000'
    mem_limit: 1280m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 15
      # A fresh install applies the whole chain before main.js listens.
      start_period: 600s

  worker:
    image: ${E2E_WORKER_IMAGE:-rab-worker:latest}
    environment:
      <<: *app-env
      # O1 (one image): the SAME image as `server` (E2E_WORKER_IMAGE may name the same digest), run as the Worker command,
      # ONE process as uid 1000 under compose's init; workspace provisioning runs in-process. PG_DATABASE_URL is also the
      # session-lock connection (direct).
      # The same ONE owner login as the server. WORKER_CLAIM_MODE / WORKER_DISPATCH_MODE unset = per_scope / poll, as in
      # production.
      PG_DATABASE_URL: postgres://crewflow_owner:${E2E_CREWFLOW_OWNER_PASSWORD:?set E2E_CREWFLOW_OWNER_PASSWORD}@postgres:5432/rab_e2e
      # O3 C1/C2: never migrates, only consumes the schedulers the server registered, starts after a healthy server.
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: '0'
      # Phase B (B5): the Worker runtime pool size, as in production.
      PG_POOL_MAX_CONNECTIONS: '12'
      # In-process provisioning interval. 5 s keeps the cadence these specs time against (05-resilience expects a
      # provisioning cycle to succeed within 30 s of a connection blip); the code default is 60 s. No CREWFLOW_PROVISIONER_*
      # variable: the Worker refuses that prefix.
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: '5'
      # What the retired launcher gave its jobs child (H1-M1), as in production.
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    command: ['node', 'packages/rab-worker/dist/main.js']
    # Docker's init as PID 1: the Worker's watchdog SIGKILLs a stalled event loop, which the kernel ignores for PID 1.
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    volumes:
      - e2e-local-storage:/app/storage
    mem_limit: 1536m
    healthcheck:
      # Jobs-only per-instance health (the provisioner role is off for this check only), as in production.
      test: ['CMD', 'env', 'CREWFLOW_PROVISIONER_ENABLED=false', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy

  # The first platform admin: a one-off of the server image on the same owner login, run by run-system.sh AFTER the server
  # is healthy (`run --rm --no-deps bootstrap`). DB_TARGET=local is command authority for this one run only; the server and
  # the worker refuse it in their own environment.
  bootstrap:
    profiles: ['ops']
    image: ${E2E_SERVER_IMAGE:-rab-server:latest}
    environment:
      <<: *app-env
      DB_TARGET: local
      PG_DATABASE_URL: postgres://crewflow_owner:${E2E_CREWFLOW_OWNER_PASSWORD:?set E2E_CREWFLOW_OWNER_PASSWORD}@postgres:5432/rab_e2e
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ['node', 'packages/rab-server/dist/command/main.js', 'bootstrap-admin']

secrets:
  # The crewflow_owner password for 01-crewflow-owner.sql, mounted at /run/secrets/crewflow-owner-password (the file the SQL
  # reads by default), from the operator env file; never on a command line.
  crewflow-owner-password:
    environment: E2E_CREWFLOW_OWNER_PASSWORD

volumes:
  e2e-postgres-data:
  e2e-redis-data:
  e2e-local-storage:
