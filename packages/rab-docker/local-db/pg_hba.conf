# Owner-login deployment, bundled PostgreSQL 16 (docker-compose.local-db.yml). First match wins.
#
# - The superuser (`postgres`) is for administration ONLY, over the container's local socket as the container's own OS
#   user (peer): `docker compose exec rab-postgres psql -U postgres -d crewflow`. It can never log in over the network.
# - crewflow_owner, the ONE application login (Option A), only over TLS with SCRAM, only to the crewflow database.
#   NODE_ENV=production clients additionally demand sslmode=verify-full (server certificate SAN = rab-postgres).
# - Everything else is rejected: no non-TLS network login for anyone, and none of the NOLOGIN/no-password roles the chain
#   creates (rab_owner, crewflow, crewflow_app, crewflow_worker, ...) can log in here.
#
# TYPE      DATABASE   USER             ADDRESS   METHOD
local       all        postgres                   peer
local       all        all                        reject
hostssl     crewflow   crewflow_owner   all       scram-sha-256
host        all        all              all       reject
hostnossl   all        all              all       reject
