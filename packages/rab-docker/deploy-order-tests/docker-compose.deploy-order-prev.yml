# Deploy-order real-container tests - TEST-ONLY overlay for an image OLDER than DB-SETUP (R254 cd7c7e32, R256 0e0a6edd):
# such an image has no worker-start.sh and an api-prestart.sh that is not meant to be the entrypoint, so its deploys use
# the previous release's OWN start-up, exactly as that release's docker-compose.image.yml declared it
# (`git show 0e0a6edd:packages/rab-docker/docker-compose.image.yml`): the image's ENTRYPOINT (tini -s), rab-api command
# ./api-prestart.sh, rab-worker command `node packages/rab-worker/dist/main.js` under compose's init, and the
# PG_DATABASE_URL value on both (that release's runtime login). The drivers add this file only while CREWFLOW_IMAGE_TAG is
# such a digest, and always with a crewflow_owner URL (those images read PG_DATABASE_URL as their runtime login and cannot
# use an admin URL). Owner decision 2026-11-18 (Twenty's way): this release's files give rab-api / rab-worker that same
# crewflow_owner URL already, and db-setup changes the password only when it does not log in, so the same compose.env
# serves NEW and a rollback.
#
# Consequence measured by run-db-setup-tests.cjs S7: rolling back to a pre-DB-SETUP digest with THIS release's compose files
# alone leaves rab-worker unable to start (./worker-start.sh is not in the old image): a rollback across DB-SETUP uses the
# previous release's compose files.
#
# Such an image has no db-setup.sh either, so db-setup does nothing here (exit 0, rab-api's depends_on is satisfied).
# PG_DATABASE_URL below is the production files' own expression (the crewflow_owner URL), repeated so the old image's login
# is explicit in this overlay.

services:
  db-setup:
    entrypoint: ["/bin/sh", "-c", "exit 0"]

  rab-api:
    entrypoint: ["/sbin/tini", "-s", "--"]
    command: ["./api-prestart.sh"]
    environment:
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgresql://crewflow_owner:${PG_DATABASE_APP_PASSWORD:-}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-crewflow}?sslmode=verify-full}

  rab-worker:
    entrypoint: ["/sbin/tini", "-s", "--"]
    command: ["node", "packages/rab-worker/dist/main.js"]
    init: true
    environment:
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgresql://crewflow_owner:${PG_DATABASE_APP_PASSWORD:-}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-crewflow}?sslmode=verify-full}
