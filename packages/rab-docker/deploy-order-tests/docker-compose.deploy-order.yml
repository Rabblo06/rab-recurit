# Deploy-order real-container tests - TEST-ONLY INFRASTRUCTURE overlay, used ONLY by the drivers of this folder
# (run-deploy-order-tests.cjs, run-upgrade-with-data-tests.cjs, run-db-setup-tests.cjs):
#
#   COMPOSE_PROJECT_NAME=<project> COMPOSE_ENV_FILES=<secrets>/compose.env COMPOSE_PATH_SEPARATOR=';' \
#   COMPOSE_FILE='docker-compose.image.yml;deploy-order-tests/docker-compose.deploy-order.yml[;...]' \
#     docker compose pull && docker compose up -d
#
# The application services (rab-api, rab-worker) and the bundled database (`db`, DB-SETUP) are the production file
# UNCHANGED: same image variables, commands, environment, hardening, health checks and depends_on (restart: true). The db's
# data and CA live in the project's own named volumes (`<project>_crewflow-db-data`, `<project>_crewflow-db-ca`), because
# the app services read the db's CA from the shared volume and the restart cases need the data to survive a `down`/`up`;
# every driver's cleanup is `docker compose down --volumes` of its own project. This overlay changes only:
#   - rab-redis: data on a tmpfs;
#   - rab-api: no host port (the drivers use `docker exec ... wget`).
# (docker-compose.local-db.yml, which this overlay used to extend with a test rab-postgres, is retired: DB-SETUP D3.)
# Relative paths resolve from packages/rab-docker (the first compose file's directory). Nothing here is a deployment file.

services:
  rab-redis:
    volumes: !override
      - ${CREWFLOW_SECRETS_DIR:?}/redis-users.acl:/run/secrets/redis-users.acl:ro
    tmpfs: !override
      - /tmp:size=8m,mode=1777
      - /data:uid=999,gid=1000,mode=0700

  rab-api:
    ports: !reset []
