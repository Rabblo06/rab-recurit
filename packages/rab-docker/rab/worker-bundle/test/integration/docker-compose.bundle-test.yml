# ISOLATED, DISPOSABLE integration stack for the Worker bundle. Never the development stack, never Neon/OpenShip/cloud.
#
# Always run with its own project name (the harness does):  docker compose -p crewflow-bundle-test -f <this file> ...
# Everything here — containers, the network and the volumes — belongs to that project only and is removed by the
# harness (`down -v`) when it finishes. No host ports are published. Its PostgreSQL is a throwaway container
# initialised by postgres-init/01-roles.sql and migrated by the guarded runner (the ONLY migration run, and only here).
#
# Credentials are random per run, generated by run-integration.cjs and passed as environment variables; none is stored.
# Email goes to a local SMTP sink (smtp-sink.cjs) — nothing leaves this network. Push is disabled.

x-common-runtime: &common-runtime
  NODE_ENV: development
  RAB_RUNTIME_ENV: development
  REDIS_URL: redis://redis:6379
  APP_SECRET: ${BT_APP_SECRET:?generated by the harness}
  EMAIL_DRIVER: SMTP
  EMAIL_SMTP_HOST: smtp
  EMAIL_SMTP_PORT: '2525'
  EMAIL_SMTP_NO_TLS: 'true'
  EMAIL_FROM_ADDRESS: 'Crewflow bundle test <no-reply@bundle-test.invalid>'
  APP_URL: http://127.0.0.1:5173
  ACCOUNTS_URL: http://127.0.0.1:5173
  CORS_ORIGINS: http://127.0.0.1:5173
  STORAGE_DRIVER: LOCAL
  STORAGE_KEY_PREFIX: bundletest
  PUSH_ENABLED: 'false'

x-bundle: &bundle
  image: ${BT_BUNDLE_IMAGE:-crewflow-worker-bundle:bundle-test}
  # The exact production security settings (packages/rab-docker/docker-compose.production.yml, rab-worker).
  user: '0:0'
  read_only: true
  cap_drop: [ALL]
  cap_add: [SETUID, SETGID, KILL]
  security_opt: ['no-new-privileges:true']
  tmpfs:
    - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
    - /tmp/crewflow-provisioner:uid=10001,gid=10001,mode=0700
    - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    - /run/crewflow-health/provisioner:uid=10001,gid=10001,mode=0755
  stop_grace_period: 55s
  restart: unless-stopped
  volumes:
    - bundle-storage:/app/storage
  environment:
    <<: *common-runtime
    DATABASE_URL: postgres://crewflow_app:${BT_APP_PASSWORD:?}@pg:5432/rab
    DATABASE_DIRECT_URL: postgres://crewflow_app:${BT_APP_PASSWORD:?}@pg:5432/rab
    CREWFLOW_PROVISIONER_DATABASE_URL: postgres://crewflow:${BT_CREWFLOW_PASSWORD:?}@pg:5432/rab
    # Phase A (pa-provisioner): opt-in provisioner; 5 s keeps the pre-Phase-A cadence the harness times against.
    CREWFLOW_PROVISIONER_ENABLED: 'true'
    WORKSPACE_PROVISIONER_INTERVAL_SECONDS: '5'
  healthcheck:
    test: ['CMD', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
    interval: 10s
    timeout: 10s
    retries: 3
    start_period: 60s
  depends_on:
    pg:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: ${BT_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: rab
    volumes:
      - ../../../../postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab']
      interval: 2s
      timeout: 5s
      retries: 30

  # A second, unrelated PostgreSQL cluster — used only to prove the launcher's live cross-check refuses a provisioner
  # that reached a different cluster than the jobs process.
  pg-other:
    image: postgres:16-alpine
    profiles: ['mismatch']
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: ${BT_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: rab
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  smtp:
    image: node:24-alpine
    user: '1000:1000'
    read_only: true
    command: ['node', '/sink/smtp-sink.cjs']
    tmpfs:
      - /out:uid=1000,gid=1000,mode=0755
    volumes:
      - ./smtp-sink.cjs:/sink/smtp-sink.cjs:ro

  # One-off guarded migration runner (profile-gated, never automatic) — same command shape as the dev `migrate` service.
  migrate:
    image: ${BT_APP_IMAGE:-crewflow-app:bundle-test}
    profiles: ['migrate']
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      DB_TARGET: local
      MIGRATION_URL: ${BT_MIGRATION_URL:-}
      CREWFLOW_BOOTSTRAP_PASSWORD: ${BT_BOOTSTRAP_CREWFLOW:-}
      CREWFLOW_APP_BOOTSTRAP_PASSWORD: ${BT_BOOTSTRAP_APP:-}
    command: ['sh', '-c', 'exec env DATABASE_URL="$$MIGRATION_URL" DATABASE_URL_UNPOOLED="$$MIGRATION_URL" node packages/rab-server/dist/database/typeorm/scripts/setup-db.js']
    restart: 'no'

  # One-off CLI (fixture seeding as `crewflow`, guarded by DB_TARGET=local).
  cli:
    image: ${BT_APP_IMAGE:-crewflow-app:bundle-test}
    profiles: ['cli']
    environment:
      <<: *common-runtime
      DB_TARGET: local
      DATABASE_URL: postgres://crewflow:${BT_CREWFLOW_PASSWORD:?}@pg:5432/rab
      SEED_QA_PASSWORD: ${BT_FIXTURE_PASSWORD:-}
    entrypoint: ['node', 'packages/rab-server/dist/command/main.js']
    restart: 'no'

  # The API, restricted exactly as in production (crewflow_app only, no provisioning credential).
  api:
    image: ${BT_APP_IMAGE:-crewflow-app:bundle-test}
    command: ['node', 'packages/rab-server/dist/main.js']
    environment:
      <<: *common-runtime
      DATABASE_URL: postgres://crewflow_app:${BT_APP_PASSWORD:?}@pg:5432/rab
    volumes:
      - bundle-storage:/app/storage
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 3s
      timeout: 5s
      retries: 40
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-a:
    <<: *bundle

  worker-b:
    <<: *bundle
    profiles: ['second']

  # Same settings WITHOUT read_only — proves ownership alone (not just a read-only filesystem) protects shared code,
  # which is what a platform that cannot honour read_only would rely on.
  worker-rw:
    <<: *bundle
    profiles: ['rw']
    read_only: false

  # A bundle whose provisioner connection reaches a DIFFERENT cluster (pg-other) — must be refused by the live cross-check.
  worker-mismatch:
    <<: *bundle
    profiles: ['mismatch']
    restart: 'no'
    environment:
      <<: *common-runtime
      DATABASE_URL: postgres://crewflow_app:${BT_APP_PASSWORD:?}@pg:5432/rab
      DATABASE_DIRECT_URL: postgres://crewflow_app:${BT_APP_PASSWORD:?}@pg:5432/rab
      CREWFLOW_PROVISIONER_DATABASE_URL: postgres://crewflow:${BT_CREWFLOW_PASSWORD:?}@pg-other:5432/rab
      CREWFLOW_PROVISIONER_ENABLED: 'true'
      CREWFLOW_BUNDLE_FAILURE_EXIT_DELAY_MS: '0'

  # Phase A (pa-provisioner): disabled bundle — explicit opt-out, no privileged URL at all: the launcher must start the
  # jobs child alone and the health check must expect jobs only. (An unset switch keeps the pre-Phase-A behaviour:
  # provisioner on, URL required.)
  worker-noprov:
    <<: *bundle
    profiles: ['noprov']
    environment:
      <<: *common-runtime
      DATABASE_URL: postgres://crewflow_app:${BT_APP_PASSWORD:?}@pg:5432/rab
      DATABASE_DIRECT_URL: postgres://crewflow_app:${BT_APP_PASSWORD:?}@pg:5432/rab
      CREWFLOW_PROVISIONER_ENABLED: 'false'

volumes:
  bundle-storage:
