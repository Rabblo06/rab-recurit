# ISOLATED, DISPOSABLE infrastructure for the Lane A BullMQ worker-migration tests. Never the development stack.
#
#   docker compose -p crewflow-bullmq -f <this file> up -d --wait
#
# Loopback-only host ports (15480 PostgreSQL, 16480 Redis noeviction, 16481 Redis allkeys-lru) so host-side jest suites
# and host-run jobs-process replicas (ts-node packages/rab-worker/src/main.ts) can reach it. Credentials are throwaway
# and random per run (generated by run-bullmq-cluster.cjs); nothing here is reused by any other stack. Remove with
#   docker compose -p crewflow-bullmq -f <this file> down -v
name: crewflow-bullmq

services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: ${BQ_SUPERUSER_PASSWORD:?generated by the harness}
      POSTGRES_DB: rab
    ports:
      - '127.0.0.1:15480:5432'
    volumes:
      - ../../../../postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab']
      interval: 2s
      timeout: 5s
      retries: 30

  # BullMQ-safe Redis: maxmemory-policy noeviction stated explicitly (Redis 7's implicit default) — the preflight checks it.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'no']
    ports:
      - '127.0.0.1:16480:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  # An evicting Redis: bullmq mode must refuse to start against it.
  redis-lru:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '127.0.0.1:16481:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  # Worker replicas (profile `bundle`) — O1 (one image): the real Crewflow image (rab/Dockerfile) run as the Worker
  # command, with the security settings and jobs-only health check of the production rab-worker service: ONE process as
  # uid 1000 under compose's init, workspace provisioning in-process. bullmq mode by default. Used for the Linux-only
  # cases (SIGTERM drain, per-instance health). No host ports.
  # KNOWN GAP (pre-existing since #72, not changed here): like run-bullmq-cluster.cjs, this harness still uses the
  # separated logins (crewflow_app, legacy DATABASE_URL names); the runtime now requires the owner login (crewflow_owner).
  bundle-a: &bundle
    image: ${BQ_BUNDLE_IMAGE:-crewflow-image:lane-a}
    profiles: ['bundle']
    command: ['node', 'packages/rab-worker/dist/main.js']
    # Docker's init as PID 1: the Worker's watchdog SIGKILLs a stalled event loop, which the kernel ignores for PID 1.
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    restart: 'no'
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      DATABASE_URL: postgres://crewflow_app:${BQ_APP_PASSWORD:?}@pg:5432/rab
      DATABASE_DIRECT_URL: postgres://crewflow_app:${BQ_APP_PASSWORD:?}@pg:5432/rab
      # In-process provisioning every 5 s. No CREWFLOW_PROVISIONER_* variable: the Worker refuses that prefix.
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: '5'
      # What the retired launcher gave its jobs child (H1-M1), as in production.
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${BQ_APP_SECRET:?}
      EMAIL_DRIVER: LOGGER
      APP_URL: http://127.0.0.1:5173
      ACCOUNTS_URL: http://127.0.0.1:5173
      CORS_ORIGINS: http://127.0.0.1:5173
      STORAGE_DRIVER: LOCAL
      STORAGE_KEY_PREFIX: bqbundle
      HWS_RUNTIME_ENABLED: 'false'
      WORKER_SCHEDULER: ${BQ_WORKER_SCHEDULER:-bullmq}
      WORKER_SCHEDULER_RECONCILE_SECONDS: '15'
    healthcheck:
      # Jobs-only per-instance health (the provisioner role is off for this check only), as in production.
      test: ['CMD', 'env', 'CREWFLOW_PROVISIONER_ENABLED=false', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  bundle-b:
    <<: *bundle
