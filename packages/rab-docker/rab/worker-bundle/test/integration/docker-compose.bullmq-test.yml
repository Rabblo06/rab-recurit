# ISOLATED, DISPOSABLE infrastructure for the Lane A BullMQ worker-migration tests. Never the development stack.
#
#   docker compose -p crewflow-bullmq -f <this file> up -d --wait
#
# Loopback-only host ports (15480 PostgreSQL, 16480 Redis noeviction, 16481 Redis allkeys-lru) so host-side jest suites
# and host-run jobs-process replicas (ts-node packages/rab-worker/src/main.ts) can reach it. Credentials are throwaway
# and random per run (generated by run-bullmq-cluster.cjs); nothing here is reused by any other stack. Remove with
#   docker compose -p crewflow-bullmq -f <this file> down -v
name: crewflow-bullmq

services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: ${BQ_SUPERUSER_PASSWORD:?generated by the harness}
      POSTGRES_DB: rab
    ports:
      - '127.0.0.1:15480:5432'
    volumes:
      - ../../../../postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab']
      interval: 2s
      timeout: 5s
      retries: 30

  # BullMQ-safe Redis: maxmemory-policy noeviction stated explicitly (Redis 7's implicit default) — the preflight checks it.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction', '--appendonly', 'no']
    ports:
      - '127.0.0.1:16480:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  # An evicting Redis: bullmq mode must refuse to start against it.
  redis-lru:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru']
    ports:
      - '127.0.0.1:16481:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  # Worker BUNDLE replicas (profile `bundle`) — the real image, launcher, jobs + provisioner children, security settings
  # and health check of the production rab-worker service, in bullmq mode by default. Used for the Linux-only cases
  # (SIGTERM drain, per-instance health, launcher tests as root). No host ports.
  bundle-a: &bundle
    image: ${BQ_BUNDLE_IMAGE:-crewflow-worker-bundle:lane-a}
    profiles: ['bundle']
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /tmp/crewflow-provisioner:uid=10001,gid=10001,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
      - /run/crewflow-health/provisioner:uid=10001,gid=10001,mode=0755
    stop_grace_period: 55s
    restart: 'no'
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      DATABASE_URL: postgres://crewflow_app:${BQ_APP_PASSWORD:?}@pg:5432/rab
      DATABASE_DIRECT_URL: postgres://crewflow_app:${BQ_APP_PASSWORD:?}@pg:5432/rab
      CREWFLOW_PROVISIONER_DATABASE_URL: postgres://crewflow:${BQ_CREWFLOW_PASSWORD:?}@pg:5432/rab
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${BQ_APP_SECRET:?}
      EMAIL_DRIVER: LOGGER
      APP_URL: http://127.0.0.1:5173
      ACCOUNTS_URL: http://127.0.0.1:5173
      CORS_ORIGINS: http://127.0.0.1:5173
      STORAGE_DRIVER: LOCAL
      STORAGE_KEY_PREFIX: bqbundle
      HWS_RUNTIME_ENABLED: 'false'
      WORKER_SCHEDULER: ${BQ_WORKER_SCHEDULER:-bullmq}
      WORKER_SCHEDULER_RECONCILE_SECONDS: '15'
    healthcheck:
      test: ['CMD', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  bundle-b:
    <<: *bundle
