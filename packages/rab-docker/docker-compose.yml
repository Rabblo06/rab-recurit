name: rab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: rab
      POSTGRES_DB: rab
    ports:
      - '5432:5432'
    volumes:
      - rab-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - rab-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rab-postgres-data:
  rab-redis-data:
