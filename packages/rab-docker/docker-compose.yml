name: rab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: rab
      POSTGRES_DB: rab
    ports:
      # 55432, not 5432 — this dev machine also has native Windows
      # PostgreSQL services (postgresql-x64-17/18) that own host ports 5432
      # AND 5433 (confirmed: a plain TCP listener check found `postgres.exe`,
      # not docker-proxy, bound to both), silently shadowing this container
      # for anything connecting via `localhost` from the host. A distinctly
      # non-standard port sidesteps guessing which ports those native
      # instances claim next. Internal container-to-container traffic
      # (`postgres:5432` on the compose network) is unaffected either way —
      # only host-side tools (this project's own Jest runs, psql from a host
      # shell) need the remapped port.
      - '55432:5432'
    volumes:
      - rab-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - rab-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # S3-compatible object storage for LOCAL DEVELOPMENT AND CI ONLY (profile `s3`,
  # start with `docker compose --profile s3 up -d minio minio-init`). It lets the
  # real S3 driver be exercised without cloud credentials. The credentials below
  # are a throwaway dev pair for a container that is never exposed beyond
  # localhost — production uses a real provider with least-privilege IAM.
  # The bucket is PRIVATE (no anonymous policy), versioned, and never public.
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    profiles: ['s3']
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rab_minio_dev
      MINIO_ROOT_PASSWORD: rab_minio_dev_only_secret
      # Throwaway dev key so MinIO accepts SSE-S3 (`x-amz-server-side-encryption: AES256`) exactly as AWS does.
      MINIO_KMS_SECRET_KEY: 'rab-dev-key:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - rab-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ['s3']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 rab_minio_dev rab_minio_dev_only_secret &&
      mc mb --ignore-existing local/rab-dev &&
      mc anonymous set none local/rab-dev &&
      mc version enable local/rab-dev &&
      mc encrypt set sse-s3 local/rab-dev &&
      echo bucket-ready"

  server:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    env_file:
      - ../rab-server/.env
    environment:
      # rab_app (NOBYPASSRLS, not the table owner) is the only role the
      # running server ever connects as — see postgres-init/01-roles.sql and
      # rab-workforce-architecture.md §5.7. start.sh runs migrations against
      # DATABASE_URL_UNPOOLED (the owner role) and then execs main.js against
      # this DATABASE_URL unchanged, matching render.yaml's production split.
      DATABASE_URL: postgres://rab_app:rab_app_dev_only@postgres:5432/rab
      DATABASE_URL_UNPOOLED: postgres://rab_owner:rab_owner_dev_only@postgres:5432/rab
      REDIS_URL: redis://redis:6379
      # Same reasoning as DATABASE_URL above: ../rab-server/.env may carry a
      # real SMTP driver setting for occasional non-Docker use (confirmed:
      # EMAIL_DRIVER=SMTP with no SMTP_HOST set at all — an unverified,
      # ambiguous state, not a confirmed-safe one). The local stack forces
      # LOGGER unconditionally so no local run can ever attempt a real send,
      # regardless of what's in the on-disk .env at the time.
      EMAIL_DRIVER: LOGGER
      # Local audit environment only — the browser reaches the frontend at
      # both http://localhost:5173 and http://127.0.0.1:5173 depending on
      # which one Docker's port-forwarding is currently honoring on this
      # machine (see F002/F003 in .audit/overnight-audit/FINDINGS.md); CORS
      # rejects a same-machine-but-different-origin request otherwise. The
      # application's own `CORS_ORIGINS` default (env.validation.ts) stays
      # exactly as it was; this only adds a second allowed local origin.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Real S3-compatible object storage (MinIO, this compose file's own
      # `minio` service) — the same shared-storage architecture API and
      # Worker use in staging/production, exercised locally instead of
      # silently falling back to each container's own LOCAL disk (which
      # would NOT be shared between server and worker containers). The
      # credentials are the throwaway dev pair defined on the `minio`
      # service above, never real cloud credentials.
      STORAGE_DRIVER: S3
      S3_BUCKET: rab-dev
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_minio_dev
      S3_SECRET_ACCESS_KEY: rab_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: AES256
      STORAGE_KEY_PREFIX: dev
    command: ./start.sh
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    env_file:
      - ../rab-server/.env
    environment:
      # rab_app for ordinary DB access — the worker never runs migrations,
      # so it never needs the owner credential for THAT. It DOES still need
      # DATABASE_URL_UNPOOLED as rab_owner for its own cross-org claim step
      # (email-dispatch.job.ts's DISABLE/ENABLE ROW LEVEL SECURITY bracket,
      # matching account-invite-cleanup.job.ts's established precedent) —
      # explicitly overridden here for the same reason DATABASE_URL is:
      # ../rab-server/.env may carry a real (e.g. Neon) connection string for
      # occasional non-Docker use, which would otherwise leak through
      # unmasked and point this container at a completely different
      # database than the rest of the local stack.
      DATABASE_URL: postgres://rab_app:rab_app_dev_only@postgres:5432/rab
      DATABASE_URL_UNPOOLED: postgres://rab_owner:rab_owner_dev_only@postgres:5432/rab
      REDIS_URL: redis://redis:6379
      # Same reasoning as the server service's own identical override —
      # the worker is the process that actually dispatches queued email
      # jobs, so this is the more load-bearing of the two overrides.
      EMAIL_DRIVER: LOGGER
      # Same shared MinIO the server uses — see the server service's own
      # comment. This is the point of the exercise: the Worker generates a
      # report PDF into the SAME bucket the API (and any other Worker
      # replica) reads from, with no shared container disk involved.
      STORAGE_DRIVER: S3
      S3_BUCKET: rab-dev
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_minio_dev
      S3_SECRET_ACCESS_KEY: rab_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: AES256
      STORAGE_KEY_PREFIX: dev
    command: node packages/rab-server/dist/queue-worker/main.js
    depends_on:
      server:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Dev-only convenience service — no custom Dockerfile, unlike server/worker's
  # production rab-target image. Bind-mounts the repo for Vite hot reload;
  # node_modules is a named volume instead, so the container gets its own
  # Linux-native install rather than reusing whatever host OS built ../../node_modules.
  front:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../..:/app
      - rab-front-node-modules:/app/node_modules
    environment:
      # `api.ts`'s baseURL default is `http://localhost:3000/...` — the
      # BROWSER (a host-side process, not part of the Docker network) calls
      # this directly, and on this machine `localhost` resolves to `::1`
      # first while Docker's port-forwarding only reliably handles IPv4.
      # 127.0.0.1 sidesteps that entirely. Local dev/audit environment
      # config only — never change the application's own hardcoded default.
      VITE_API_URL: http://127.0.0.1:3000/rest/v1
    command: sh -c "corepack enable && yarn install --immutable && cd packages/rab-front && npx vite --port 5173 --host 0.0.0.0"
    ports:
      - '5173:5173'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — Vite's --host 0.0.0.0 binds IPv4 only,
      # but "localhost" resolves to ::1 first inside this Alpine image, so
      # the IPv6 loopback attempt gets refused even though the server is up.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173/']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  adminer:
    image: adminer:latest
    ports:
      - '8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rab-postgres-data:
  rab-redis-data:
  rab-minio-data:
  rab-front-node-modules:
