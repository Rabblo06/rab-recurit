name: rab

# LOCAL DEVELOPMENT STACK on production's database setup (OWNER-DB-ULTIMATE.md Part F2, X2.3; Part A = PR #125, the Twenty
# Helm model, twentyhq/twenty@eedb0a73 packages/twenty-docker/helm/twenty/templates/deployment-server.yaml:81-130,
# secret-db-url.yaml:3-30, deployment-worker.yaml:76-90). The same services and lifecycle as docker-compose.production.yml,
# built from source, with development settings:
#   db        the bundled PostgreSQL, a VERBATIM copy of docker-compose.production.yml's `db` (TLS with its own CA,
#             TLS-only SCRAM logins, non-root, internal network only). compose-credential-isolation.cjs fails if the two
#             renders ever differ. Never published (see "Ports" below).
#   db-setup  the one-shot setup (./db-setup.sh, the same image as server/worker). The ONLY service with a database URL:
#             the bundled db's superuser, PINNED here (dev never takes an external PG_DATABASE_URL, so a stray shell variable
#             can never point it at another database). First start: creates crewflow_owner with a RANDOM password it stores
#             in the crewflow-db-target volume (0400, 1000:1000); every later start reuses that file and changes nothing.
#             It also writes the credential-free target.json. It never receives APP_SECRET (no env_file).
#   server    rab-api: ./api-prestart.sh (PID 1) builds the crewflow_owner URL from target.json + the password file (both
#             read-only), migrates on start under the migration lock (approval mode none), registers the BullMQ job
#             schedulers, then serves. Its PG_DATABASE_URL is pinned EMPTY (the script refuses any value).
#   worker    rab-worker: ./worker-start.sh (PID 1) builds the same URL; never migrates, only consumes the schedulers, starts
#             after a healthy server.
#   redis     AOF + noeviction (the consume-only Worker cannot recreate lost schedulers; the next server start does).
#   front     Vite with hot reload (unchanged).
# One login, crewflow_owner (never superuser or BYPASSRLS); FORCE RLS, both RESET ROLEs, the migration lock and every
# refusal are the image's own and unchanged.
#
# SECRETS (never committed):
#   packages/rab-docker/.env (git-ignored): CREWFLOW_DEV_DB_PASSWORD=<openssl rand -hex 32>, the bundled db's superuser
#     password. HEX ONLY: it is interpolated unencoded into db-setup's admin URL. Read by `db` only on its volume's first
#     start. Only `db` and `db-setup` receive it. Dev deliberately does not use production's variable name, so a value meant
#     for one never configures the other.
#   packages/rab-server/.env (git-ignored; template .env.example): APP_SECRET and the other application settings, read by
#     server and worker. Its database settings (PG_DATABASE_URL, DB_TARGET, the CA path, ...) are for a host-native
#     `yarn start` and are overridden below: the containers' database comes ONLY from db-setup's files.
#
# FIRST RUN (the server applies the whole migration chain on its first start, health start_period 600 s). Create the
# database volume ONCE (it is external, see VOLUMES), then start:
#   docker volume create crewflow_dev_db_data
#   docker compose -f packages/rab-docker/docker-compose.yml up -d --build
# First platform admin, once the server is healthy (a one-off of the server image; api-prestart.sh builds the same URL):
#   docker compose -f packages/rab-docker/docker-compose.yml run --rm --no-deps -e DB_TARGET=local \
#     -e BOOTSTRAP_ADMIN_EMAIL=you@example.test server node packages/rab-server/dist/command/main.js bootstrap-admin
# psql (inside the db container; every login needs the password, PGPASSWORD = CREWFLOW_DEV_DB_PASSWORD):
#   docker compose -f packages/rab-docker/docker-compose.yml exec -e PGPASSWORD db psql -U postgres -d crewflow
# `down -v` KEEPS the database (owner decision 2026-11-14): it removes the project-scoped volumes only. To really start
# over, deliberately: `down -v`, then `docker volume rm crewflow_dev_db_data`, then create it again.
#
# PORTS (loopback only): server 3000 (the browser, mobile, curl), front 5173; minio 9000/9001 (profile s3) and adminer 8080
# (profile tools). The database is NOT published: nothing in this stack needs it from the host, and its certificate names
# `db`, so a host connection could not verify it. Redis is not published.
#
# VOLUMES (owner decision 2026-11-14: the dev database survives `docker compose down -v`):
#   crewflow_dev_db_data  the db's DATA volume (cluster + server TLS key): EXTERNAL, this fixed dev-only name, created once
#                         by hand (above). Compose never creates or removes it; `up` without it fails (fail closed).
#                         The name is the same whatever the project name: a second stack on it is refused by the db's
#                         one-server lock. It is never rab_devdb_data (the previous dev database, untouched).
#   everything else       project-scoped, removed by `down -v`: rab_crewflow-db-ca (the db's CA certificate),
#                         rab_crewflow-db-target (db-setup's target + crewflow_owner password file), redis, local storage,
#                         minio. Losing the CA or the password file is recovered on the next `up`, automatically and
#                         safely: the db entrypoint makes a new CA + server certificate when ca.crt is missing, and db-setup,
#                         finding no password file but the bundled superuser URL, stores a new random password first and
#                         resets crewflow_owner to it (Part A's lost-file path, Crewflow addition A4) before server and
#                         worker start (they read it). Nothing else in the database changes.
# This file no longer names rab_devdb_data, rab_rab-redis-data or rab_rab-local-storage, and nothing here reads, attaches
# or changes them.
# CUT-OVER from the previous dev stack (devdb + migrate, separated logins): an owner decision. `up` with this file under the
# same project leaves the old `rab-devdb` container running as an orphan with its data untouched (never pass
# --remove-orphans unless you mean to stop it); the new stack starts empty (owner decision 2026-11-14: a fresh database).

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  # ---------------------------------------------------------------------------
  # db — VERBATIM copy of docker-compose.production.yml's `db` (the comments there explain every line). Change it there
  # first, then copy it here and to docker-compose.qa.yml: compose-credential-isolation.cjs compares the rendered services.
  # ---------------------------------------------------------------------------
  db:
    image: ${CREWFLOW_POSTGRES_IMAGE:-postgres@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # The data volume root arrives world-writable (copied from the image): only postgres may write it.
        chmod 0755 /var/lib/postgresql
        # ONE server per data volume (2026-10-15 incident: two postgres servers on one data directory corrupt it). A kernel
        # lock on the volume itself, taken before anything here touches the volume, held by the server for its whole life (fd 8
        # survives every exec and is inherited by every postgres process); any second container on this volume refuses.
        exec 8>/var/lib/postgresql/.crewflow-server.lock
        flock -n 8 || { echo 'crewflow-db: another server already holds this data volume - refusing' >&2; exit 1; }
        cd /var/lib/postgresql
        if ! { [ -s tls/server.key ] && [ -s tls/server.crt ] && [ -s /var/tmp/ca.crt ] &&
          openssl verify -CAfile /var/tmp/ca.crt tls/server.crt >/dev/null 2>&1 &&
          openssl x509 -checkend 2592000 -noout -in tls/server.crt >/dev/null 2>&1; }; then
          echo 'crewflow-db: creating the bundled database CA and server certificate (CN/SAN db)'
          rm -rf /var/lib/postgresql/tls.new
          ( umask 077; mkdir /var/lib/postgresql/tls.new )
          cd /var/lib/postgresql/tls.new
          openssl req -x509 -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout ca.key -out ca.crt -days 3650 -subj '/CN=crewflow bundled db CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' 2>/dev/null
          openssl req -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout server.key -out server.csr -subj '/CN=db' 2>/dev/null
          printf 'subjectAltName=DNS:db\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 3649 -extfile server.ext 2>/dev/null
          rm -f ca.key ca.srl server.csr server.ext
          chmod 0600 server.key
          chmod 0644 server.crt ca.crt
          if [ "$$(id -u)" = 0 ]; then chown -R postgres:postgres /var/lib/postgresql/tls.new; fi
          cd /var/lib/postgresql
          rm -rf /var/lib/postgresql/tls
          mv tls.new tls
          cp tls/ca.crt /var/tmp/ca.crt.new
          chmod 0644 /var/tmp/ca.crt.new
          mv /var/tmp/ca.crt.new /var/tmp/ca.crt
        fi
        # TLS-only network logins (PR #125 review, finding 5), written on every start so an existing volume gets it too:
        # SCRAM over the socket; every TCP login must be TLS (hostssl) and SCRAM; there is no plain `host` line at all.
        printf 'local all all scram-sha-256\nhostssl all all 0.0.0.0/0 scram-sha-256\nhostssl all all ::/0 scram-sha-256\n' > /var/lib/postgresql/tls/pg_hba.conf.new
        chmod 0600 /var/lib/postgresql/tls/pg_hba.conf.new
        if [ "$$(id -u)" = 0 ]; then chown postgres:postgres /var/lib/postgresql/tls/pg_hba.conf.new; fi
        mv /var/lib/postgresql/tls/pg_hba.conf.new /var/lib/postgresql/tls/pg_hba.conf
        exec docker-entrypoint.sh "$$@"
      - crewflow-db
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/var/lib/postgresql/tls/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: crewflow
      # T-2 (owner decision D4): an environment variable, like Twenty (OpenShip has no secret files).
      POSTGRES_PASSWORD: ${CREWFLOW_DEV_DB_PASSWORD:?set CREWFLOW_DEV_DB_PASSWORD in packages/rab-docker/.env (hex only, openssl rand -hex 32)}
      # SCRAM for socket and TCP logins alike: no trust (the image default for loopback TCP) and no peer.
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256 --data-checksums
      # The cluster lives in a subdirectory of the data volume, beside the server's TLS key (tls/); fixed for every major.
      PGDATA: /var/lib/postgresql/pgdata
      # psql history and the like go to the private tmpfs, never to a volume.
      HOME: /tmp
    volumes:
      - crewflow-db-data:/var/lib/postgresql
      # Holds only ca.crt: mounted read-only by rab-api and rab-worker.
      - crewflow-db-ca:/var/tmp
    networks: [crewflow-db]
    healthcheck:
      # TCP, not the socket: the image's first-start init runs a socket-only temporary server, which must not count.
      test: ["CMD-SHELL", "pg_isready -q -h localhost -p 5432 -U postgres -d crewflow"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    # SIGINT = PostgreSQL fast shutdown (checkpoint, then exit); give it time before SIGKILL.
    stop_signal: SIGINT
    stop_grace_period: 90s
    logging: *logging
    # The image's own postgres user (999:999 in the Debian image): it initialises the cluster as that user, no capability.
    user: '999:999'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=2775
      - /tmp:uid=999,gid=999,mode=0700
      # The 16/17 images' default data directory (their VOLUME): empty and read-only, never an anonymous volume.
      - /var/lib/postgresql/data:uid=999,gid=999,mode=0555,size=64k
    shm_size: 256m
    pids_limit: 256
    mem_limit: ${CREWFLOW_POSTGRES_MEM_LIMIT:-1024m}
    cpus: ${CREWFLOW_POSTGRES_CPUS:-2}

  redis:
    image: redis:7-alpine
    # No host port: only server/worker reach it, as redis:6379 on the compose network (this machine also runs a native
    # redis-server on host port 6379). AOF + noeviction, as in production: BullMQ keeps its job schedulers here (the Worker
    # refuses to boot under an evicting policy), and the consume-only Worker never recreates a lost scheduler.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    restart: unless-stopped
    volumes:
      - crewflow-dev-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # S3-compatible object storage for LOCAL DEVELOPMENT AND CI ONLY (profile `s3`,
  # start with `docker compose --profile s3 up -d minio minio-init`). It lets the
  # real S3 driver be exercised without cloud credentials. The credentials below
  # are a throwaway dev pair for a container that is never exposed beyond
  # localhost — production uses a real provider with least-privilege IAM.
  # The bucket is PRIVATE (no anonymous policy), versioned, and never public.
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    profiles: ['s3']
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rab_minio_dev
      MINIO_ROOT_PASSWORD: rab_minio_dev_only_secret
      # Throwaway dev key so MinIO accepts SSE-S3 (`x-amz-server-side-encryption: AES256`) exactly as AWS does.
      MINIO_KMS_SECRET_KEY: 'rab-dev-key:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - crewflow-dev-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ['s3']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 rab_minio_dev rab_minio_dev_only_secret &&
      mc mb --ignore-existing local/rab-dev &&
      mc anonymous set none local/rab-dev &&
      mc version enable local/rab-dev &&
      mc encrypt set sse-s3 local/rab-dev &&
      echo bucket-ready"

  # ---------------------------------------------------------------------------
  # db-setup — the one-shot database setup (Part A), as docker-compose.production.yml's `db-setup`, built from source. The
  # ONLY service with a database URL. Development differences: the URL is PINNED to the bundled db (no PG_DATABASE_URL
  # interpolation: dev has no external-database mode), NODE_ENV=development. Runs on every `up` (it removes the old target
  # file first, never the password file), then exits; server starts only after it completed successfully.
  # ---------------------------------------------------------------------------
  db-setup:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    # One image for db-setup, server and worker (built once, never drifting between them).
    image: crewflow-dev/rab:local
    entrypoint: ['./db-setup.sh']
    environment:
      PG_DATABASE_URL: postgresql://postgres:${CREWFLOW_DEV_DB_PASSWORD:?set CREWFLOW_DEV_DB_PASSWORD in packages/rab-docker/.env (hex only, openssl rand -hex 32)}@db:5432/crewflow?sslmode=verify-full
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
    networks: [default, crewflow-db]
    volumes:
      - crewflow-db-ca:/run/crewflow/db-ca:ro
      # The target file and the crewflow_owner password file (written here; read-only in server and worker).
      - crewflow-db-target:/run/crewflow/db-target
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging: *logging
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 40s

  # rab-api equivalent, built from source: migrates on start, registers the job schedulers, then serves (O3).
  server:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    # One image for db-setup, server and worker (built once, never drifting between them).
    image: crewflow-dev/rab:local
    # api-prestart.sh is PID 1 (production's entrypoint; no command, no compose init): the refusals, the crewflow_owner URL
    # from db-setup's files, the migrate child, the scheduler registration, then `exec /sbin/tini -s -- node .../main.js`.
    entrypoint: ['./api-prestart.sh']
    env_file:
      - ../rab-server/.env
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      # DATABASE: only from db-setup's files (target.json + owner-password, mounted read-only below). PINNED EMPTY: the
      # host-native database settings of ../rab-server/.env never reach this container (api-prestart.sh refuses any
      # non-empty PG_DATABASE_URL, and a second database URL).
      PG_DATABASE_URL: ''
      DATABASE_URL: ''
      DATABASE_URL_UNPOOLED: ''
      DATABASE_DIRECT_URL: ''
      # DB_TARGET is command authority (database-target.ts: migrations and CLI commands only); api-prestart.sh and the API
      # refuse it (security review L-4, never-in-runtime-env.ts). A one-off passes it with `run -e DB_TARGET=local`.
      DB_TARGET: ''
      # TLS to the bundled db: api-prestart.sh points PG_SSL_CA_CERT_PATH at the db's own CA (host `db`) when it is empty;
      # self-signed acceptance stays off (verify-full).
      PG_SSL_CA_CERT_PATH: ''
      PG_SSL_ALLOW_SELF_SIGNED: 'false'
      PG_EXPECTED_DATABASE_NAME: crewflow
      # Deployment identity (BC-11): not used in dev; blanked so a host-native value in ../rab-server/.env never applies.
      CREWFLOW_DEPLOYMENT_ENVIRONMENT: ''
      CREWFLOW_DEPLOYMENT_ID: ''
      # O3 C1 (production's lifecycle): migrate on start under the migration lock, approval mode none (production's default).
      CREWFLOW_MIGRATE_ON_START: 'true'
      CREWFLOW_MIGRATION_APPROVAL_MODE: none
      # O3 C2 (production's scheduler mode): this service registers the BullMQ job schedulers; the worker only consumes
      # them. The same WORKER_SCHEDULER and BULLMQ_PREFIX on both (unset prefix = crewflow:development:bull).
      WORKER_SCHEDULER: bullmq
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-}
      # Phase D (E-1): the same WORKER_DISPATCH_MODE as the worker — event makes this API's sessions carry
      # crewflow.dispatch_notify=on (its outbox writes wake the Worker); poll (default) = no NOTIFY. The API never claims.
      WORKER_DISPATCH_MODE: ${WORKER_DISPATCH_MODE:-poll}
      # The env validator refuses event without global, so the API takes the same pair (its claim mode is otherwise unused).
      WORKER_CLAIM_MODE: ${WORKER_CLAIM_MODE:-per_scope}
      REDIS_URL: redis://redis:6379
      # HWS runtime routing ON — DEVELOPMENT ONLY (owner decision 2026-10-22): workspace-scoped requests resolve to the
      # caller's physical workspace schema. Production keeps it OFF until the cutover (OWNER-DB-ULTIMATE.md Part C).
      # Rollback: set 'false' here and recreate server + worker.
      HWS_RUNTIME_ENABLED: 'true'
      # Workspace host routing + registry-backed origin trust — DEVELOPMENT ONLY (waves 2+3 integration, owner-approved dev
      # rollout 2026-10-23; WAVE3_LANE_H_REPORT.md §6). Open http://<label>.localhost:5173 (Chrome/Edge resolve *.localhost
      # to loopback); the front proxies /rest same-origin (VITE_API_PROXY_TARGET below), so the API sees that Host. Origin
      # trust requires host routing (boot refused otherwise) and the worker needs the same pair. Production and QA keep
      # both OFF. Rollback: set both flags 'false' here (server AND worker) and recreate both containers.
      WORKSPACE_BASE_DOMAIN: localhost:5173
      WORKSPACE_HOST_ROUTING_ENABLED: 'true'
      WORKSPACE_SUBDOMAIN_ORIGIN_TRUST_ENABLED: 'true'
      # Cross-host login handoff — DEVELOPMENT ONLY (waves 4+5 integration, owner-approved dev rollout 2026-10-23;
      # WAVE4_LANE_MFA_REPORT.md §8-9). Sign-in on the default host (127.0.0.1:5173) moves the session to the user's
      # workspace host through a <=30 s single-use token. Boot is refused unless host routing + origin trust are on (above).
      # Every other wave 4+5 flag stays at its safe default here: MFA enrolment available but enforced for nobody
      # (AUTH_MFA_ENFORCE_* false), mobile exempt, legacy step-up password-only, outbox retention OFF (report mode when
      # enabled), L1 metadata cache OFF, login-handoff cleanup ON. Production and QA keep the handoff OFF.
      # Rollback: set 'false' here (server AND worker) and recreate both containers.
      AUTH_LOGIN_HANDOFF_ENABLED: 'true'
      # ../rab-server/.env may carry a real SMTP driver setting for occasional non-Docker use. The local stack forces
      # LOGGER unconditionally so no local run can ever attempt a real send.
      EMAIL_DRIVER: LOGGER
      # The browser reaches the frontend at both http://localhost:5173 and http://127.0.0.1:5173; CORS rejects a
      # same-machine-but-different-origin request otherwise. The application's own CORS_ORIGINS default is unchanged.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Links in activation/invitation/reset emails open the console on the SAME loopback alias as the API
      # (`front`'s VITE_API_URL is 127.0.0.1): `localhost` and `127.0.0.1` are different sites to a browser, and a
      # cross-site page never stores the SameSite=Lax session cookie, so reload would sign the user out.
      APP_URL: http://127.0.0.1:5173
      ACCOUNTS_URL: http://127.0.0.1:5173
      # LOCAL storage on the shared crewflow-dev-local-storage volume (mounted below, same volume as the worker): the
      # server must read report PDFs the worker writes, and files must survive image rebuilds. The `s3` profile (MinIO)
      # remains available for exercising the S3 driver.
      STORAGE_DRIVER: LOCAL
      STORAGE_KEY_PREFIX: dev
    volumes:
      - crewflow-dev-local-storage:/app/storage
      # The bundled db's CA and db-setup's target + password files, read-only (the crewflow_owner URL is built from them).
      - crewflow-db-ca:/run/crewflow/db-ca:ro
      - crewflow-db-target:/run/crewflow/db-target:ro
    networks: [default, crewflow-db]
    ports:
      - '127.0.0.1:3000:3000'
    # W6-E2E-05: a crash (or a dependency outage that ends a process) must not leave the dev stack down until someone
    # notices. `docker compose stop` still stops it.
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      # db-setup has created crewflow_owner and written the target and password files (api-prestart.sh also waits for
      # them, bounded at 120 s).
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 15
      # A fresh install applies the whole chain before main.js listens.
      start_period: 600s
    # Production's rab-api isolation (H6), so api-prestart.sh's isolation report matches what production declares.
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    mem_limit: 1024m
    stop_grace_period: 40s

  # rab-worker equivalent (O1, one image): the SAME image as `server` (rab/Dockerfile), ONE process as uid/gid 1000 with
  # in-process workspace provisioning. worker-start.sh is PID 1 (production's entrypoint; no command, no compose init): it
  # builds the crewflow_owner URL from db-setup's files, then execs `/sbin/tini -s -- node packages/rab-worker/dist/main.js`
  # (tini is PID 1, so the watchdog's SIGKILL of a stalled loop works). Never migrates, only consumes the job schedulers the
  # server registered; starts after a healthy server.
  worker:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    # One image for db-setup, server and worker (built once, never drifting between them).
    image: crewflow-dev/rab:local
    entrypoint: ['./worker-start.sh']
    env_file:
      - ../rab-server/.env
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      # DATABASE: only from db-setup's files, as on the server (worker-start.sh refuses any non-empty PG_DATABASE_URL).
      PG_DATABASE_URL: ''
      DATABASE_URL: ''
      DATABASE_DIRECT_URL: ''
      DATABASE_URL_UNPOOLED: ''
      # O1: no provisioner credential (provisioning runs in-process); blanked in case ../rab-server/.env sets it.
      CREWFLOW_PROVISIONER_DATABASE_URL: ''
      # Command authority: the runtime guard refuses it in a long-running process (security review L-4); blanked in case
      # ../rab-server/.env sets it.
      DB_TARGET: ''
      PG_SSL_CA_CERT_PATH: ''
      PG_SSL_ALLOW_SELF_SIGNED: 'false'
      PG_EXPECTED_DATABASE_NAME: crewflow
      CREWFLOW_DEPLOYMENT_ENVIRONMENT: ''
      CREWFLOW_DEPLOYMENT_ID: ''
      # Phase B (B5): the Worker runtime pool size (connection-budget.ts DEFAULT_WORKER_POOL_MAX).
      PG_POOL_MAX_CONNECTIONS: '12'
      # O3 C1/C2: never migrates, only consumes the schedulers the server registered, does not wait for the schema itself.
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: '0'
      WORKER_SCHEDULER: bullmq
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-}
      REDIS_URL: redis://redis:6379
      # HWS runtime routing ON — DEVELOPMENT ONLY, same decision as the server (see its comment).
      HWS_RUNTIME_ENABLED: 'true'
      # In-process provisioning interval (5..120 s): WORKSPACE_PROVISIONER_INTERVAL_SECONDS; unset = the code default.
      # Same workspace-host pair as the server (DEVELOPMENT ONLY): the shared validator refuses origin trust without host
      # routing, and the worker builds workspace-aware invitation links from the base domain.
      WORKSPACE_BASE_DOMAIN: localhost:5173
      WORKSPACE_HOST_ROUTING_ENABLED: 'true'
      WORKSPACE_SUBDOMAIN_ORIGIN_TRUST_ENABLED: 'true'
      # Same login-handoff flag as the server (DEVELOPMENT ONLY): the shared validator cross-checks it against the pair above.
      AUTH_LOGIN_HANDOFF_ENABLED: 'true'
      # The worker is the process that actually dispatches queued email — force LOGGER so no local run can send for real.
      EMAIL_DRIVER: LOGGER
      # Phase D (D1/D2): unset = the code defaults (per_scope / poll), as in production. event needs global. The Worker
      # refuses any other combination.
      WORKER_CLAIM_MODE: ${WORKER_CLAIM_MODE:-per_scope}
      WORKER_DISPATCH_MODE: ${WORKER_DISPATCH_MODE:-poll}
      # Same shared storage volume as the server (see its comment): the worker writes report PDFs the API serves.
      STORAGE_DRIVER: LOCAL
      STORAGE_KEY_PREFIX: dev
      # What the retired launcher gave its jobs child (H1-M1): HOME a path the process can neither write nor create, temp
      # and XDG caches in its own 0700 tmpfs, and the per-instance heartbeat the health check reads.
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    # W6-E2E-05: a crash (or a dependency outage that ends a process) must not leave the dev stack down until someone
    # notices. `docker compose stop` still stops it.
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    # Production's rab-worker sizing (H6): native PDF threads x 384 MB must fit half of this memory limit.
    pids_limit: 1024
    mem_limit: 1536m
    volumes:
      - crewflow-dev-local-storage:/app/storage
      - crewflow-db-ca:/run/crewflow/db-ca:ro
      - crewflow-db-target:/run/crewflow/db-target:ro
    networks: [default, crewflow-db]
    healthcheck:
      # Jobs-only per-instance health (the provisioner role is off for this check only).
      test: ['CMD', 'env', 'CREWFLOW_PROVISIONER_ENABLED=false', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      # API first, Worker after (like Twenty). restart: true makes Compose stop this Worker before it replaces the server.
      server:
        condition: service_healthy
        restart: true

  # Dev-only convenience service — no custom Dockerfile, unlike server/worker's
  # production rab-target image. Bind-mounts the repo for Vite hot reload;
  # node_modules is a named volume instead, so the container gets its own
  # Linux-native install rather than reusing whatever host OS built ../../node_modules.
  front:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../..:/app
      - rab-front-node-modules:/app/node_modules
    environment:
      # `api.ts`'s baseURL default is `http://localhost:3000/...` — the
      # BROWSER (a host-side process, not part of the Docker network) calls
      # this directly, and on this machine `localhost` resolves to `::1`
      # first while Docker's port-forwarding only reliably handles IPv4.
      # 127.0.0.1 sidesteps that entirely. Local dev/audit environment
      # config only — never change the application's own hardcoded default.
      #
      # Waves 2+3 (workspace host routing, dev only): the browser now calls the API SAME-ORIGIN through Vite's `/rest`
      # proxy (packages/rab-front/vite.config.ts, changeOrigin: false keeps the browser's Host, e.g.
      # issac.localhost:5173, which is how the API learns the workspace host). Each host (127.0.0.1:5173, localhost:5173,
      # <label>.localhost:5173) gets its own host-only session cookie, and the loopback-alias redirect in main.tsx no longer
      # applies (a relative API URL). The API stays reachable directly at http://127.0.0.1:3000 (mobile, curl).
      # Previous value, for rollback: VITE_API_URL: http://127.0.0.1:3000/rest/v1 (and drop VITE_API_PROXY_TARGET).
      VITE_API_URL: /rest/v1
      VITE_API_PROXY_TARGET: http://server:3000
      # The repo is bind-mounted from Windows, where file events do not reach the container: poll for changes here only
      # (vite.config.ts keeps polling off by default; it costs ~30 % of a CPU core while idle).
      VITE_WATCH_POLLING: "true"
    command: sh -c "corepack enable && yarn install --immutable && cd packages/rab-front && npx vite --port 5173 --host 0.0.0.0"
    # W6-E2E-05: a crash (or a dependency outage that ends a process) must not leave the dev stack down until someone
    # notices. `docker compose stop` still stops it.
    restart: unless-stopped
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — Vite's --host 0.0.0.0 binds IPv4 only,
      # but "localhost" resolves to ::1 first inside this Alpine image, so
      # the IPv6 loopback attempt gets refused even though the server is up.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173/']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Optional database UI — not part of the default stack: `docker compose --profile tools up -d adminer`. Server `db`,
  # user `postgres`, password = CREWFLOW_DEV_DB_PASSWORD (or crewflow_owner with the password in the setup volume).
  adminer:
    image: adminer:5.4.1@sha256:a3167350c4eb9ae4473b8ea0f49c8e5ae74c87b240ee2f6086521dba2a6bf243
    profiles: ['tools']
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks: [default, crewflow-db]
    depends_on:
      db:
        condition: service_healthy

networks:
  # The bundled db's network, as in production: internal (no route out), never published.
  crewflow-db:
    internal: true

volumes:
  # The bundled db: its cluster and server TLS key; its CA certificate (read-only in db-setup, server and worker); and
  # db-setup's target file + crewflow_owner password file (read-only in server and worker). Same keys as production.
  # DEV ONLY: the data volume is EXTERNAL with a fixed name, so `down -v` never deletes the dev database (see VOLUMES in
  # the header; compose-credential-isolation.cjs requires exactly this, and project volumes everywhere else).
  crewflow-db-data:
    name: crewflow_dev_db_data
    external: true
  crewflow-db-ca:
  crewflow-db-target:
  crewflow-dev-redis-data:
  crewflow-dev-minio-data:
  # Shared LOCAL file storage for server + worker (report PDFs, avatars); persists across image rebuilds.
  crewflow-dev-local-storage:
  rab-front-node-modules:
