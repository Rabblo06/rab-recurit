name: rab

# OWNER-LOGIN LIFECYCLE, the production one (docker-compose.image.yml + docker-compose.local-db.yml; Phase X X2.3, the same
# pattern as the e2e system and cost harnesses, P0-H #94). Like Twenty, dev runs the lifecycle production runs:
#   - devdb: on a FRESH (empty) data volume its only init step is the committed one-time provider-admin SQL,
#     postgres-init/owner-login/01-crewflow-owner.sql, which creates the ONE application login crewflow_owner with the
#     password read from /run/secrets/crewflow-owner-password (a compose secret fed from DEVDB_CREWFLOW_OWNER_PASSWORD,
#     never a command line). postgres-init/01-roles.sql (rab_owner / rab_app / crewflow_app / crewflow_worker) and
#     transition-from-separated.sql are no longer mounted. An already initialised volume never re-runs any init script.
#   - server: the image's own start, ./api-prestart.sh with CREWFLOW_MIGRATE_ON_START=true: the migration child (lock,
#     classifier, whole chain, post-checks; a first-install failure never serves), the BullMQ job-scheduler registration
#     (WORKER_SCHEDULER=bullmq), then main.js.
#   - worker: consume-only, never migrates and never registers schedulers, starts after a healthy server.
#   - ONE PG_DATABASE_URL, crewflow_owner, on the server and the worker, built here from the password below:
#     postgres://crewflow_owner:<DEVDB_CREWFLOW_OWNER_PASSWORD>@devdb:5432/rab. No migration login, no runtime-role login.
#   - migrate (the separated-mode one-off deploy-prepare step) is kept for ONE cycle behind the `migrate` profile only; it is
#     never started by `up` and nothing depends on it.
#
# SECRETS (packages/rab-docker/.env, git-ignored; letters and digits only, e.g. `openssl rand -hex 32`):
#   DEVDB_SUPERUSER_PASSWORD        the `rab` bootstrap superuser (initdb and DBA tasks only, never an app login)
#   DEVDB_CREWFLOW_OWNER_PASSWORD   crewflow_owner, the ONE application login (at least 24 characters)
# Fresh machine: `docker volume create rab_devdb_data`, set both, then `docker compose up -d --build` (the server applies
# the whole chain on its first start; its health check allows 600 s). First platform admin, after the server is healthy:
#   docker compose exec -e DB_TARGET=local -e BOOTSTRAP_ADMIN_EMAIL=you@example.test server \
#     node packages/rab-server/dist/command/main.js bootstrap-admin
# EXISTING VOLUME (initialised before this change with postgres-init/01-roles.sql, separated logins): nothing here changes
# its data, and no init script runs on it. It has no crewflow_owner unless an operator created one, so devdb stays unhealthy
# (the health check below requires the role) and server/worker do not start: fail closed. The cut-over is the owner's
# decision (D7): a fresh volume, or the reviewed one-time transition step on the existing one.

services:
  # The ONE local development PostgreSQL server (default stack: devdb, redis, server, worker, front). Exactly one server
  # per volume — two servers on one data directory corrupt it (2026-10-15 incident):
  #  - `container_name` makes `--scale devdb=2` (or a second copy of this service) fail instead of starting a twin;
  #  - the volume is `external`, so `docker compose down -v` can never delete it, and no other service in this file (or in
  #    docker-compose.qa.yml / docker-compose.production.yml) mounts it.
  devdb:
    image: postgres:16-alpine
    container_name: rab-devdb
    environment:
      POSTGRES_USER: rab
      # Bootstrap superuser: migrations phase B and DBA tasks only — never the application's connection.
      POSTGRES_PASSWORD: ${DEVDB_SUPERUSER_PASSWORD:?set DEVDB_SUPERUSER_PASSWORD in packages/rab-docker/.env}
      POSTGRES_DB: rab
      # Page checksums, so on-disk corruption is detected on read instead of silently returned (initdb-time only).
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      # Loopback only. 15432, not 5432/5433 — this dev machine also has native Windows PostgreSQL services
      # (postgresql-x64-17/18) that own host ports 5432 AND 5433, silently shadowing a container for anything connecting
      # via `localhost` from the host. Host-side tools (packages/rab-server/.env, packages/rab-worker/.env.provisioner,
      # psql from a host shell) use localhost:15432; containers use devdb:5432 on the compose network.
      - '127.0.0.1:15432:5432'
    secrets:
      - crewflow-owner-password
    volumes:
      - rab-devdb-data:/var/lib/postgresql/data
      # File by file, never the directory: postgres-init/ also holds the retired separated-mode 01-roles.sql, and
      # owner-login/ holds transition-from-separated.sql, which must never run on a fresh cluster. Runs only on an EMPTY
      # data volume (the image's entrypoint skips every init script on an initialised one).
      - ./postgres-init/owner-login/01-crewflow-owner.sql:/docker-entrypoint-initdb.d/01-crewflow-owner.sql:ro
    healthcheck:
      # Ready AND the one-time owner step completed: a half-initialised volume (or an old one) without crewflow_owner stays
      # unhealthy, as docker-compose.local-db.yml checks it.
      test:
        - CMD-SHELL
        - "pg_isready -U rab -d rab && psql -X -U rab -d rab -Atc \"select 1 from pg_roles where rolname = 'crewflow_owner' and rolcanlogin\" | grep -qx 1"
      interval: 5s
      timeout: 5s
      retries: 20
    # Lane A (2026-10-24): devdb and redis were left DOWN after a Docker Desktop restart while server/worker/front came
    # back (they had unless-stopped, these did not), so the app restart-looped against missing dependencies. Same policy
    # as the services that depend on them; `docker compose stop` still stops them.
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No host port: only server/worker reach it, as redis:6379 on the compose network (this machine also runs a native
    # redis-server on host port 6379).
    # maxmemory-policy noeviction stated explicitly (it is Redis 7's default): WORKER_SCHEDULER=bullmq keeps its job
    # schedulers here and refuses to boot under an evicting policy. No AOF in dev: a restart can lose the schedulers;
    # the worker's periodic reconcile recreates them.
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    restart: unless-stopped
    volumes:
      - rab-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # S3-compatible object storage for LOCAL DEVELOPMENT AND CI ONLY (profile `s3`,
  # start with `docker compose --profile s3 up -d minio minio-init`). It lets the
  # real S3 driver be exercised without cloud credentials. The credentials below
  # are a throwaway dev pair for a container that is never exposed beyond
  # localhost — production uses a real provider with least-privilege IAM.
  # The bucket is PRIVATE (no anonymous policy), versioned, and never public.
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    profiles: ['s3']
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rab_minio_dev
      MINIO_ROOT_PASSWORD: rab_minio_dev_only_secret
      # Throwaway dev key so MinIO accepts SSE-S3 (`x-amz-server-side-encryption: AES256`) exactly as AWS does.
      MINIO_KMS_SECRET_KEY: 'rab-dev-key:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - rab-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: ['s3']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 rab_minio_dev rab_minio_dev_only_secret &&
      mc mb --ignore-existing local/rab-dev &&
      mc anonymous set none local/rab-dev &&
      mc version enable local/rab-dev &&
      mc encrypt set sse-s3 local/rab-dev &&
      echo bucket-ready"

  server:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    env_file:
      - ../rab-server/.env
    environment:
      # The ONE application login (owner-login architecture), identical on the server and the worker. Missing password =
      # compose refuses to render (fail closed). The deprecated names are blanked so ../rab-server/.env's own URLs never
      # reach this process (api-prestart.sh refuses a second database URL).
      # DB_TARGET is command authority (database-target.ts: migrations and CLI commands only). api-prestart.sh and the API
      # refuse to start with it (security review L-4, never-in-runtime-env.ts), so it is blanked here in case
      # ../rab-server/.env sets it; run a CLI command in this container with `-e DB_TARGET=local` (the `devdb` service is a
      # local docker hostname).
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      DB_TARGET: ''
      PG_DATABASE_URL: postgres://crewflow_owner:${DEVDB_CREWFLOW_OWNER_PASSWORD:?set DEVDB_CREWFLOW_OWNER_PASSWORD in packages/rab-docker/.env}@devdb:5432/rab
      # O3 C1 (production's lifecycle): the server migrates on start, under the migration lock (approval mode none, the
      # production default). A failed first install never serves; a failed upgrade starts degraded (C3), as in production.
      CREWFLOW_MIGRATE_ON_START: 'true'
      CREWFLOW_MIGRATION_APPROVAL_MODE: none
      # O3 C2 (production's scheduler mode): the server registers the BullMQ job schedulers in api-prestart.sh; the worker
      # only consumes them. The same value (and the same BULLMQ_PREFIX) on both.
      WORKER_SCHEDULER: bullmq
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-}
      DATABASE_URL: ''
      DATABASE_URL_UNPOOLED: ''
      # Phase D (E-1): the same WORKER_DISPATCH_MODE as the worker — event makes this API's sessions carry
      # crewflow.dispatch_notify=on (its outbox writes wake the Worker); poll (default) = no NOTIFY. The API never claims.
      WORKER_DISPATCH_MODE: ${WORKER_DISPATCH_MODE:-poll}
      # The env validator refuses event without global, so the API takes the same pair (its claim mode is otherwise unused).
      WORKER_CLAIM_MODE: ${WORKER_CLAIM_MODE:-per_scope}
      DATABASE_DIRECT_URL: ''
      REDIS_URL: redis://redis:6379
      # HWS runtime routing ON — DEVELOPMENT ONLY (owner decision 2026-10-22, rab-devdb TEST database): workspace-scoped
      # requests resolve to the caller's physical workspace schema. Replaces the temporary scratchpad override
      # (hws-on.override.yml) the stack was started with. Production (docker-compose.production.yml), QA and render.yaml
      # keep it OFF until the production rehearsal. Rollback: set 'false' here and recreate server + worker.
      HWS_RUNTIME_ENABLED: 'true'
      # Workspace host routing + registry-backed origin trust — DEVELOPMENT ONLY (waves 2+3 integration, owner-approved dev
      # rollout 2026-10-23; WAVE3_LANE_H_REPORT.md §6). Open http://<label>.localhost:5173 (Chrome/Edge resolve *.localhost
      # to loopback); the front proxies /rest same-origin (VITE_API_PROXY_TARGET below), so the API sees that Host. Origin
      # trust requires host routing (boot refused otherwise) and the worker needs the same pair. Production, QA and
      # render.yaml keep both OFF. Rollback: set both flags 'false' here (server AND worker) and recreate both containers.
      WORKSPACE_BASE_DOMAIN: localhost:5173
      WORKSPACE_HOST_ROUTING_ENABLED: 'true'
      WORKSPACE_SUBDOMAIN_ORIGIN_TRUST_ENABLED: 'true'
      # Cross-host login handoff — DEVELOPMENT ONLY (waves 4+5 integration, owner-approved dev rollout 2026-10-23;
      # WAVE4_LANE_MFA_REPORT.md §8-9). Sign-in on the default host (127.0.0.1:5173) moves the session to the user's
      # workspace host through a <=30 s single-use token. Boot is refused unless host routing + origin trust are on (above).
      # Every other wave 4+5 flag stays at its safe default here: MFA enrolment available but enforced for nobody
      # (AUTH_MFA_ENFORCE_* false), mobile exempt, legacy step-up password-only, outbox retention OFF (report mode when
      # enabled), L1 metadata cache OFF, login-handoff cleanup ON. Production, QA and render.yaml keep the handoff OFF.
      # Rollback: set 'false' here (server AND worker) and recreate both containers.
      AUTH_LOGIN_HANDOFF_ENABLED: 'true'
      # Same reasoning as PG_DATABASE_URL above: ../rab-server/.env may carry a
      # real SMTP driver setting for occasional non-Docker use (confirmed:
      # EMAIL_DRIVER=SMTP with no SMTP_HOST set at all — an unverified,
      # ambiguous state, not a confirmed-safe one). The local stack forces
      # LOGGER unconditionally so no local run can ever attempt a real send,
      # regardless of what's in the on-disk .env at the time.
      EMAIL_DRIVER: LOGGER
      # Local audit environment only — the browser reaches the frontend at
      # both http://localhost:5173 and http://127.0.0.1:5173 depending on
      # which one Docker's port-forwarding is currently honoring on this
      # machine (see F002/F003 in .audit/overnight-audit/FINDINGS.md); CORS
      # rejects a same-machine-but-different-origin request otherwise. The
      # application's own `CORS_ORIGINS` default (env.validation.ts) stays
      # exactly as it was; this only adds a second allowed local origin.
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Links in activation/invitation/reset emails open the console on the SAME loopback alias as the API
      # (`front`'s VITE_API_URL is 127.0.0.1): `localhost` and `127.0.0.1` are different sites to a browser, and a
      # cross-site page never stores the SameSite=Lax session cookie, so reload would sign the user out.
      APP_URL: http://127.0.0.1:5173
      ACCOUNTS_URL: http://127.0.0.1:5173
      # LOCAL storage on the shared `rab-local-storage` volume (mounted below, same volume as the worker): the
      # server must read report PDFs the worker writes, and files must survive image rebuilds. Without the shared
      # volume each container kept its own disk and every rebuild erased stored PDFs/avatars (2026-10-17 finding).
      # The `s3` profile (MinIO) remains available for exercising the S3 driver.
      STORAGE_DRIVER: LOCAL
      STORAGE_KEY_PREFIX: dev
    volumes:
      - rab-local-storage:/app/storage
    # The image's default command, stated as production states it: env refusals, the migration child, the scheduler
    # registration, then main.js.
    command: ['./api-prestart.sh']
    ports:
      - '127.0.0.1:3000:3000'
    # W6-E2E-05: a crash (or a dependency outage that ends a process) must not leave the dev stack down until someone
    # notices. Same policy production (rab-api/rab-worker) and QA already use; `docker compose stop` still stops it.
    restart: unless-stopped
    depends_on:
      devdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 15
      # A fresh install applies the whole chain before main.js listens.
      start_period: 600s

  # Worker SERVICE (O1, one image): the SAME image as `server` (rab/Dockerfile), a different command:
  # `node packages/rab-worker/dist/main.js`, ONE process as uid/gid 1000 under compose's init, with workspace provisioning
  # in-process (owner-login architecture). The retired root launcher, its provisioner child (uid 10001) and the
  # CREWFLOW_PROVISIONER_DATABASE_URL hand-off are gone; the runtime guard refuses that variable in this process.
  # O3 C1/C2 (production's lifecycle): it never migrates, only consumes the job schedulers the server registered, and starts
  # after a healthy server, on the same ONE owner login.
  worker:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    env_file:
      - ../rab-server/.env
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      # Explicitly overridden so ../rab-server/.env's own URLs (possibly a real remote database) can never leak through.
      # The same ONE owner login as the server (PG_DATABASE_URL is also the session-lock connection: direct).
      PG_DATABASE_URL: postgres://crewflow_owner:${DEVDB_CREWFLOW_OWNER_PASSWORD:?set DEVDB_CREWFLOW_OWNER_PASSWORD in packages/rab-docker/.env}@devdb:5432/rab
      # O3 C1/C2: never migrates, only consumes the schedulers the server registered, starts after a healthy server.
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: '0'
      # Command authority: the runtime guard refuses it in a long-running process (security review L-4); blanked in case
      # ../rab-server/.env sets it.
      DB_TARGET: ''
      # Phase B (B5): the Worker runtime pool size (connection-budget.ts DEFAULT_WORKER_POOL_MAX).
      PG_POOL_MAX_CONNECTIONS: '12'
      DATABASE_URL: ''
      DATABASE_DIRECT_URL: ''
      DATABASE_URL_UNPOOLED: ''
      # O1: no provisioner credential (provisioning runs in-process); blanked in case ../rab-server/.env sets it.
      CREWFLOW_PROVISIONER_DATABASE_URL: ''
      REDIS_URL: redis://redis:6379
      # HWS runtime routing ON — DEVELOPMENT ONLY, same decision as the server (see its comment).
      HWS_RUNTIME_ENABLED: 'true'
      # In-process provisioning interval (5..120 s): WORKSPACE_PROVISIONER_INTERVAL_SECONDS; unset = the code default.
      # Same workspace-host pair as the server (DEVELOPMENT ONLY): the shared validator refuses origin trust without host
      # routing, and the worker builds workspace-aware invitation links from the base domain.
      WORKSPACE_BASE_DOMAIN: localhost:5173
      WORKSPACE_HOST_ROUTING_ENABLED: 'true'
      WORKSPACE_SUBDOMAIN_ORIGIN_TRUST_ENABLED: 'true'
      # Same login-handoff flag as the server (DEVELOPMENT ONLY): the shared validator cross-checks it against the pair above.
      AUTH_LOGIN_HANDOFF_ENABLED: 'true'
      # The worker is the process that actually dispatches queued email — force LOGGER so no local run can send for real.
      EMAIL_DRIVER: LOGGER
      # O3 C2: production's scheduler mode, the same value (and BULLMQ_PREFIX) as the server, which registers the schedulers.
      WORKER_SCHEDULER: bullmq
      BULLMQ_PREFIX: ${BULLMQ_PREFIX:-}
      # Phase D (D1/D2): dispatch claims and wake-ups for a deliberate local trial; unset = the code defaults (per_scope /
      # poll; backstop 30 s, reconciliation 900 s, batch 100), as in production. event needs global. The Worker refuses any
      # other combination.
      WORKER_CLAIM_MODE: ${WORKER_CLAIM_MODE:-per_scope}
      WORKER_DISPATCH_MODE: ${WORKER_DISPATCH_MODE:-poll}
      # Same shared `rab-local-storage` volume as the server (see its comment): the worker writes report PDFs the API serves.
      STORAGE_DRIVER: LOCAL
      STORAGE_KEY_PREFIX: dev
      # What the retired launcher gave its jobs child (H1-M1): HOME a path the process can neither write nor create, temp
      # and XDG caches in its own 0700 tmpfs, and the per-instance heartbeat the health check reads.
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    command: ['node', 'packages/rab-worker/dist/main.js']
    # W6-E2E-05: a crash (or a dependency outage that ends a process) must not leave the dev stack down until someone
    # notices. Same policy production (rab-api/rab-worker) and QA already use; `docker compose stop` still stops it.
    restart: unless-stopped
    # Docker's init as PID 1: the Worker's watchdog SIGKILLs a stalled event loop, which the kernel ignores for PID 1.
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    volumes:
      - rab-local-storage:/app/storage
    healthcheck:
      # Jobs-only per-instance health (the provisioner role is off for this check only).
      test: ['CMD', 'env', 'CREWFLOW_PROVISIONER_ENABLED=false', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      devdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy

  # SUPERSEDED, KEPT FOR ONE CYCLE (Phase X X2.3): the separated-mode one-off release step, `deploy-prepare.js`, behind the
  # `migrate` profile only. `up` never starts it and nothing depends on it: the server migrates on start (above). It is
  # here only for a volume still on the separated logins, run explicitly:
  #   CREWFLOW_MIGRATION_DATABASE_URL=postgres://<migration role>@devdb:5432/rab docker compose --profile migrate run --rm migrate   (exit 3)
  #   CREWFLOW_MIGRATION_APPROVED=pending-<count>-<sha256> \
  #   CREWFLOW_MIGRATION_DATABASE_URL=postgres://<migration role>@devdb:5432/rab docker compose --profile migrate run --rm migrate
  # Without CREWFLOW_MIGRATION_APPROVED it only checks (exit 0 nothing pending, 3 pending + the list and the token, 1
  # refused). The migration login comes ONLY from packages/rab-docker/.env.migrate (git-ignored; template
  # .env.migrate.example) as PG_DATABASE_URL, or for one run from the shell as above; never pass it to `server` or `worker`.
  # Removed in the next cycle.
  migrate:
    profiles: ['migrate']
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    image: rab-server
    # Only this service reads it; `required: false` so a checkout without it still renders (the step then refuses).
    env_file:
      - path: .env.migrate
        required: false
    environment:
      NODE_ENV: development
      DB_TARGET: local
      CREWFLOW_MIGRATION_APPROVED: ${CREWFLOW_MIGRATION_APPROVED:-}
      CREWFLOW_MIGRATION_DATABASE_URL: ${CREWFLOW_MIGRATION_DATABASE_URL:-}
      # Read only by the two role-creating migrations (1786682000000 `crewflow`, 1786687000000 `crewflow_app`) on a fresh
      # database; ignored afterwards. Values live in the git-ignored packages/rab-docker/.env.
      CREWFLOW_BOOTSTRAP_PASSWORD: ${CREWFLOW_BOOTSTRAP_PASSWORD:-}
      CREWFLOW_APP_BOOTSTRAP_PASSWORD: ${CREWFLOW_APP_BOOTSTRAP_PASSWORD:-}
    restart: 'no'
    depends_on:
      devdb:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        # Phase B P7: the migration login reaches deploy-prepare ONLY as its PG_DATABASE_URL: from .env.migrate, or (legacy
        # operator habit) from CREWFLOW_MIGRATION_DATABASE_URL in the shell. The legacy name is removed before exec.
        url="$${PG_DATABASE_URL:-$${CREWFLOW_MIGRATION_DATABASE_URL:-}}"
        unset CREWFLOW_MIGRATION_DATABASE_URL || true
        if [ -z "$$url" ]; then
          echo "migrate: REFUSED - no migration connection. Put PG_DATABASE_URL in packages/rab-docker/.env.migrate (see .env.migrate.example) or set CREWFLOW_MIGRATION_DATABASE_URL for this run." >&2; exit 64
        fi
        if [ "$${CREWFLOW_MIGRATION_PHASE:-}" = "A" ]; then unset CREWFLOW_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD || true; fi
        exec env PG_DATABASE_URL="$$url" node packages/rab-server/dist/database/typeorm/scripts/deploy-prepare.js

  # Dev-only convenience service — no custom Dockerfile, unlike server/worker's
  # production rab-target image. Bind-mounts the repo for Vite hot reload;
  # node_modules is a named volume instead, so the container gets its own
  # Linux-native install rather than reusing whatever host OS built ../../node_modules.
  front:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../..:/app
      - rab-front-node-modules:/app/node_modules
    environment:
      # `api.ts`'s baseURL default is `http://localhost:3000/...` — the
      # BROWSER (a host-side process, not part of the Docker network) calls
      # this directly, and on this machine `localhost` resolves to `::1`
      # first while Docker's port-forwarding only reliably handles IPv4.
      # 127.0.0.1 sidesteps that entirely. Local dev/audit environment
      # config only — never change the application's own hardcoded default.
      #
      # Waves 2+3 (workspace host routing, dev only): the browser now calls the API SAME-ORIGIN through Vite's `/rest`
      # proxy (packages/rab-front/vite.config.ts, changeOrigin: false keeps the browser's Host, e.g.
      # issac.localhost:5173, which is how the API learns the workspace host). Each host (127.0.0.1:5173, localhost:5173,
      # <label>.localhost:5173) gets its own host-only session cookie, and the loopback-alias redirect in main.tsx no longer
      # applies (a relative API URL). The API stays reachable directly at http://127.0.0.1:3000 (mobile, curl).
      # Previous value, for rollback: VITE_API_URL: http://127.0.0.1:3000/rest/v1 (and drop VITE_API_PROXY_TARGET).
      VITE_API_URL: /rest/v1
      VITE_API_PROXY_TARGET: http://server:3000
      # The repo is bind-mounted from Windows, where file events do not reach the container: poll for changes here only
      # (vite.config.ts keeps polling off by default; it costs ~30 % of a CPU core while idle).
      VITE_WATCH_POLLING: "true"
    command: sh -c "corepack enable && yarn install --immutable && cd packages/rab-front && npx vite --port 5173 --host 0.0.0.0"
    # W6-E2E-05: a crash (or a dependency outage that ends a process) must not leave the dev stack down until someone
    # notices. Same policy production (rab-api/rab-worker) and QA already use; `docker compose stop` still stops it.
    restart: unless-stopped
    ports:
      - '127.0.0.1:5173:5173'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — Vite's --host 0.0.0.0 binds IPv4 only,
      # but "localhost" resolves to ::1 first inside this Alpine image, so
      # the IPv6 loopback attempt gets refused even though the server is up.
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173/']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Optional database UI — not part of the default stack: `docker compose --profile tools up -d adminer`.
  adminer:
    image: adminer:latest
    profiles: ['tools']
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      ADMINER_DEFAULT_SERVER: devdb
    depends_on:
      devdb:
        condition: service_healthy

secrets:
  # The crewflow_owner password for 01-crewflow-owner.sql, mounted into devdb at /run/secrets/crewflow-owner-password (the
  # file the SQL reads by default), from packages/rab-docker/.env; never on a command line. Read only on a fresh volume.
  crewflow-owner-password:
    environment: DEVDB_CREWFLOW_OWNER_PASSWORD

volumes:
  # External: created once by hand (see the `devdb` service), never created or removed by compose. The retired
  # `rab_rab-postgres-data` volume is deliberately absent from this file.
  rab-devdb-data:
    name: rab_devdb_data
    external: true
  rab-redis-data:
  rab-minio-data:
  # Shared LOCAL file storage for server + worker (report PDFs, avatars); persists across image rebuilds.
  rab-local-storage:
  rab-front-node-modules:
