# O3 real-container tests (Agent 5) - TEST-ONLY overlay, used ONLY by o3-tests/run-o3-tests.cjs:
#
#   docker compose -p o3t-pg<major> --env-file <secrets>/compose.env \
#     -f docker-compose.image.yml -f docker-compose.local-db.yml -f o3-tests/docker-compose.o3t.yml up -d
#
# The application services (rab-api, rab-worker, rab-redis) are the production files unchanged: same image, same command,
# same environment, same hardening. This overlay changes INFRASTRUCTURE only, so the stack is disposable and stays at five
# containers (rab-postgres, rab-redis, rab-api, rab-worker, sinks):
#   - rab-postgres: the PostgreSQL major under test (16 or 18, pinned by digest), data on a tmpfs (no Docker volume); the TLS
#     files are copied into the container's own tmpfs with mode 0600 before start (a Windows bind mount shows them as 0777,
#     which PostgreSQL refuses for a private key);
#   - rab-postgres also uses o3-tests/pg_hba.o3t.conf (local-db's rules + two disposable refusal-test databases);
#   - rab-redis: data on a tmpfs (a container restart loses it: the "Redis restart" test case);
#   - rab-api: no host port (the driver uses `docker exec ... wget`);
#   - sinks: one test-only container (o3-tests/sinks.cjs): SMTP sink + a minimal S3-compatible object sink.
# Relative paths resolve from packages/rab-docker (the first compose file's directory). Nothing here is a deployment file.

services:
  rab-postgres:
    image: ${O3T_POSTGRES_IMAGE:?O3T_POSTGRES_IMAGE}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        umask 077 && mkdir -p /tmp/o3t-tls && cp /run/secrets/pg-tls/server.crt /run/secrets/pg-tls/server.key /tmp/o3t-tls/ &&
        chmod 600 /tmp/o3t-tls/server.key &&
        exec docker-entrypoint.sh postgres -c hba_file=/etc/crewflow-postgres/pg_hba.conf -c ssl=on
        -c ssl_cert_file=/tmp/o3t-tls/server.crt -c ssl_key_file=/tmp/o3t-tls/server.key -c ssl_min_protocol_version=TLSv1.2
        -c password_encryption=scram-sha-256 -c listen_addresses=*
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes: !override
      - ./postgres-init/owner-login/01-crewflow-owner.sql:/docker-entrypoint-initdb.d/01-crewflow-owner.sql:ro
      - ./o3-tests/pg_hba.o3t.conf:/etc/crewflow-postgres/pg_hba.conf:ro
      - ${CREWFLOW_SECRETS_DIR:?}/pg-tls:/run/secrets/pg-tls:ro
      - ${CREWFLOW_SECRETS_DIR:?}/postgres-superuser-password:/run/secrets/postgres-superuser-password:ro
      - ${CREWFLOW_SECRETS_DIR:?}/crewflow-owner-password:/run/secrets/crewflow-owner-password:ro
    tmpfs: !override
      - /var/run/postgresql:uid=70,gid=70,mode=2775
      - /tmp:uid=70,gid=70,mode=0700
      - /var/lib/postgresql/data:uid=70,gid=70,mode=0700

  rab-redis:
    volumes: !override
      - ${CREWFLOW_SECRETS_DIR:?}/redis-users.acl:/run/secrets/redis-users.acl:ro
    tmpfs: !override
      - /tmp:size=8m,mode=1777
      - /data:uid=999,gid=1000,mode=0700

  rab-api:
    ports: !reset []

  sinks:
    image: ${O3T_NODE_IMAGE:?O3T_NODE_IMAGE}
    command: ["node", "/sink/sinks.cjs"]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /out:uid=1000,gid=1000,mode=0755
    volumes:
      - ./o3-tests/sinks.cjs:/sink/sinks.cjs:ro
    pids_limit: 64
    mem_limit: 128m
