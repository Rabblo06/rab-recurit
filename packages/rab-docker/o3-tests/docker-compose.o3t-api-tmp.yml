# O3 real-container tests (Agent 5), TEST-ONLY WORKAROUND, used only with run-o3-tests.cjs --api-tmp-workaround and labelled
# in every result it produces. NOT a deployment file.
#
# Defect found by T8a (2026-11-05): the shipped rab-api service is read_only with no writable temp directory, so
# api-prestart.sh's `mktemp` (the note that carries the failed migration's name from the migrate child to main.js) fails,
# CREWFLOW_UPGRADE_INCOMPLETE becomes "unknown", and main.js's gate 7 (pending-migrations) refuses: under C3 the API never
# serves after a failed upgrade. This overlay gives rab-api the small /tmp tmpfs the other read-only services already have,
# so the rest of the C3 / Worker-starts-too path can still be measured. The product fix belongs to the image/compose owner.
services:
  rab-api:
    tmpfs:
      - /tmp:size=8m,mode=1777
