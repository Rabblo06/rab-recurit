# Production stack, BUILD-BASED (the file OpenShip imports), on the OWNER LOGIN (owner's final decision 2026-11-04: ONE
# schema-owning login, crewflow_owner, for the API, the Worker and the release step; no mode switch).
#
# !!! OPENSHIP CANNOT RUN THIS STACK SAFELY (M0 D11) !!!
# OpenShip drops `user`, `read_only`, `tmpfs`, `cap_drop`, `security_opt`, `pids_limit`, `env_file` and the `depends_on`
# conditions (docs/release/OPENSHIP-COMPATIBILITY.md). O1 (one image): the image's default user is now the non-root
# `node` (1000:1000) for every command, so a dropped `user:` no longer means a root Worker; the other dropped keys
# (read-only root, capabilities, no-new-privileges, PID limits, tmpfs, init) still make OpenShip unsupported. The supported
# deployment is docker-compose.image.yml with plain `docker compose`
# (docs/release/OWNER-LOGIN-DEPLOYMENT.md, OWNER-LOGIN-ORACLE-VM-PLAN.md). A push to main may redeploy the temporary
# OpenShip deployment from this file: before this version merges, the owner must disable that auto-deploy or accept that
# the temporary deployment stops (its database has no crewflow_owner). NEEDS OWNER APPROVAL.
#
# This file mirrors docker-compose.image.yml's runtime contract (same services, commands, isolation keys, environment
# keys) with `build:` instead of digests, for local reference builds. Where the two differ, docker-compose.image.yml wins.
#
# ONE DATABASE CREDENTIAL. rab-api, rab-worker and rab-migrate each take PG_DATABASE_URL = crewflow_owner at the provider's
# DIRECT host, sslmode=verify-full — the SAME value on all three (entered per service on a platform without env_file).
# There is no migrator, provisioner, worker, ops or replica URL, no .env.migrate and no role password. Created by the
# provider admin with Agent 1's postgres-init/owner-login/01-crewflow-owner.sql (fresh) or transition-from-separated.sql
# (existing separated database): a URL alone never works.
#
# LIFECYCLE: the controlled release. The API never migrates (CREWFLOW_MIGRATE_ON_START=false; read-only compatibility
# check, then main.js). rab-migrate (deploy-prepare.js, same image, same login) runs to completion first. BC-11 (owner
# decision 2026-11-05): approval mode none by default, so it APPLIES every pending migration (failures exit 64-69 by kind,
# M0 section 7). Token mode is an opt-in (CREWFLOW_MIGRATION_APPROVAL_MODE=token entered identically on rab-api, rab-worker
# and rab-migrate): then a run without a token is a check run (3 = pending) and every non-fresh apply needs
# CREWFLOW_MIGRATION_APPROVED=<token>. Accepted risk: with the defaults a wrong image or URL migrates production; recovery
# is the mandatory pre-upgrade backup (docs/release/OWNER-LOGIN-RECOVERY.md). The Worker never migrates and starts after a
# healthy API.
#
# ENTER FOR rab-api AND rab-worker (identical values): PG_DATABASE_URL, PG_SSL_CA_CERT_PATH (mount the CA read-only),
# PG_EXPECTED_DATABASE_NAME, OPTIONALLY CREWFLOW_DEPLOYMENT_ENVIRONMENT=production + CREWFLOW_DEPLOYMENT_ID and
# CREWFLOW_MIGRATION_APPROVAL_MODE=token (BC-11 opt-ins, the same values on all three services), the connection budget
# (PG_POOL_MAX_CONNECTIONS / PG_EXPECTED_* — one login, so all pools share crewflow_owner's limit), REDIS_URL, APP_SECRET
# (+ keyrings if used; CURRENT values unchanged in a transition), CORS_ORIGINS, APP_URL, ACCOUNTS_URL (https only),
# TRUSTED_PROXY_CIDRS, EMAIL_* / RESEND_API_KEY, S3_BUCKET, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_ENDPOINT,
# SENTRY_DSN / APP_VERSION (optional), AUTH_GOOGLE_* / AUTH_MICROSOFT_* (if enabled), WORKSPACE_BASE_DOMAIN (owner decision).
# ENTER FOR rab-migrate: PG_DATABASE_URL (the same value), PG_SSL_CA_CERT_PATH, PG_EXPECTED_DATABASE_NAME,
# and the optional CREWFLOW_DEPLOYMENT_ENVIRONMENT / CREWFLOW_DEPLOYMENT_ID / CREWFLOW_MIGRATION_APPROVAL_MODE — nothing else.
# MUST NOT BE ENTERED ANYWHERE: DATABASE_URL, DATABASE_URL_UNPOOLED, DATABASE_DIRECT_URL, DB_POOL_MAX, PG_WORKER_DATABASE_URL,
# CREWFLOW_PROVISIONER_DATABASE_URL, CREWFLOW_MIGRATION_DATABASE_URL, PG_DATABASE_REPLICA_*, PG_OPS_APP_DATABASE_URL,
# CREWFLOW_*_BOOTSTRAP_PASSWORD, CREWFLOW_MIGRATOR_PASSWORD, CREWFLOW_MIGRATION_PHASE, CREWFLOW_DEPLOYMENT_IDENTITY_BOOTSTRAP,
# ALLOW_PRODUCTION_DB_COMMANDS, DB_TARGET, CREWFLOW_DB_MODE, CREWFLOW_PROVISIONER_ENABLED, libpq PG* variables, NODE_OPTIONS,
# BOOTSTRAP_ADMIN_*, TEST_*, ALLOW_REMOTE_TEST_DATABASE, AUTH_*_ISSUER_URL, WORKER_CLAIM_MODE, WORKER_DISPATCH_MODE,
# WORKER_INVITE_AUTO_DELETE_ENABLED, WORKSPACE_SUBDOMAIN_ORIGIN_TRUST_ENABLED; CREWFLOW_MIGRATION_APPROVED except as a
# one-run `run -e` on rab-migrate; and any override of the keys committed below.
#
# SECURITY POSTURE: PT-01 (runbook section 1, THREAT-MODEL.md). SUPERSEDED, KEPT UNTIL THE FINAL CLEAN-UP PR (#9, owner
# approval): rab-ops (profile "ops"). O1: the Worker bundle launcher and its separate Dockerfile are gone; the API and
# the Worker build the SAME image (rab/Dockerfile) and differ only by command.

name: rab-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:

  rab-redis:
    image: redis:7-alpine
    # AOF + noeviction (an evicting policy can drop BullMQ jobs and locks). No ACL file here: a platform without a host
    # secret directory cannot mount one, so this Redis is unauthenticated and must stay unpublished (docker-compose.image.yml
    # has the ACL).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - rab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # rab-api — the HTTP API. Never migrates (controlled release).
  rab-api:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    command: ["./api-prestart.sh"]
    ports:
      - "${CREWFLOW_API_BIND:-127.0.0.1}:${CREWFLOW_API_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      REDIS_URL: redis://rab-redis:6379
      HWS_RUNTIME_ENABLED: "false"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      CREWFLOW_MIGRATE_ON_START: "false"
      CREWFLOW_UPGRADE_FAILURE_POLICY: refuse
    depends_on:
      rab-redis:
        condition: service_healthy
      rab-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    # Runtime isolation (H6). REQUIRED; a platform that drops these keys runs the API degraded (warn mode: api-prestart.sh
    # logs each missing control) — the reason this file is not the supported deployment.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${CREWFLOW_API_MEM_LIMIT:-768m}
    cpus: ${CREWFLOW_API_CPUS:-2}
    stop_grace_period: 35s

  # rab-worker — background jobs, ONE process as uid/gid 1000 (no root launcher, no per-child credentials, in-process
  # provisioning). Never migrates; starts after a healthy API.
  rab-worker:
    # O1: the same image as rab-api (rab/Dockerfile, its last stage `rab`), a different command.
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    command: ["node", "packages/rab-worker/dist/main.js"]
    working_dir: /app
    # Docker's init (tini) as PID 1: the Worker's watchdog SIGKILLs a stalled event loop, which the kernel ignores for PID 1,
    # so the Worker refuses to start as PID 1. Required (compose-owner-login.cjs).
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    # Kept from the separated sizing until the H6 matrix re-measures with the native renderer (#61).
    pids_limit: 1024
    # Native PDF render threads (review M-3): PDF_NATIVE_CONCURRENCY x 384 MB heap cap must fit
    # PDF_NATIVE_MEMORY_BUDGET_MB (default 768 = half of this 1536m), else the Worker refuses to boot. Set both together.
    mem_limit: ${CREWFLOW_WORKER_MEM_LIMIT:-1536m}
    cpus: ${CREWFLOW_WORKER_CPUS:-2}
    logging: *logging
    environment:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      REDIS_URL: redis://rab-redis:6379
      HWS_RUNTIME_ENABLED: "false"
      # The owner's "feel instant" onboarding pin, read by the in-process provisioner (Agent 2 interface).
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: "5"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      PG_POOL_MAX_CONNECTIONS: "12"
      WORKER_SCHEDULER: interval
      CREWFLOW_UPGRADE_FAILURE_POLICY: refuse
      CREWFLOW_MIGRATE_ON_START: "false"
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    healthcheck:
      test: ["CMD", "env", "CREWFLOW_PROVISIONER_ENABLED=false", "node", "/opt/crewflow-bundle/worker-bundle-health.cjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      rab-redis:
        condition: service_healthy
      rab-migrate:
        condition: service_completed_successfully
      rab-api:
        condition: service_healthy
    restart: unless-stopped

  # rab-migrate — the one-off release step (deploy-prepare.js, in place for the owner login). Same image and same login as
  # rab-api; it reads only the five database entries listed in the header.
  rab-migrate:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    environment:
      NODE_ENV: production
      CREWFLOW_UPGRADE_FAILURE_POLICY: refuse
    command: ["node", "packages/rab-server/dist/database/typeorm/scripts/deploy-prepare.js"]
    restart: "no"
    logging: *logging
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp

  # rab-ops — SUPERSEDED (separated mode), kept unchanged and never started by `up` until the final clean-up PR (#9, owner
  # approval). Do not run it against an owner-login deployment.
  rab-ops:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    profiles: ["ops"]
    env_file:
      - .env.ops
    environment:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      DB_TARGET: production
      AI_ENABLED: 'false'
      HWS_RUNTIME_ENABLED: "false"
    entrypoint: ["node", "packages/rab-server/dist/command/main.js"]
    command: ["--help"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp

volumes:
  rab-redis-data:
