# Production stack for OpenShip (Oracle VPS) — rab-api, rab-worker, rab-redis
# ONLY. No Postgres, no frontend, no Adminer: the database is Neon and the web
# console is Vercel, both outside this stack.
#
# OpenShip does not support Compose `build.target` — this Dockerfile's final
# (and last-declared) stage is `rab` (see packages/rab-docker/rab/Dockerfile),
# which Docker/Compose builds by default when no `target` is given, so
# omitting it here still produces the correct image.
#
# No secrets live in this file and no `env_file` is used. DATABASE_URL,
# DATABASE_URL_UNPOOLED, APP_SECRET, CORS_ORIGINS, APP_URL, APP_VERSION,
# SENTRY_DSN, and the EMAIL_* vars are entered manually in OpenShip's
# environment-variable UI after import, identically on rab-api and rab-worker.
#
# STORAGE: this topology intentionally has NO shared volume between rab-api
# and rab-worker (they are independently restarted/rescheduled containers on
# the same host today, and must not assume that stays true — see
# docs/architecture/api-and-worker.md). Object storage is Cloudflare R2
# (S3-compatible), bucket `rab-production-storage`, entered manually in
# OpenShip identically on rab-api and rab-worker:
#
#   S3_BUCKET=rab-production-storage
#   S3_REGION=auto
#   S3_ACCESS_KEY_ID=<R2 access key id>
#   S3_SECRET_ACCESS_KEY=<R2 secret access key>
#   S3_ENDPOINT=https://<ACCOUNT_ID>.r2.cloudflarestorage.com
#
# STORAGE_DRIVER/STORAGE_KEY_PREFIX/S3_FORCE_PATH_STYLE/
# S3_SERVER_SIDE_ENCRYPTION below are fixed decisions for this topology, not
# secrets, so they're committed directly rather than re-entered per deploy.

name: rab-production

services:

  rab-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - rab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rab-api:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile

    command: ./start.sh

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      REDIS_URL: redis://rab-redis:6379
      # See the STORAGE comment block above — S3_BUCKET/S3_REGION/
      # S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY/S3_ENDPOINT are entered in
      # OpenShip, identically here and on rab-worker.
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      # R2 encrypts at rest automatically; it does not accept AWS's SSE
      # request headers, so this must stay NONE for R2 (see S3StorageDriver —
      # NONE sends no ServerSideEncryption/SSEKMSKeyId fields at all).
      S3_SERVER_SIDE_ENCRYPTION: NONE

    depends_on:
      - rab-redis

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

    restart: unless-stopped

  rab-worker:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile

    command: ./start-worker.sh

    environment:
      NODE_ENV: production
      REDIS_URL: redis://rab-redis:6379
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE

    depends_on:
      - rab-redis
      - rab-api

    restart: unless-stopped

volumes:
  rab-redis-data:
