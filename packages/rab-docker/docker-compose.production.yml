services:

  # ---------------------------------------------------------------------------
  # db — the BUNDLED PostgreSQL (DB-SETUP, owner decisions D1 a / D3 / D4; like Twenty's `db`). The default database (mode a):
  # the client sets only PG_DATABASE_PASSWORD (its superuser password, `openssl rand -hex 32`: letters and digits only, it is
  # interpolated into db-setup's bundled admin URL). Never published, on the internal crewflow-db network only.
  # TLS (D1 a): on the first start (and whenever the certificate is missing, invalid or within 30 days of expiry) the
  # entrypoint below creates its OWN CA and a server certificate for the name `db` (EC P-256, 10 years) with the image's
  # openssl; the CA's private key is deleted right after signing, so nothing can issue another certificate for `db`. The
  # server key stays in the data volume (0600, never shared); the CA certificate goes to the crewflow-db-ca volume, which
  # rab-api and rab-worker mount read-only (api-prestart.sh / worker-start.sh point PG_SSL_CA_CERT_PATH at it when the URL's
  # host is `db`): sslmode=verify-full holds with no client step. A regenerated certificate reaches the app at its next start.
  # AUTHENTICATION: the server reads the pg_hba.conf the entrypoint writes on every start (hba_file): SCRAM over the socket,
  # hostssl + SCRAM for every TCP login (a plain-TCP connection is refused), no trust, no peer (initdb also gets SCRAM for
  # the cluster's own, unused, file). Even a process inside this container needs the password (`docker compose exec -e PGPASSWORD db psql -U postgres -d crewflow`, PGPASSWORD = PG_DATABASE_PASSWORD).
  # pg_isready (the health check) does not authenticate. The image reads the superuser password ONLY when the data volume is
  # empty (first start): changing PG_DATABASE_PASSWORD later does not change it (ALTER ROLE postgres PASSWORD ... first).
  # YOUR OWN DATABASE (like Twenty's Helm db.enabled=false): CREWFLOW_BUNDLED_DB=0, PG_DATABASE_URL (the crewflow_owner
  # URL) and, to have db-setup create crewflow_owner, PG_ADMIN_URL (its admin URL); direct host, sslmode=verify-full. This service then gets 0 replicas and never starts, and PG_DATABASE_PASSWORD is NOT needed
  # (owner decision 2026-11-17: no dummy password): it is required only while this db runs, which its entrypoint, db-setup
  # and the env-file lint / --environment preflight check (a compose `:?` cannot depend on CREWFLOW_BUNDLED_DB).
  # Image: postgres:16 (Debian, 16.16), by its multi-platform index digest. CREWFLOW_POSTGRES_IMAGE may name a Debian
  # postgres:16, :17 or :18 image by digest. VOLUME LAYOUT, the same for all three (a fresh named volume takes the ownership
  # of the image directory it is mounted on, and as uid 999 the db can only use volumes whose root it can write):
  #   crewflow-db-data -> /var/lib/postgresql (postgres-owned in every major): PGDATA=pgdata/ (fixed, so a changed major
  #                       refuses to start on the old files instead of initialising an empty cluster), the TLS key in tls/;
  #   crewflow-db-ca   -> /var/tmp (world-writable with the sticky bit in every major; nothing else uses it): ca.crt only;
  #   /var/lib/postgresql/data, the 16/17 images' default data directory and VOLUME, is an empty read-only tmpfs, so no
  #   anonymous volume is ever created there and nothing can be written to it by mistake.
  # A major upgrade is a dump/restore (or pg_upgrade) into a new volume, never a silent image change.
  # ---------------------------------------------------------------------------
  db:
    # PostgreSQL 16.16 (checked 2026-11-17): this is the official library/postgres multi-platform INDEX digest of postgres:16
    # (Debian trixie; amd64, arm64 and the other official platforms). On Docker Hub (registry-1.docker.io/v2/library/postgres)
    # the tags 16, 16.16, 16-trixie and 16.16-trixie resolve to exactly this digest, and its amd64 and arm64 image configs
    # carry PG_MAJOR=16 and PG_VERSION=16.16-1.pgdg13+1. A minor release (16.15 before): same data format, an existing data
    # volume starts as-is. A bump is a reviewed change of this line in every file that copies this service (and of PG16_IMAGE
    # in .github/workflows/upgrade-with-data.yaml), never a tag.
    image: ${CREWFLOW_POSTGRES_IMAGE:-postgres@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # BEGIN crewflow-db password check
        # PG_DATABASE_PASSWORD (this service's POSTGRES_PASSWORD) is REQUIRED while this bundled db runs. Checked here, at start,
        # not with a compose `:?` (that would demand it with your own database too, CREWFLOW_BUNDLED_DB=0, where this service
        # has 0 replicas and never starts: owner decision 2026-11-17, no dummy password). Before the volume is touched.
        if [ -z "$${POSTGRES_PASSWORD:-}" ]; then
          echo 'crewflow-db: REFUSED - PG_DATABASE_PASSWORD is required for the bundled database (compose.env; 32+ random characters, e.g. 64 hex). With your own database set CREWFLOW_BUNDLED_DB=0 and its URL instead (compose.env.example).' >&2
          exit 64
        fi
        # Review of PR #230, I-2: on the FIRST initialisation only (no cluster in the data volume yet), the password must be 32+
        # characters of A-Z a-z 0-9 _ - (it is interpolated unencoded into db-setup's bundled URL). An existing volume ignores
        # the value (the image reads it only on an empty PGDATA), so it is never refused there.
        if [ ! -s "$${PGDATA}/PG_VERSION" ]; then
          case "$${POSTGRES_PASSWORD}" in
            *[!A-Za-z0-9_-]*) crewflow_pw_ok=no ;;
            *) if [ "$${#POSTGRES_PASSWORD}" -ge 32 ]; then crewflow_pw_ok=yes; else crewflow_pw_ok=no; fi ;;
          esac
          if [ "$$crewflow_pw_ok" != yes ]; then
            echo 'crewflow-db: REFUSED - PG_DATABASE_PASSWORD must be 32+ characters of A-Z a-z 0-9 _ - for a new bundled database (64 hex characters recommended). Value not shown.' >&2
            exit 64
          fi
          unset crewflow_pw_ok
        fi
        # END crewflow-db password check
        # The data volume root arrives world-writable (copied from the image): only postgres may write it.
        chmod 0755 /var/lib/postgresql
        # ONE server per data volume (2026-10-15 incident: two postgres servers on one data directory corrupt it). A kernel
        # lock on the volume itself, taken before anything here touches the volume, held by the server for its whole life (fd 8
        # survives every exec and is inherited by every postgres process); any second container on this volume refuses.
        exec 8>/var/lib/postgresql/.crewflow-server.lock
        flock -n 8 || { echo 'crewflow-db: another server already holds this data volume - refusing' >&2; exit 1; }
        cd /var/lib/postgresql
        if ! { [ -s tls/server.key ] && [ -s tls/server.crt ] && [ -s /var/tmp/ca.crt ] &&
          openssl verify -CAfile /var/tmp/ca.crt tls/server.crt >/dev/null 2>&1 &&
          openssl x509 -checkend 2592000 -noout -in tls/server.crt >/dev/null 2>&1; }; then
          echo 'crewflow-db: creating the bundled database CA and server certificate (CN/SAN db)'
          rm -rf /var/lib/postgresql/tls.new
          ( umask 077; mkdir /var/lib/postgresql/tls.new )
          cd /var/lib/postgresql/tls.new
          openssl req -x509 -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout ca.key -out ca.crt -days 3650 -subj '/CN=crewflow bundled db CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' 2>/dev/null
          openssl req -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout server.key -out server.csr -subj '/CN=db' 2>/dev/null
          printf 'subjectAltName=DNS:db\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 3649 -extfile server.ext 2>/dev/null
          rm -f ca.key ca.srl server.csr server.ext
          chmod 0600 server.key
          chmod 0644 server.crt ca.crt
          if [ "$$(id -u)" = 0 ]; then chown -R postgres:postgres /var/lib/postgresql/tls.new; fi
          cd /var/lib/postgresql
          rm -rf /var/lib/postgresql/tls
          mv tls.new tls
          cp tls/ca.crt /var/tmp/ca.crt.new
          chmod 0644 /var/tmp/ca.crt.new
          mv /var/tmp/ca.crt.new /var/tmp/ca.crt
        fi
        # TLS-only network logins (PR #125 review, finding 5), written on every start so an existing volume gets it too:
        # SCRAM over the socket; every TCP login must be TLS (hostssl) and SCRAM; there is no plain `host` line at all.
        printf 'local all all scram-sha-256\nhostssl all all 0.0.0.0/0 scram-sha-256\nhostssl all all ::/0 scram-sha-256\n' > /var/lib/postgresql/tls/pg_hba.conf.new
        chmod 0600 /var/lib/postgresql/tls/pg_hba.conf.new
        if [ "$$(id -u)" = 0 ]; then chown postgres:postgres /var/lib/postgresql/tls/pg_hba.conf.new; fi
        mv /var/lib/postgresql/tls/pg_hba.conf.new /var/lib/postgresql/tls/pg_hba.conf
        exec docker-entrypoint.sh "$$@"
      - crewflow-db
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/var/lib/postgresql/tls/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: crewflow
      # T-2 (owner decision D4): an environment variable, like Twenty (OpenShip has no secret files).
      # Required while this db runs (the entrypoint above refuses an empty value, exit 64); not with CREWFLOW_BUNDLED_DB=0.
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-}
      # SCRAM for socket and TCP logins alike: no trust (the image default for loopback TCP) and no peer.
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256 --data-checksums
      # The cluster lives in a subdirectory of the data volume, beside the server's TLS key (tls/); fixed for every major.
      PGDATA: /var/lib/postgresql/pgdata
      # psql history and the like go to the private tmpfs, never to a volume.
      HOME: /tmp
    volumes:
      - crewflow-db-data:/var/lib/postgresql
      # Holds only ca.crt: mounted read-only by rab-api and rab-worker.
      - crewflow-db-ca:/var/tmp
    networks: [crewflow-db]
    healthcheck:
      # TCP, not the socket: the image's first-start init runs a socket-only temporary server, which must not count.
      test: ["CMD-SHELL", "pg_isready -q -h localhost -p 5432 -U postgres -d crewflow"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Twenty's Helm `db.enabled`: CREWFLOW_BUNDLED_DB (compose.env) 1 = run this bundled db (the default); 0 = your own
    # database in PG_DATABASE_URL (+ PG_ADMIN_URL): no db container is created. In docker-compose.production.yml and
    # docker-compose.image.yml nothing depends on db (owner instruction 2026-11-18, Twenty's Helm wait-for-db): db-setup waits
    # for the database itself (OpenShip skips a dependent of a service without a container). OpenShip ignores
    # deploy.replicas: there, switch the db service off in OpenShip itself. 0 without your own database fails closed: db-setup
    # refuses (exit 64: PG_DATABASE_URL still names the bundled host db) and rab-api never starts. The compose.env lint and the
    # --environment preflight accept only 0 or 1, and 0 only with a PG_DATABASE_URL (and any PG_ADMIN_URL) whose host is
    # not `db`.
    # Development and QA never set it (they have no external database).
    deploy:
      replicas: ${CREWFLOW_BUNDLED_DB:-1}
    restart: unless-stopped
    # SIGINT = PostgreSQL fast shutdown (checkpoint, then exit); give it time before SIGKILL.
    stop_signal: SIGINT
    stop_grace_period: 90s
    logging: *logging
    # The image's own postgres user (999:999 in the Debian image): it initialises the cluster as that user, no capability.
    user: '999:999'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=2775
      - /tmp:uid=999,gid=999,mode=0700
      # The 16/17 images' default data directory (their VOLUME): empty and read-only, never an anonymous volume.
      - /var/lib/postgresql/data:uid=999,gid=999,mode=0555,size=64k
    shm_size: 256m
    pids_limit: 256
    mem_limit: ${CREWFLOW_POSTGRES_MEM_LIMIT:-1024m}
    cpus: ${CREWFLOW_POSTGRES_CPUS:-2}

  rab-redis:
    image: redis:7-alpine
    # AOF + noeviction (an evicting policy can drop BullMQ jobs and locks). No ACL file here: a platform without a host
    # secret directory cannot mount one, so this Redis is unauthenticated and must stay unpublished (docker-compose.image.yml
    # has the ACL).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - rab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------------------------
  # db-setup — the ONE-SHOT database setup, the Twenty way (owner decision 2026-11-18). Twenty: the
  # `ensure-database-exists` init container alone holds the superuser secret and creates the app user with the app user's own
  # password (twentyhq/twenty@eedb0a73 packages/twenty-docker/helm/twenty/templates/deployment-server.yaml:82-128). The SAME
  # image as rab-api and rab-worker; its entrypoint db-setup.sh runs only the bootstrap child, then exits. It is the ONLY
  # service that receives an admin login: (a) the bundled db's superuser (default), or (b) PG_ADMIN_URL, your own
  # database's admin URL; with it, crewflow_owner is created with the password inside PG_DATABASE_URL (the same URL rab-api
  # and rab-worker receive), its password is set to that one when it does not log in, and CREATEROLE is removed once the
  # schema is complete. (c) Without an admin, it only checks crewflow_owner, read-only. NOT APP_SECRET (db-setup.sh refuses
  # it). It writes no file. It runs again on every `docker compose up` (idempotent: it changes only what differs), then
  # rab-api starts (depends_on: service_completed_successfully). No port, no health check (it exits), never restarted.
  # NO depends_on (owner instruction 2026-11-18, Twenty's Helm wait-for-db): it first waits, bounded, for the database it
  # uses (the wrapper below: PG_ADMIN_URL's host when it is set, else the bundled db, else PG_DATABASE_URL's host).
  # It also runs with CREWFLOW_BUNDLED_DB=0 (unlike Twenty's `if db.enabled` init containers): your own database still
  # needs crewflow_owner created (PG_ADMIN_URL) or checked (PG_DATABASE_URL only).
  # ---------------------------------------------------------------------------
  db-setup:
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:-sha256:9f7e83c858829060754e21a3bf4fd6afa40769e0f44313f5f1c8c7f9761adb92}
    # Twenty's Helm wait-for-db init container (owner instruction 2026-11-18): no `depends_on: db` (with CREWFLOW_BUNDLED_DB=0
    # that dependency has no container, and OpenShip then skips db-setup instead of starting it). This wrapper waits, bounded
    # (CREWFLOW_DB_WAIT_SECONDS, default 170 s), until the database db-setup uses accepts connections (PG_ADMIN_URL's host when
    # it is set, else the bundled db, else PG_DATABASE_URL's host), then execs ./db-setup.sh unchanged. It is here, not only in the image, because
    # the pinned release (0.6.0) has a db-setup.sh without the wait; later images run the identical block again inside
    # db-setup.sh (instant once the database is up). The block between the BEGIN/END lines must stay byte-identical to
    # rab/db-setup.sh (compose-owner-login.cjs, run-prestart-shell-tests.cjs); `$$` is Compose's escape for `$`.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # BEGIN crewflow wait-for-db
        # Twenty's Helm wait-for-db init container, re-implemented (not copied): db-setup and db-harden have no `depends_on: db`,
        # because with CREWFLOW_BUNDLED_DB=0 the bundled db has no container and a platform that does not skip a 0-replica dependency
        # (OpenShip: 'Dependency "db" has no container for service_healthy') then never starts them. Instead they wait for the
        # database they will use: PG_ADMIN_URL's host when it is set (mode b: PG_ADMIN_URL + PG_DATABASE_URL, the same database;
        # inside db-setup.sh also mode a, where PG_ADMIN_URL is the bundled superuser URL by then), else the bundled db (host db,
        # mode a, from CREWFLOW_BUNDLED_DB_ADMIN_URL: the compose wrapper runs before db-setup.sh picks the mode), else
        # PG_DATABASE_URL's host (mode c). The probe is pg_isready's check, in node (the image has no pg_isready): a TCP connect and a
        # protocol-3.0 startup message with a FIXED placeholder login (crewflow_wait_for_db), no TLS and no password; an
        # authentication request or any error other than 57P03 (starting up / shutting down) means the server accepts connections.
        # It never authenticates, never runs a query and reads nothing but the URL's host and port; the bootstrap child then makes
        # the real verify-full connection. Bounded by CREWFLOW_DB_WAIT_SECONDS (unset or empty = 170; 0 = do not wait; at most 900)
        # on the monotonic clock; a progress line whenever the result changes and every 10 s; on timeout ONE fixed line and exit 70
        # (a failure, like the bootstrap child's own "did not accept a connection" 70; 64 stays for settings the operator must
        # change, such as an invalid CREWFLOW_DB_WAIT_SECONDS). The default 170 s stays inside OpenShip's 180 s window for a
        # service_completed_successfully dependency without a health check (security review L1), so on a dead database db-setup
        # fails with its own line first. Prints no URL, host, login, password or database name (the lines say "db-setup" also in
        # db-harden). Not waited for (the refusal or the child's check comes at once): a bad CREWFLOW_BUNDLED_DB, an empty
        # PG_DATABASE_URL or an empty crewflow_owner password in it, the bundled db without its password, an unparseable URL. In the
        # compose wrapper ONLY those come before the wait: db-setup.sh's own preamble refusals (arguments, a password variable or
        # APP_SECRET present, a login that is not crewflow_owner) run after it (review L2). Safe to run twice: the same block runs
        # in the db-setup wrapper of docker-compose.production.yml / docker-compose.image.yml (the published image's db-setup.sh
        # has no wait) and again here (run-prestart-shell-tests.cjs and compose-owner-login.cjs require the copies to be identical).
        crewflow_wait_for_db() {
          case "$${CREWFLOW_BUNDLED_DB:-1}" in 0 | 1) ;; *) return 0 ;; esac
          case "$${PG_DATABASE_URL:-}" in '' | *://crewflow_owner:@*) return 0 ;; esac
          if [ -n "$${PG_ADMIN_URL:-}" ]; then
            crewflow_wait_url="$$PG_ADMIN_URL"
          elif [ "$${CREWFLOW_BUNDLED_DB:-1}" = 1 ]; then
            crewflow_wait_url="$${CREWFLOW_BUNDLED_DB_ADMIN_URL:-}"
            case "$$crewflow_wait_url" in '' | postgresql://postgres:@*) crewflow_wait_url=''; return 0 ;; esac
          else
            crewflow_wait_url="$$PG_DATABASE_URL"
          fi
          case "$${CREWFLOW_DB_WAIT_SECONDS:-170}" in
            *[!0-9]* | ????*) crewflow_wait_limit=invalid ;;
            *) crewflow_wait_limit="$${CREWFLOW_DB_WAIT_SECONDS:-170}" ;;
          esac
          if [ "$$crewflow_wait_limit" = invalid ] || [ "$$crewflow_wait_limit" -gt 900 ]; then
            echo 'db-setup: REFUSED - CREWFLOW_DB_WAIT_SECONDS must be a whole number of seconds from 0 to 900 (unset = 170; 0 = do not wait). Value not shown.' >&2
            exit 64
          fi
          if [ "$$crewflow_wait_limit" -eq 0 ]; then crewflow_wait_url=''; return 0; fi
          crewflow_wait_status=0
          CREWFLOW_DB_WAIT_URL="$$crewflow_wait_url" CREWFLOW_DB_WAIT_LIMIT="$$crewflow_wait_limit" node -e '
        "use strict";
        const net = require("net");
        const limit = Number(process.env.CREWFLOW_DB_WAIT_LIMIT);
        let host = "";
        let port = 5432;
        try {
          const u = new URL(process.env.CREWFLOW_DB_WAIT_URL || "");
          host = decodeURIComponent(u.hostname);
          if (host.startsWith("[") && host.endsWith("]")) host = host.slice(1, -1);
          if (u.port) port = Number(u.port);
          if (u.searchParams.has("host") || u.searchParams.has("port")) host = "";
        } catch (e) {
          host = "";
        }
        delete process.env.CREWFLOW_DB_WAIT_URL;
        if (!host || host.startsWith("/") || !(Number.isInteger(port) && port > 0 && port < 65536)) {
          console.log("db-setup: not waiting for the database: its address could not be read from the URL (the setup step checks the URL next)");
          process.exit(0);
        }
        const which = host === "db" ? "the bundled database (db)" : "your database";
        const started = process.hrtime.bigint();
        const elapsed = () => Number((process.hrtime.bigint() - started) / 1000000n) / 1000;
        const startup = (() => {
          const params = Buffer.from("user\x00crewflow_wait_for_db\x00database\x00crewflow_wait_for_db\x00application_name\x00crewflow-db-setup-wait\x00\x00", "latin1");
          const head = Buffer.alloc(8);
          head.writeInt32BE(8 + params.length, 0);
          head.writeInt32BE(196608, 4);
          return Buffer.concat([head, params]);
        })();
        const probe = (timeoutMs) => new Promise((resolve) => {
          let done = false;
          let buf = Buffer.alloc(0);
          const s = net.connect({ host: host, port: port });
          const finish = (result) => {
            if (done) return;
            done = true;
            s.destroy();
            resolve(result);
          };
          s.setTimeout(timeoutMs, () => finish("no answer in time"));
          s.on("error", (e) => {
            const code = String((e && e.code) || "unknown");
            if (code === "ECONNREFUSED") finish("connection refused");
            else if (code === "ENOTFOUND" || code === "EAI_AGAIN") finish("host name not found yet");
            else finish("network error " + code.replace(/[^A-Z0-9_]/g, ""));
          });
          s.on("close", () => finish("connection closed before an answer"));
          s.on("connect", () => s.write(startup));
          s.on("data", (d) => {
            buf = Buffer.concat([buf, d]);
            if (buf[0] === 0x52) return finish("ready");
            if (buf[0] !== 0x45) return finish("an answer that is not PostgreSQL");
            if (buf.length < 5) return;
            const len = buf.readInt32BE(1);
            if (len < 4 || len > 65536) return finish("ready");
            if (buf.length < 1 + len) return;
            const fields = buf.subarray(5, 1 + len).toString("latin1").split("\x00");
            const sqlstate = (fields.find((f) => f[0] === "C") || "").slice(1);
            finish(sqlstate === "57P03" ? "the server is starting up or shutting down (57P03)" : "ready");
          });
        });
        (async () => {
          let last = "";
          let nextReport = 0;
          for (;;) {
            const left = limit - elapsed();
            const result = await probe(Math.max(1000, Math.min(5000, Math.floor(left * 1000))));
            const t = elapsed();
            if (result === "ready") {
              console.log("db-setup: " + which + " accepts connections (waited " + Math.round(t) + "s)");
              process.exit(0);
            }
            if (result !== last || t >= nextReport) {
              console.log("db-setup: waiting for " + which + " to accept connections (" + Math.round(t) + "s of " + limit + "s): " + result);
              last = result;
              nextReport = t + 10;
            }
            if (t >= limit) {
              console.error("db-setup: REFUSED - the database did not accept connections within " + limit + "s (CREWFLOW_DB_WAIT_SECONDS). Nothing was changed. Check that it is running and reachable from this container, then start again.");
              process.exit(70);
            }
            await new Promise((r) => setTimeout(r, Math.min(2000, Math.ceil((limit - t) * 1000))));
          }
        })().catch(() => {
          console.error("db-setup: REFUSED - the wait for the database stopped unexpectedly. Nothing was changed.");
          process.exit(70);
        });
        ' &
          crewflow_wait_pid=$$!
          trap 'kill -TERM "$$crewflow_wait_pid" 2>/dev/null; exit 143' TERM INT
          wait "$$crewflow_wait_pid" || crewflow_wait_status=$$?
          trap - TERM INT
          unset crewflow_wait_url crewflow_wait_limit crewflow_wait_pid
          case "$$crewflow_wait_status" in
            0) ;;
            70) exit 70 ;;
            *) echo "db-setup: REFUSED - the wait for the database stopped unexpectedly (exit $$crewflow_wait_status). Nothing was changed." >&2; exit 70 ;;
          esac
        }
        # END crewflow wait-for-db
        crewflow_wait_for_db
        exec ./db-setup.sh
      - db-setup
    environment:
      # The database settings (compose.env). db-setup.sh picks the mode; the bootstrap child refuses a non-crewflow_owner
      # PG_DATABASE_URL, a crewflow_owner PG_ADMIN_URL, and two URLs that name different databases:
      #   (b) PG_ADMIN_URL: your own database's admin URL (DIRECT host, sslmode=verify-full; CREWFLOW_BUNDLED_DB=0), THIS
      #       SERVICE ONLY: db-setup creates crewflow_owner with it. rab-api and rab-worker NEVER receive it (pinned "").
      PG_ADMIN_URL: ${PG_ADMIN_URL:-}
      PG_ADMIN_DIRECT_URL: ${PG_ADMIN_DIRECT_URL:-}
      PG_DATABASE_HOST: ${PG_DATABASE_HOST:-}
      #   ALWAYS: the crewflow_owner URL, the very expression rab-api and rab-worker receive (x-crewflow-required-env): your
      #   crewflow_owner URL (b, c), or the bundled db's built from PG_DATABASE_APP_PASSWORD (a).
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgresql://crewflow_owner:${PG_DATABASE_APP_PASSWORD:-}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-crewflow}?sslmode=verify-full}
      #   (a) no PG_ADMIN_URL and CREWFLOW_BUNDLED_DB 1 (the default): the admin is the bundled db's superuser, built here from
      #       PG_DATABASE_PASSWORD; db-setup.sh refuses an empty password (no `:?` here: PG_DATABASE_PASSWORD is not required
      #       with your own database). (c) CREWFLOW_BUNDLED_DB=0 and no PG_ADMIN_URL: read-only checks.
      CREWFLOW_BUNDLED_DB: ${CREWFLOW_BUNDLED_DB:-1}
      CREWFLOW_BUNDLED_DB_ADMIN_URL: postgresql://postgres:${PG_DATABASE_PASSWORD:-}@db:5432/crewflow?sslmode=verify-full
      # How long db-setup waits for the database to accept connections before it gives up (exit 70): whole seconds, 0-900;
      # unset or empty = 170 (inside OpenShip's 180 s window for rab-api -> db-setup); 0 = do not wait. Not a database
      # credential; read only by the wait above.
      CREWFLOW_DB_WAIT_SECONDS: ${CREWFLOW_DB_WAIT_SECONDS:-170}
      # The TLS trust setting of rab-api / rab-worker (the shared optional list above): an external database's CA file.
      # Not PG_DATABASE_URL_IS_DIRECT: the bootstrap child refuses a transaction-pooler URL whatever that flag says.
      PG_SSL_CA_CERT_PATH:
      PG_SSL_CA_CERT:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
    networks: [default, crewflow-db]
    volumes:
      # The bundled db's own CA (read-only; db-setup.sh sets PG_SSL_CA_CERT_PATH for host db).
      - crewflow-db-ca:/run/crewflow/db-ca:ro

    restart: "no"
    logging: *logging
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 40s

  # ---------------------------------------------------------------------------
  # db-harden — the ONE-SHOT CREATEROLE hardening (owner decision 2026-11-18, security review of PR #246, M1: "auto-close
  # plus a grace period"). crewflow_owner is created CREATEROLE because the first start's migrate child creates the schema
  # roles. This service closes that window in the SAME deploy: the same image and code path as db-setup (db-setup.sh
  # harden -> the bootstrap child's CREATEROLE step), the same database settings. It polls READ-ONLY (a crewflow_owner
  # session reads the migration ledger) until the ledger holds every migration of this image, bounded by
  # CREWFLOW_DB_HARDEN_TIMEOUT_SECONDS (default 1200, 60-7200), then, as the admin, under the advisory lock and after the
  # other-database check, removes CREATEROLE and the mark (ALTER ROLE crewflow_owner NOCREATEROLE; COMMENT ON ROLE
  # crewflow_owner IS NULL) and exits 0. Already hardened: no-op, exit 0. Timeout: a clear error, a non-zero exit,
  # nothing changed (the next `docker compose up -d` retries; db-setup also removes it once the schema is complete).
  # Mode c (no PG_ADMIN_URL, CREWFLOW_BUNDLED_DB=0): nothing to do, exit 0 (the operator removes CREATEROLE by hand within
  # the mark's grace period). NO depends_on at all, and NOTHING depends on it: it never blocks rab-api or rab-worker, and
  # it does not rely on depends_on conditions (OpenShip drops them): it waits for the database and the ledger by itself.
  # The database wait is db-setup.sh's own `crewflow wait-for-db` block (the same target selection as db-setup's wrapper:
  # PG_ADMIN_URL's host when it is set, else the bundled db; bound CREWFLOW_DB_WAIT_SECONDS), so no compose wrapper here:
  # `harden` exists only in images whose db-setup.sh already has that block (the published 0.6.0 image has neither).
  # The only other service besides db-setup that receives the admin login (compose-owner-login.cjs enforces the shape).
  # ---------------------------------------------------------------------------
  db-harden:
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:-sha256:9f7e83c858829060754e21a3bf4fd6afa40769e0f44313f5f1c8c7f9761adb92}
    entrypoint: ["./db-setup.sh", "harden"]
    environment:
      # db-setup's database settings, exactly (the same modes and refusals): PG_ADMIN_URL (b), the crewflow_owner URL,
      # the bundled db switch and its superuser URL (a). rab-api and rab-worker NEVER receive the admin login.
      PG_ADMIN_URL: ${PG_ADMIN_URL:-}
      PG_ADMIN_DIRECT_URL: ${PG_ADMIN_DIRECT_URL:-}
      PG_DATABASE_HOST: ${PG_DATABASE_HOST:-}
      PG_DATABASE_URL: ${PG_DATABASE_URL:-postgresql://crewflow_owner:${PG_DATABASE_APP_PASSWORD:-}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-crewflow}?sslmode=verify-full}
      CREWFLOW_BUNDLED_DB: ${CREWFLOW_BUNDLED_DB:-1}
      CREWFLOW_BUNDLED_DB_ADMIN_URL: postgresql://postgres:${PG_DATABASE_PASSWORD:-}@db:5432/crewflow?sslmode=verify-full
      PG_SSL_CA_CERT_PATH:
      PG_SSL_CA_CERT:
      # How long it waits (read-only polls) for the ledger to hold every migration of this image: 60-7200 s.
      CREWFLOW_DB_HARDEN_TIMEOUT_SECONDS: ${CREWFLOW_DB_HARDEN_TIMEOUT_SECONDS:-1200}
      # How long it first waits for the database to accept connections (db-setup.sh's wait block; the same value as db-setup).
      CREWFLOW_DB_WAIT_SECONDS: ${CREWFLOW_DB_WAIT_SECONDS:-170}
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
    networks: [default, crewflow-db]
    volumes:
      # The bundled db's own CA (read-only; db-setup.sh sets PG_SSL_CA_CERT_PATH for host db).
      - crewflow-db-ca:/run/crewflow/db-ca:ro
    restart: "no"
    logging: *logging
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 30s

  # rab-api — the HTTP API. Migrates on start, registers the job schedulers, then serves (O3). ONE instance (C5).
  rab-api:
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:-sha256:9f7e83c858829060754e21a3bf4fd6afa40769e0f44313f5f1c8c7f9761adb92}
    # DB-SETUP PID 1 (lead decision 2026-11-12, owner requirement #5): api-prestart.sh is the ENTRYPOINT (PID 1; no command,
    # no compose init). It runs the refusals (this service never receives a PG_ADMIN_URL value, pinned ""), the
    # runtime-isolation check, takes PG_DATABASE_URL (the crewflow_owner URL) from the environment, runs the migrate child and
    # the scheduler registration, then `exec /sbin/tini -s -- node packages/rab-server/dist/main.js`.
    # Owner CLI one-offs: `docker compose run --rm --no-deps rab-api node packages/rab-server/dist/command/main.js <command>`
    # (the same refusals and the same PG_DATABASE_URL, then the command, nothing else).
    entrypoint: ["./api-prestart.sh"]
    ports:
      - "${CREWFLOW_API_BIND:-127.0.0.1}:${CREWFLOW_API_HOST_PORT:-3000}:3000"
    networks: [default, crewflow-db]
    volumes:
      # The bundled db's own CA (read-only; api-prestart.sh sets PG_SSL_CA_CERT_PATH=/run/crewflow/db-ca/ca.crt for host db).
      - crewflow-db-ca:/run/crewflow/db-ca:ro
    environment:
      # REQUIRED and OPTIONAL: the shared lists above (identical on rab-worker).
      <<: [*required-env, *optional-env]
      # Owner decision L-2 (review of PR #230): PINNED EMPTY, a literal, like PG_DATABASE_URL, so a PG_ADMIN_URL put in an env
      # file or a platform UI can never reach this container. The entrypoint refuses any non-empty value (exit 64); the gates
      # accept exactly this empty literal here and refuse any other value. The admin URL reaches db-setup only.
      PG_ADMIN_URL: ""
      PG_ADMIN_DIRECT_URL: ""
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_FIRST_NAME: ${BOOTSTRAP_ADMIN_FIRST_NAME:-}
      BOOTSTRAP_ADMIN_LAST_NAME: ${BOOTSTRAP_ADMIN_LAST_NAME:-}
      BOOTSTRAP_ADMIN_ORG_SLUG: ${BOOTSTRAP_ADMIN_ORG_SLUG:-}
      BOOTSTRAP_ADMIN_ORG_NAME: ${BOOTSTRAP_ADMIN_ORG_NAME:-}
      # OPTIONAL, rab-api only. Pool ceiling (code default 10; the Worker's 12 is pinned on rab-worker).
      PG_POOL_MAX_CONNECTIONS:
      # Seconds api-prestart.sh waits before exiting after a start-up failure (0-300).
      CREWFLOW_STARTUP_FAILURE_DELAY_SECONDS: ${CREWFLOW_STARTUP_FAILURE_DELAY_SECONDS:-15}
      # PINNED (owner decisions; shown, not to be changed):
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      REDIS_URL: redis://rab-redis:6379
      HWS_RUNTIME_ENABLED: "false"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      CREWFLOW_MIGRATE_ON_START: "true"
      # none by default (C4); token is an opt-in (BC-11), entered as the interpolation value (docker-compose.image.yml).
      CREWFLOW_MIGRATION_APPROVAL_MODE: ${CREWFLOW_MIGRATION_APPROVAL_MODE:-none}
      # Notification delivery (owner decision 2026-11-06), identical on rab-api and rab-worker: see docker-compose.image.yml.
      # Push sweep: the owner rule (2026-11-06, Phase X J2) for the day PUSH_ENABLED is turned on, committed now on both
      # services so turning push on needs no compose change. No effect while push is off: the push-dispatch scheduler is
      # registered only with PUSH_ENABLED=true (rab-worker scheduler-plan.ts).
      WORKER_FAST_PUBLISH_NOTIFY: "true"
      WORKER_EMAIL_DISPATCH_INTERVAL_SECONDS: "30"
      WORKER_PUSH_DISPATCH_INTERVAL_SECONDS: "30"
      # Phase D switches (owner decision 2026-11-06), identical on rab-api and rab-worker: see docker-compose.image.yml.
      # Timer triggers on for all four kinds; safety sweeps offer expiry 300 s, manager confirmation 120 s, late clock-in
      # 300 s; the shift monitor keeps 300 s (not set); the combined scan stays off (WORKER_SHIFT_SCAN_MODE not set).
      WORKER_TIMER_TRIGGERS: "on"
      WORKER_TIMER_TRIGGER_KINDS: "offer-expiry,manager-confirmation,no-show,late-clock-in"
      WORKER_OFFER_EXPIRY_INTERVAL_SECONDS: "300"
      WORKER_MANAGER_CONFIRMATION_TIMEOUT_INTERVAL_SECONDS: "120"
      WORKER_LATE_CLOCK_IN_INTERVAL_SECONDS: "300"
      # Pay-statement dispatch sweep (owner decision 2026-11-11, J1a), identical on rab-api and rab-worker: 30 s (code
      # default 5 s): see docker-compose.image.yml.
      WORKER_SHIFT_STATEMENT_DISPATCH_INTERVAL_SECONDS: "30"
    depends_on:
      rab-redis:
        condition: service_healthy
      # db-setup (the only service with an admin login) has created or checked crewflow_owner. No dependency on db (owner
      # instruction 2026-11-18, Twenty's Helm wait-for-db): db-setup waits for the database itself. A platform that drops this
      # condition (OpenShip: NOT VERIFIED) starts the API early: its migrate child then fails to log in (or finds the role
      # missing), exits non-zero, and the restart policy retries; it never takes an admin path.
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 900s
    restart: unless-stopped
    logging: *logging
    # Runtime isolation (H6). REQUIRED; a platform that drops these keys runs the API degraded (warn mode: api-prestart.sh
    # logs each missing control) — the reason this file is not the supported deployment.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${CREWFLOW_API_MEM_LIMIT:-1024m}
    cpus: ${CREWFLOW_API_CPUS:-2}
    stop_grace_period: 40s

  # rab-worker — background jobs, ONE process as uid/gid 1000 (no root launcher, no per-child credentials, in-process
  # provisioning). Never migrates, only consumes the job schedulers; starts after a healthy API and Redis.
  rab-worker:
    # O1: the SAME image variable as rab-api (one release, one digest), a different command.
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:-sha256:9f7e83c858829060754e21a3bf4fd6afa40769e0f44313f5f1c8c7f9761adb92}
    # worker-start.sh is the ENTRYPOINT (PID 1): the refusals (this service never receives a PG_ADMIN_URL value, pinned
    # ""), PG_DATABASE_URL (the crewflow_owner URL) from the environment, then `exec /sbin/tini -s -- node
    # packages/rab-worker/dist/main.js`. tini is PID 1 (the Worker's watchdog SIGKILL, ignored by the kernel for PID 1, still
    # works). NO compose `init: true` (compose-owner-login.cjs refuses it).
    entrypoint: ["./worker-start.sh"]
    working_dir: /app
    networks: [default, crewflow-db]
    volumes:
      - crewflow-db-ca:/run/crewflow/db-ca:ro
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    # Kept from the separated sizing until the H6 matrix re-measures with the native renderer (#61).
    pids_limit: 1024
    # Native PDF render threads (review M-3): PDF_NATIVE_CONCURRENCY x 384 MB heap cap must fit
    # PDF_NATIVE_MEMORY_BUDGET_MB (default 768 = half of this 1536m), else the Worker refuses to boot. Set both together.
    mem_limit: ${CREWFLOW_WORKER_MEM_LIMIT:-1536m}
    cpus: ${CREWFLOW_WORKER_CPUS:-2}
    logging: *logging
    environment:
      # REQUIRED and OPTIONAL: the shared lists above (identical on rab-api).
      <<: [*required-env, *optional-env]
      # Owner decision L-2 (review of PR #230): PINNED EMPTY, a literal, like PG_DATABASE_URL, so a PG_ADMIN_URL put in an env
      # file or a platform UI can never reach this container. The entrypoint refuses any non-empty value (exit 64); the gates
      # accept exactly this empty literal here and refuse any other value. The admin URL reaches db-setup only.
      PG_ADMIN_URL: ""
      PG_ADMIN_DIRECT_URL: ""
      # OPTIONAL, rab-worker only. Event-loop watchdog: a loop silent this long is a stall (30-900 s).
      CREWFLOW_WORKER_WATCHDOG_STALE_SECONDS: ${CREWFLOW_WORKER_WATCHDOG_STALE_SECONDS:-120}
      # Milliseconds the Worker waits for running jobs on shutdown: a plain integer from 1000 to 34000 (drain + 10 s
      # hard-exit margin < the 45 s stop_grace_period); anything else refuses to boot (XR-10).
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      # PINNED (owner decisions; shown, not to be changed):
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      REDIS_URL: redis://rab-redis:6379
      HWS_RUNTIME_ENABLED: "false"
      # The owner's "feel instant" onboarding pin, read by the in-process provisioner (Agent 2 interface).
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: "5"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      PG_POOL_MAX_CONNECTIONS: "12"
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: "0"
      # Notification delivery (owner decision 2026-11-06) and the push sweep (J2): identical to rab-api.
      WORKER_FAST_PUBLISH_NOTIFY: "true"
      WORKER_EMAIL_DISPATCH_INTERVAL_SECONDS: "30"
      WORKER_PUSH_DISPATCH_INTERVAL_SECONDS: "30"
      # Phase D switches (owner decision 2026-11-06): identical to rab-api.
      WORKER_TIMER_TRIGGERS: "on"
      WORKER_TIMER_TRIGGER_KINDS: "offer-expiry,manager-confirmation,no-show,late-clock-in"
      WORKER_OFFER_EXPIRY_INTERVAL_SECONDS: "300"
      WORKER_MANAGER_CONFIRMATION_TIMEOUT_INTERVAL_SECONDS: "120"
      WORKER_LATE_CLOCK_IN_INTERVAL_SECONDS: "300"
      # Pay-statement dispatch sweep (owner decision 2026-11-11, J1a): identical to rab-api.
      WORKER_SHIFT_STATEMENT_DISPATCH_INTERVAL_SECONDS: "30"
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    healthcheck:
      test: ["CMD", "env", "CREWFLOW_PROVISIONER_ENABLED=false", "node", "/opt/crewflow-bundle/worker-bundle-health.cjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      rab-redis:
        condition: service_healthy
      # API first, Worker after (like Twenty). restart: true makes Compose stop this Worker before it replaces rab-api, so
      # an old Worker never runs beside a new API.
      rab-api:
        condition: service_healthy
        restart: true
    restart: unless-stopped

networks:
  # The bundled db's network: internal (no route out), never published; only db, db-setup, rab-api and rab-worker are on it.
  crewflow-db:
    internal: true

volumes:
  rab-redis-data:
  # The bundled db: its cluster and server TLS key; and its CA certificate (shared read-only with db-setup, rab-api and
  # rab-worker).
  crewflow-db-data:
  crewflow-db-ca:
