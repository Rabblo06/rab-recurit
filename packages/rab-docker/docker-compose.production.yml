# Production stack, IMAGE-BASED like Twenty's packages/twenty-docker (owner decision 2026-11-11), on the OWNER LOGIN
# (owner's final decision 2026-11-04: ONE schema-owning login, crewflow_owner, for the API and the Worker; no mode switch).
#
# DEPLOY = ONE COMMAND (owner decision 2026-11-11, "deploy exactly like Twenty"):
#   docker compose pull && docker compose up -d
# rab-api and rab-worker both run ${CREWFLOW_IMAGE_REPOSITORY}@${CREWFLOW_IMAGE_TAG}: ONE variable, the release's
# multi-platform INDEX digest (sha256:<64 hex>) from the gated publish-image run. THE RELEASE IS PINNED IN THIS FILE (owner
# decision 2026-11-12): the default after `:-` is the published, gate-verified release digest, so OpenShip deploys without
# anyone typing CREWFLOW_IMAGE_TAG; a release bump is a reviewed PR that changes that digest on both lines. OpenShip
# (or `docker compose`) can override it by setting CREWFLOW_IMAGE_TAG to another sha256 digest. The default is only ever a
# full digest, never a tag or `latest` (scripts/compose-one-image.cjs refuses anything else; docker-compose.image.yml stays
# strict with no default). This file never builds: the server always runs an image that passed the image security gate.
# Building from source is docker-compose.local-build.yml (LOCAL/DEV ONLY). The API starts first, migrates, registers the job
# schedulers and becomes healthy; the Worker starts only after that (depends_on rab-api: service_healthy, restart: true —
# Compose stops the old Worker BEFORE it replaces the API, so an old Worker never runs beside a new API).
# Rollback: set CREWFLOW_IMAGE_TAG=<previous release digest> (or revert the digest bump on main), then the same command.
#
# !!! OPENSHIP CANNOT RUN THIS STACK SAFELY (M0 D11) !!!
# OpenShip drops `user`, `read_only`, `tmpfs`, `cap_drop`, `security_opt`, `pids_limit`, `env_file` and the `depends_on`
# conditions (docs/release/OPENSHIP-COMPATIBILITY.md). O1 (one image): the image's default user is now the non-root
# `node` (1000:1000) for every command, so a dropped `user:` no longer means a root Worker; the other dropped keys
# (read-only root, capabilities, no-new-privileges, PID limits, tmpfs, init) still make OpenShip unsupported. The supported
# deployment is docker-compose.image.yml with plain `docker compose`
# (docs/release/OWNER-LOGIN-DEPLOYMENT.md, OWNER-LOGIN-ORACLE-VM-PLAN.md). A push to main may redeploy the temporary
# OpenShip deployment from this file: before this version merges, the owner must disable that auto-deploy or accept that
# the temporary deployment stops (its database has no crewflow_owner). NEEDS OWNER APPROVAL.
#
# This file mirrors docker-compose.image.yml's runtime contract (same image variable, services, commands, isolation keys,
# environment keys) with per-service environment instead of env_file. Where the two differ, docker-compose.image.yml wins.
#
# ONE DATABASE URL, LIKE TWENTY (DB-SETUP, owner decisions D1 a / D3 / D4 / D5). Enter only PG_DATABASE_PASSWORD (and
# APP_SECRET): the admin URL then defaults to the bundled `db` service's superuser, sslmode=verify-full (db makes its own
# CA; the app mounts it read-only). Your own database instead: set PG_DATABASE_ADMIN_URL to its ADMIN URL (DIRECT host,
# sslmode=verify-full); `db` then runs idle. An existing crewflow_owner URL stays in PG_DATABASE_URL and is passed through
# unchanged to rab-api and rab-worker (D5, DB-SETUP-PLAN §7.1). PR #125 option A: the admin URL is interpolated ONLY into
# the one-shot `db-setup` service, which runs the bootstrap child (the ONLY admin connection: creates crewflow_owner or
# resets its password to the one derived from APP_SECRET), writes a credential-free target file to the crewflow-db-target
# volume and exits. rab-api and rab-worker never receive the admin URL: they build the crewflow_owner URL from that file
# (accepted risk TM-DB-1: the admin URL is in db-setup's service definition, T-1). No manual SQL step. There is no migrator, provisioner, worker, ops or replica
# URL and no .env.migrate.
#
# LIFECYCLE (O3, owner decisions C1-C5, like Twenty): no release step, no rab-migrate. The API migrates on start
# (CREWFLOW_MIGRATE_ON_START=true, approval mode none), registers the job schedulers, then serves. The Worker never
# migrates, only consumes the schedulers, and starts after a healthy API and Redis. ONE rab-api, stop-then-start (C5).
# Accepted risk: every start of a new image applies what it ships; recovery is the mandatory pre-upgrade backup
# (docs/release/OWNER-LOGIN-RECOVERY.md).
#
# ENVIRONMENT (owner request 2026-11-12: OpenShip shows every variable rab-api and rab-worker read in production as a field).
# Every name is listed below, in four groups, with NO value committed for a secret:
#   REQUIRED  x-crewflow-required-env, ${KEY:?...}: the API and the Worker refuse to boot in production without it, so the
#             platform must not deploy without it either (OpenShip shows it as "needs value" and refuses the deploy).
#   OPTIONAL  x-crewflow-optional-env (both services, identical by construction) and the per-service extras:
#             ${KEY:-<code default>} = unset behaves exactly as the code default; a bare `KEY:` = no code default (or one
#             that depends on NODE_ENV): plain Compose passes nothing when it is unset; OpenShip passes an empty string,
#             which every reader treats as unset (env.validation.ts drops blank values; the direct readers do the same).
#   PINNED    the literal values under each service: shown, but fixed by owner decisions. Do not override them in the
#             platform UI (OpenShip lets a service-scoped value win; the gates cannot see that).
#   NOT LISTED  names production must never carry (below) and names with no legitimate production value: PORT (the
#             container listens on 3000), PDF_RENDERER and AUTH_MICROSOFT_TENANT (one accepted value), STORAGE_LOCAL_ROOT and
#             S3_KMS_KEY_ID (storage and encryption are pinned), PG_SSL_ALLOW_SELF_SIGNED and CREWFLOW_AUDIT_SINK_FAILURE
#             (production accepts only the default), CREWFLOW_AUDIT_SINK_FILE and AI_DEV_ALLOW_REAL_PROVIDERS (development
#             only), WORKER_DISPATCH_BACKSTOP/RECONCILE_SECONDS and WORKER_DISPATCH_CLAIM_BATCH (global/event dispatch only,
#             not approved), AUTH_LOGIN_HANDOFF_ENABLED/_TTL_SECONDS (needs the refused origin-trust switch),
#             WORKER_SHIFT_MONITOR_INTERVAL_SECONDS and WORKER_SHIFT_SCAN_MODE (owner decision 2026-11-06: leave unset), the
#             inert OPENAI/GOOGLE/MISTRAL/XAI_API_KEY, and CREWFLOW_APP_VERSION (an internal provisioning label).
# rab-api and rab-worker take the SAME values (one login, one connection budget, the API registers the job schedulers with
# its own intervals and the consume-only Worker never compares them). REDIS_URL is pinned to the bundled rab-redis.
# MUST NOT BE ENTERED ANYWHERE: DATABASE_URL, DATABASE_URL_UNPOOLED, DATABASE_DIRECT_URL, DB_POOL_MAX, PG_WORKER_DATABASE_URL,
# CREWFLOW_PROVISIONER_DATABASE_URL, CREWFLOW_MIGRATION_DATABASE_URL, PG_DATABASE_REPLICA_*, PG_OPS_APP_DATABASE_URL,
# CREWFLOW_*_BOOTSTRAP_PASSWORD, CREWFLOW_MIGRATOR_PASSWORD, CREWFLOW_MIGRATION_PHASE, CREWFLOW_DEPLOYMENT_IDENTITY_BOOTSTRAP,
# ALLOW_PRODUCTION_DB_COMMANDS, DB_TARGET, CREWFLOW_DB_MODE, CREWFLOW_PROVISIONER_ENABLED, libpq PG* variables, NODE_OPTIONS,
# BOOTSTRAP_ADMIN_*, TEST_*, ALLOW_REMOTE_TEST_DATABASE, AUTH_*_ISSUER_URL, WORKER_CLAIM_MODE, WORKER_DISPATCH_MODE,
# WORKER_INVITE_AUTO_DELETE_ENABLED, WORKSPACE_SUBDOMAIN_ORIGIN_TRUST_ENABLED, CREWFLOW_MIGRATION_APPROVED,
# CREWFLOW_UPGRADE_INCOMPLETE (set only by api-prestart.sh), WORKER_SCHEDULER=interval; and any override of the keys
# committed below.
#
# SECURITY POSTURE: PT-01 (runbook section 1, THREAT-MODEL.md). There is no operations service: the owner CLI commands run
# as one-off commands of the rab-api image under crewflow_owner (X2.2). O1: the Worker bundle launcher and its separate
# Dockerfile are gone; the API and the Worker build the SAME image (rab/Dockerfile) and differ only by command.

name: rab-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# ---------------------------------------------------------------------------------------------------------------------------
# REQUIRED (rab-api AND rab-worker, the same value on both). The app refuses to boot in production without each of these
# (env.validation.ts productionConfigurationProblems + pg-config.ts + security-audit-sink.ts); the code defaults of APP_URL,
# ACCOUNTS_URL, CORS_ORIGINS, TRUSTED_PROXY_CIDRS and EMAIL_DRIVER are development values production refuses.
# ---------------------------------------------------------------------------------------------------------------------------
x-crewflow-required-env: &required-env
  # NEVER the database admin URL (PR #125 option A). Leave PG_DATABASE_URL unset: rab-api / rab-worker build the
  # crewflow_owner URL from db-setup's target file. Set it ONLY to an existing crewflow_owner URL (pass-through, DB-SETUP
  # D5): any other login is refused by the entrypoints and the runtime. The admin URL (PG_DATABASE_ADMIN_URL, or the
  # bundled db built from PG_DATABASE_PASSWORD, REQUIRED, `openssl rand -hex 32`) reaches only the db-setup service below.
  PG_DATABASE_URL: ${PG_DATABASE_URL:-}
  # Root secret, 32+ random bytes. Changing it later breaks every session and stored encrypted secret.
  APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
  # https:// and not localhost (refused otherwise).
  APP_URL: ${APP_URL:?APP_URL is required (https)}
  ACCOUNTS_URL: ${ACCOUNTS_URL:?ACCOUNTS_URL is required (https)}
  # Comma-separated https:// origins only.
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required (https origins)}
  # The exact edge-proxy address(es) (IPv4 /16 or narrower, IPv6 /48 or narrower).
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required}
  # SMTP or RESEND (LOGGER is refused in production). SMTP needs EMAIL_SMTP_HOST; RESEND needs RESEND_API_KEY.
  EMAIL_DRIVER: ${EMAIL_DRIVER:?EMAIL_DRIVER is required (SMTP or RESEND)}
  # STORAGE_DRIVER is pinned to S3, which needs all five (R2: S3_REGION=auto).
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}
  S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  # Security audit sink (BC-07): production accepts only `stdout`, compliant only with an off-host append-only log shipper.
  CREWFLOW_AUDIT_SINK: ${CREWFLOW_AUDIT_SINK:?CREWFLOW_AUDIT_SINK is required (stdout)}

# ---------------------------------------------------------------------------------------------------------------------------
# OPTIONAL (rab-api AND rab-worker, identical). `${KEY:-x}`: x is the exact code default, so leaving it unset changes
# nothing. Bare `KEY:`: no fixed code default; unset (or blank) = the code's own behaviour.
# ---------------------------------------------------------------------------------------------------------------------------
x-crewflow-optional-env: &optional-env
  # -- Database connection (one login: every pool shares crewflow_owner's connection limit) --
  # PEM CA bundle for verify-full. Unset = the bundled db's own CA when the URL's host is db (api-prestart.sh /
  # worker-start.sh), otherwise the system CA store; the file must exist in the container.
  PG_SSL_CA_CERT_PATH:
  # When set, must equal current_database().
  PG_EXPECTED_DATABASE_NAME:
  PG_POOL_IDLE_TIMEOUT_MS: ${PG_POOL_IDLE_TIMEOUT_MS:-600000}
  PG_POOL_ALLOW_EXIT_ON_IDLE: ${PG_POOL_ALLOW_EXIT_ON_IDLE:-false}
  PG_DATABASE_PRIMARY_TIMEOUT_MS: ${PG_DATABASE_PRIMARY_TIMEOUT_MS:-30000}
  # true declares PG_DATABASE_URL a direct (non-pooled) connection; refused on a pooler-shaped URL.
  PG_DATABASE_URL_IS_DIRECT:
  # Connection budget, checked at boot against the server's limit once both instance counts are set.
  PG_EXPECTED_API_INSTANCES:
  PG_EXPECTED_WORKER_INSTANCES:
  PG_EXPECTED_API_POOL_MAX:
  PG_EXPECTED_WORKER_POOL_MAX:
  PG_EXPECTED_MIGRATE_CONNECTIONS: ${PG_EXPECTED_MIGRATE_CONNECTIONS:-3}
  PG_PROVIDER_RESERVED_CONNECTIONS: ${PG_PROVIDER_RESERVED_CONNECTIONS:-0}
  # -- Deployment identity (BC-11 opt-in): both or neither, e.g. production + the uuid the database was bound with --
  CREWFLOW_DEPLOYMENT_ENVIRONMENT:
  CREWFLOW_DEPLOYMENT_ID:
  # -- Key material (only if this deployment uses keyrings; keep CURRENT values unchanged in a transition) --
  APP_ENCRYPTION_KEYRING:
  APP_ENCRYPTION_ACTIVE_KID:
  APP_JWT_SIGNING_KEYRING:
  APP_JWT_ACTIVE_KID:
  APP_AUTH_CACHE_HMAC_KEY:
  APP_JWT_LEGACY_VERIFY_ENABLED: ${APP_JWT_LEGACY_VERIFY_ENABLED:-true}
  APP_KEY_SEPARATION_REQUIRED: ${APP_KEY_SEPARATION_REQUIRED:-false}
  AUTH_COOKIE_HOST_PREFIX_ENABLED: ${AUTH_COOKIE_HOST_PREFIX_ENABLED:-false}
  AUTH_COOKIE_LEGACY_MIGRATION_ENABLED: ${AUTH_COOKIE_LEGACY_MIGRATION_ENABLED:-true}
  # -- Observability and release labels --
  SENTRY_DSN:
  # Unset = 0.01 in production.
  SENTRY_TRACES_SAMPLE_RATE:
  APP_VERSION: ${APP_VERSION:-dev}
  APP_GIT_COMMIT:
  # -- Email (EMAIL_DRIVER is REQUIRED above) --
  EMAIL_SMTP_HOST:
  EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
  EMAIL_SMTP_USER:
  EMAIL_SMTP_PASSWORD:
  EMAIL_SMTP_NO_TLS: ${EMAIL_SMTP_NO_TLS:-false}
  RESEND_API_KEY:
  # The code default is a placeholder sender: set your verified sender address.
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-rab <no-reply@example.com>}
  EMAIL_REPLY_TO:
  EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-true}
  # -- Object storage (S3_* credentials are REQUIRED above; the driver, prefix, path style and encryption are pinned) --
  S3_SIGNED_URL_TTL_SECONDS: ${S3_SIGNED_URL_TTL_SECONDS:-120}
  S3_MAX_UPLOAD_BYTES: ${S3_MAX_UPLOAD_BYTES:-20971520}
  STORAGE_CLEANUP_PURGE_DELETED_IMAGES_AFTER_DAYS: ${STORAGE_CLEANUP_PURGE_DELETED_IMAGES_AFTER_DAYS:-30}
  STORAGE_RECONCILE_METHOD: ${STORAGE_RECONCILE_METHOD:-list}
  STORAGE_CLEANUP_MIN_SPACING_MINUTES: ${STORAGE_CLEANUP_MIN_SPACING_MINUTES:-720}
  # -- Sign-in providers (at least one must stay enabled; a provider's client id, secret and callback when enabled) --
  AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
  AUTH_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
  AUTH_GOOGLE_CLIENT_ID:
  AUTH_GOOGLE_CLIENT_SECRET:
  AUTH_GOOGLE_CALLBACK_URL:
  AUTH_MICROSOFT_ENABLED: ${AUTH_MICROSOFT_ENABLED:-false}
  AUTH_MICROSOFT_CLIENT_ID:
  AUTH_MICROSOFT_CLIENT_SECRET:
  AUTH_MICROSOFT_CALLBACK_URL:
  AUTH_OAUTH_HANDOFF_ENABLED: ${AUTH_OAUTH_HANDOFF_ENABLED:-false}
  USER_SESSION_ENFORCEMENT_CUTOVER: ${USER_SESSION_ENFORCEMENT_CUTOVER:-false}
  # -- Sign-in rate limits --
  AUTH_LOGIN_EMAIL_IP_BURST: ${AUTH_LOGIN_EMAIL_IP_BURST:-5}
  AUTH_LOGIN_EMAIL_IP_WINDOW_SECONDS: ${AUTH_LOGIN_EMAIL_IP_WINDOW_SECONDS:-900}
  AUTH_LOGIN_EMAIL_IP_DAILY_LIMIT: ${AUTH_LOGIN_EMAIL_IP_DAILY_LIMIT:-30}
  AUTH_LOGIN_ACCOUNT_BURST: ${AUTH_LOGIN_ACCOUNT_BURST:-50}
  AUTH_LOGIN_ACCOUNT_WINDOW_SECONDS: ${AUTH_LOGIN_ACCOUNT_WINDOW_SECONDS:-900}
  AUTH_LOGIN_KNOWN_IP_TTL_DAYS: ${AUTH_LOGIN_KNOWN_IP_TTL_DAYS:-30}
  # -- Two-factor authentication and step-up --
  AUTH_MFA_ENROLMENT_ENABLED: ${AUTH_MFA_ENROLMENT_ENABLED:-true}
  AUTH_MFA_ENFORCE_PLATFORM_ADMIN: ${AUTH_MFA_ENFORCE_PLATFORM_ADMIN:-false}
  AUTH_MFA_ENFORCE_ORGANISATION_OWNER: ${AUTH_MFA_ENFORCE_ORGANISATION_OWNER:-false}
  AUTH_MFA_ENFORCE_INITIAL_MANAGER: ${AUTH_MFA_ENFORCE_INITIAL_MANAGER:-false}
  AUTH_MFA_ENFORCE_OTHER_WEB_USERS: ${AUTH_MFA_ENFORCE_OTHER_WEB_USERS:-false}
  AUTH_MFA_MOBILE_POLICY: ${AUTH_MFA_MOBILE_POLICY:-exempt}
  AUTH_MFA_CHALLENGE_TTL_SECONDS: ${AUTH_MFA_CHALLENGE_TTL_SECONDS:-300}
  AUTH_MFA_CHALLENGE_MAX_ATTEMPTS: ${AUTH_MFA_CHALLENGE_MAX_ATTEMPTS:-5}
  AUTH_MFA_USER_ATTEMPTS_BURST: ${AUTH_MFA_USER_ATTEMPTS_BURST:-10}
  AUTH_MFA_USER_ATTEMPTS_WINDOW_SECONDS: ${AUTH_MFA_USER_ATTEMPTS_WINDOW_SECONDS:-900}
  AUTH_MFA_ISSUER: ${AUTH_MFA_ISSUER:-Crewflow}
  AUTH_STEP_UP_WINDOW_SECONDS: ${AUTH_STEP_UP_WINDOW_SECONDS:-300}
  AUTH_STEP_UP_MFA_FOR_LEGACY_ACTIONS: ${AUTH_STEP_UP_MFA_FOR_LEGACY_ACTIONS:-false}
  # -- Workspace domains (OWNER DECISION, production runbook D6: leave unset unless approved) --
  WORKSPACE_BASE_DOMAIN:
  # Needs WORKSPACE_BASE_DOMAIN.
  WORKSPACE_HOST_ROUTING_ENABLED: ${WORKSPACE_HOST_ROUTING_ENABLED:-false}
  # -- Redis-backed caches (rollout flags) --
  AUTH_CONTEXT_CACHE_ENABLED: ${AUTH_CONTEXT_CACHE_ENABLED:-false}
  USER_SESSION_CACHE_ENABLED: ${USER_SESSION_CACHE_ENABLED:-false}
  CORE_ENTITY_CACHE_ENABLED: ${CORE_ENTITY_CACHE_ENABLED:-false}
  WORKSPACE_METADATA_CACHE_ENABLED: ${WORKSPACE_METADATA_CACHE_ENABLED:-false}
  METADATA_L1_CACHE_ENABLED: ${METADATA_L1_CACHE_ENABLED:-false}
  METADATA_L1_CACHE_TTL_MS: ${METADATA_L1_CACHE_TTL_MS:-2000}
  METADATA_L1_CACHE_MAX_ENTRIES: ${METADATA_L1_CACHE_MAX_ENTRIES:-5000}
  METADATA_L1_CACHE_MAX_BYTES: ${METADATA_L1_CACHE_MAX_BYTES:-8388608}
  # -- Realtime (OFF; enabling it is a separate owner decision). The interval must be the same on both services (J2). --
  REALTIME_ENABLED: ${REALTIME_ENABLED:-false}
  REALTIME_HEARTBEAT_INTERVAL_MS: ${REALTIME_HEARTBEAT_INTERVAL_MS:-30000}
  REALTIME_MAX_CONNECTIONS_PER_USER: ${REALTIME_MAX_CONNECTIONS_PER_USER:-3}
  WORKER_REALTIME_OUTBOX_PUBLISH_INTERVAL_SECONDS: ${WORKER_REALTIME_OUTBOX_PUBLISH_INTERVAL_SECONDS:-2}
  # -- Push (OFF; enabling it is a separate owner decision). Its sweep interval is PINNED at 30 s on both services (J2). --
  PUSH_ENABLED: ${PUSH_ENABLED:-false}
  # FAKE is refused with PUSH_ENABLED=true in production; REAL needs the Firebase / APNs credentials below.
  PUSH_PROVIDER: ${PUSH_PROVIDER:-FAKE}
  FIREBASE_SERVICE_ACCOUNT_JSON:
  APNS_AUTH_KEY_P8:
  APNS_KEY_ID:
  APNS_TEAM_ID:
  APNS_BUNDLE_ID:
  APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-sandbox}
  PUSH_DELIVERY_MAX_ATTEMPTS: ${PUSH_DELIVERY_MAX_ATTEMPTS:-5}
  # -- Background scans (seconds). The API registers the schedulers with these values; the Worker consumes them. --
  WORKER_ACCOUNT_INVITE_CLEANUP_INTERVAL_SECONDS: ${WORKER_ACCOUNT_INVITE_CLEANUP_INTERVAL_SECONDS:-900}
  WORKER_ATTENDANCE_MONITOR_INTERVAL_SECONDS: ${WORKER_ATTENDANCE_MONITOR_INTERVAL_SECONDS:-300}
  WORKER_SHIFT_CANCELLATION_FOLLOWUP_INTERVAL_SECONDS: ${WORKER_SHIFT_CANCELLATION_FOLLOWUP_INTERVAL_SECONDS:-60}
  WORKER_REPLACEMENT_STAFF_INTERVAL_SECONDS: ${WORKER_REPLACEMENT_STAFF_INTERVAL_SECONDS:-120}
  WORKER_TOKEN_CLEANUP_INTERVAL_SECONDS: ${WORKER_TOKEN_CLEANUP_INTERVAL_SECONDS:-86400}
  WORKER_STORAGE_CLEANUP_INTERVAL_SECONDS: ${WORKER_STORAGE_CLEANUP_INTERVAL_SECONDS:-86400}
  WORKER_SHIFT_REPORT_SCHEDULER_INTERVAL_SECONDS: ${WORKER_SHIFT_REPORT_SCHEDULER_INTERVAL_SECONDS:-300}
  WORKER_FINAL_TIMESHEET_INTERVAL_SECONDS: ${WORKER_FINAL_TIMESHEET_INTERVAL_SECONDS:-300}
  WORKER_PAYROLL_PERIOD_ATTENTION_INTERVAL_SECONDS: ${WORKER_PAYROLL_PERIOD_ATTENTION_INTERVAL_SECONDS:-1800}
  WORKER_SCHEDULER_RECONCILE_SECONDS: ${WORKER_SCHEDULER_RECONCILE_SECONDS:-60}
  # Unset = crewflow:production:bull. Must be identical on both services.
  BULLMQ_PREFIX:
  # -- Retention and clean-up --
  OUTBOX_RETENTION_ENABLED: ${OUTBOX_RETENTION_ENABLED:-false}
  OUTBOX_RETENTION_MODE: ${OUTBOX_RETENTION_MODE:-report}
  OUTBOX_RETENTION_EMAIL_DAYS: ${OUTBOX_RETENTION_EMAIL_DAYS:-90}
  OUTBOX_RETENTION_PUSH_DAYS: ${OUTBOX_RETENTION_PUSH_DAYS:-30}
  OUTBOX_RETENTION_REALTIME_DAYS: ${OUTBOX_RETENTION_REALTIME_DAYS:-7}
  OUTBOX_RETENTION_WORKER_EVENT_DAYS: ${OUTBOX_RETENTION_WORKER_EVENT_DAYS:-30}
  OUTBOX_RETENTION_BATCH_SIZE: ${OUTBOX_RETENTION_BATCH_SIZE:-1000}
  OUTBOX_RETENTION_MAX_BATCHES_PER_SCOPE: ${OUTBOX_RETENTION_MAX_BATCHES_PER_SCOPE:-20}
  OUTBOX_RETENTION_INTERVAL_MINUTES: ${OUTBOX_RETENTION_INTERVAL_MINUTES:-60}
  LOGIN_HANDOFF_CLEANUP_ENABLED: ${LOGIN_HANDOFF_CLEANUP_ENABLED:-true}
  LOGIN_HANDOFF_CLEANUP_INTERVAL_MINUTES: ${LOGIN_HANDOFF_CLEANUP_INTERVAL_MINUTES:-15}
  # -- PDF rendering (Worker). Concurrency x 384 MB must fit the memory budget (unset = 768 MB); set them together. --
  PDF_NATIVE_CONCURRENCY:
  PDF_NATIVE_PREWARM:
  PDF_NATIVE_MEMORY_BUDGET_MB:
  # -- Attendance and invitation rules (business values; change only on an owner decision) --
  CLOCK_IN_EARLY_MINUTES: ${CLOCK_IN_EARLY_MINUTES:-15}
  QR_POST_SHIFT_GRACE_MINUTES: ${QR_POST_SHIFT_GRACE_MINUTES:-120}
  REPORT_AVAILABLE_BEFORE_MINUTES: ${REPORT_AVAILABLE_BEFORE_MINUTES:-180}
  GEOFENCE_MAX_ACCURACY_M: ${GEOFENCE_MAX_ACCURACY_M:-100}
  LOCATION_EVIDENCE_MAX_AGE_SECONDS: ${LOCATION_EVIDENCE_MAX_AGE_SECONDS:-120}
  LOCATION_EVIDENCE_MAX_FUTURE_SKEW_SECONDS: ${LOCATION_EVIDENCE_MAX_FUTURE_SKEW_SECONDS:-30}
  LATE_CLOCK_IN_GRACE_MINUTES: ${LATE_CLOCK_IN_GRACE_MINUTES:-10}
  MEMBER_INVITE_RATE_RECIPIENT_PER_DAY: ${MEMBER_INVITE_RATE_RECIPIENT_PER_DAY:-6}
  MEMBER_INVITE_RATE_ACTOR_PER_HOUR: ${MEMBER_INVITE_RATE_ACTOR_PER_HOUR:-60}
  MEMBER_INVITE_RATE_ORGANISATION_PER_DAY: ${MEMBER_INVITE_RATE_ORGANISATION_PER_DAY:-500}
  MEMBER_INVITE_RATE_REDEEM_PER_IP_PER_HOUR: ${MEMBER_INVITE_RATE_REDEEM_PER_IP_PER_HOUR:-30}
  # -- Runtime isolation report: warn (default) logs each missing control. `enforce` REFUSES to start when a platform drops
  # the H6 keys, which OpenShip does: never set enforce on OpenShip. --
  CREWFLOW_RUNTIME_ISOLATION: ${CREWFLOW_RUNTIME_ISOLATION:-warn}
  # -- AI: INERT while AI_ENABLED is pinned 'false' below (every AI route answers 404, the Worker refuses every turn) --
  ANTHROPIC_API_KEY:
  AI_AGENTS_ENABLED: ${AI_AGENTS_ENABLED:-false}
  AI_MODELS_DEFAULT_DISABLED:
  AI_MODELS_DEFAULT_FAST:
  AI_MODELS_DEFAULT_SMART:
  AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-2}
  AI_USER_DAILY_BUDGET_USD: ${AI_USER_DAILY_BUDGET_USD:-1}
  AI_ORG_DAILY_TOKEN_BUDGET: ${AI_ORG_DAILY_TOKEN_BUDGET:-200000}
  AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1500}
  AI_MAX_STEPS: ${AI_MAX_STEPS:-8}
  AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-4000}
  AI_USER_RATE_PER_MIN: ${AI_USER_RATE_PER_MIN:-10}
  AI_ORG_RATE_PER_MIN: ${AI_ORG_RATE_PER_MIN:-60}
  AI_USER_TURNS_PER_DAY: ${AI_USER_TURNS_PER_DAY:-100}
  AI_ORG_MAX_ACTIVE_TURNS: ${AI_ORG_MAX_ACTIVE_TURNS:-2}
  AI_TURN_TIMEOUT_SECONDS: ${AI_TURN_TIMEOUT_SECONDS:-90}
  AI_TITLE_GENERATION: ${AI_TITLE_GENERATION:-true}
  AI_RETENTION_DAYS: ${AI_RETENTION_DAYS:-90}
  AI_RETENTION_MODE: ${AI_RETENTION_MODE:-off}
  AI_RETENTION_INTERVAL_MINUTES: ${AI_RETENTION_INTERVAL_MINUTES:-60}
  AI_STALE_TURN_SWEEP: ${AI_STALE_TURN_SWEEP:-false}
  AI_STALE_TURN_THRESHOLD_MINUTES: ${AI_STALE_TURN_THRESHOLD_MINUTES:-15}
  AI_STALE_TURN_SWEEP_INTERVAL_MINUTES: ${AI_STALE_TURN_SWEEP_INTERVAL_MINUTES:-5}

services:

  # ---------------------------------------------------------------------------
  # db — the BUNDLED PostgreSQL (DB-SETUP, owner decisions D1 a / D3 / D4; like Twenty's `db`). The default database: the
  # client sets only PG_DATABASE_PASSWORD (its superuser password, `openssl rand -hex 32`: letters and digits only, it is
  # interpolated into the default admin URL) and APP_SECRET. Never published, on the internal crewflow-db network only.
  # TLS (D1 a): on the first start (and whenever the certificate is missing, invalid or within 30 days of expiry) the
  # entrypoint below creates its OWN CA and a server certificate for the name `db` (EC P-256, 10 years) with the image's
  # openssl; the CA's private key is deleted right after signing, so nothing can issue another certificate for `db`. The
  # server key stays in the data volume (0600, never shared); the CA certificate goes to the crewflow-db-ca volume, which
  # rab-api and rab-worker mount read-only (api-prestart.sh / worker-start.sh point PG_SSL_CA_CERT_PATH at it when the URL's
  # host is `db`): sslmode=verify-full holds with no client step. A regenerated certificate reaches the app at its next start.
  # AUTHENTICATION: the server reads the pg_hba.conf the entrypoint writes on every start (hba_file): SCRAM over the socket,
  # hostssl + SCRAM for every TCP login (a plain-TCP connection is refused), no trust, no peer (initdb also gets SCRAM for
  # the cluster's own, unused, file). Even a process inside this container needs the password (`docker compose exec -e PGPASSWORD db psql -U postgres -d crewflow`, PGPASSWORD = PG_DATABASE_PASSWORD).
  # pg_isready (the health check) does not authenticate. The image reads the superuser password ONLY when the data volume is
  # empty (first start): changing PG_DATABASE_PASSWORD later does not change it (ALTER ROLE postgres PASSWORD ... first).
  # EXTERNAL DATABASE: set PG_DATABASE_ADMIN_URL to your database's admin URL (direct host, sslmode=verify-full); the app
  # then ignores this service, which still runs idle and still needs a PG_DATABASE_PASSWORD (any strong value).
  # Image: postgres:16 (Debian, 16.15), by its multi-platform index digest. CREWFLOW_POSTGRES_IMAGE may name a Debian
  # postgres:16, :17 or :18 image by digest. VOLUME LAYOUT, the same for all three (a fresh named volume takes the ownership
  # of the image directory it is mounted on, and as uid 999 the db can only use volumes whose root it can write):
  #   crewflow-db-data -> /var/lib/postgresql (postgres-owned in every major): PGDATA=pgdata/ (fixed, so a changed major
  #                       refuses to start on the old files instead of initialising an empty cluster), the TLS key in tls/;
  #   crewflow-db-ca   -> /var/tmp (world-writable with the sticky bit in every major; nothing else uses it): ca.crt only;
  #   /var/lib/postgresql/data, the 16/17 images' default data directory and VOLUME, is an empty read-only tmpfs, so no
  #   anonymous volume is ever created there and nothing can be written to it by mistake.
  # A major upgrade is a dump/restore (or pg_upgrade) into a new volume, never a silent image change.
  # ---------------------------------------------------------------------------
  db:
    image: ${CREWFLOW_POSTGRES_IMAGE:-postgres@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # The data volume root arrives world-writable (copied from the image): only postgres may write it.
        chmod 0755 /var/lib/postgresql
        cd /var/lib/postgresql
        if ! { [ -s tls/server.key ] && [ -s tls/server.crt ] && [ -s /var/tmp/ca.crt ] &&
          openssl verify -CAfile /var/tmp/ca.crt tls/server.crt >/dev/null 2>&1 &&
          openssl x509 -checkend 2592000 -noout -in tls/server.crt >/dev/null 2>&1; }; then
          echo 'crewflow-db: creating the bundled database CA and server certificate (CN/SAN db)'
          rm -rf /var/lib/postgresql/tls.new
          ( umask 077; mkdir /var/lib/postgresql/tls.new )
          cd /var/lib/postgresql/tls.new
          openssl req -x509 -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout ca.key -out ca.crt -days 3650 -subj '/CN=crewflow bundled db CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' 2>/dev/null
          openssl req -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout server.key -out server.csr -subj '/CN=db' 2>/dev/null
          printf 'subjectAltName=DNS:db\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 3649 -extfile server.ext 2>/dev/null
          rm -f ca.key ca.srl server.csr server.ext
          chmod 0600 server.key
          chmod 0644 server.crt ca.crt
          if [ "$$(id -u)" = 0 ]; then chown -R postgres:postgres /var/lib/postgresql/tls.new; fi
          cd /var/lib/postgresql
          rm -rf /var/lib/postgresql/tls
          mv tls.new tls
          cp tls/ca.crt /var/tmp/ca.crt.new
          chmod 0644 /var/tmp/ca.crt.new
          mv /var/tmp/ca.crt.new /var/tmp/ca.crt
        fi
        # TLS-only network logins (PR #125 review, finding 5), written on every start so an existing volume gets it too:
        # SCRAM over the socket; every TCP login must be TLS (hostssl) and SCRAM; there is no plain `host` line at all.
        printf 'local all all scram-sha-256\nhostssl all all 0.0.0.0/0 scram-sha-256\nhostssl all all ::/0 scram-sha-256\n' > /var/lib/postgresql/tls/pg_hba.conf.new
        chmod 0600 /var/lib/postgresql/tls/pg_hba.conf.new
        if [ "$$(id -u)" = 0 ]; then chown postgres:postgres /var/lib/postgresql/tls/pg_hba.conf.new; fi
        mv /var/lib/postgresql/tls/pg_hba.conf.new /var/lib/postgresql/tls/pg_hba.conf
        exec docker-entrypoint.sh "$$@"
      - crewflow-db
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/var/lib/postgresql/tls/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: crewflow
      # T-2 (owner decision D4): an environment variable, like Twenty (OpenShip has no secret files).
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?PG_DATABASE_PASSWORD is required for the bundled database (openssl rand -hex 32), also with your own database}
      # SCRAM for socket and TCP logins alike: no trust (the image default for loopback TCP) and no peer.
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256 --data-checksums
      # The cluster lives in a subdirectory of the data volume, beside the server's TLS key (tls/); fixed for every major.
      PGDATA: /var/lib/postgresql/pgdata
      # psql history and the like go to the private tmpfs, never to a volume.
      HOME: /tmp
    volumes:
      - crewflow-db-data:/var/lib/postgresql
      # Holds only ca.crt: mounted read-only by rab-api and rab-worker.
      - crewflow-db-ca:/var/tmp
    networks: [crewflow-db]
    healthcheck:
      # TCP, not the socket: the image's first-start init runs a socket-only temporary server, which must not count.
      test: ["CMD-SHELL", "pg_isready -q -h localhost -p 5432 -U postgres -d crewflow"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    # SIGINT = PostgreSQL fast shutdown (checkpoint, then exit); give it time before SIGKILL.
    stop_signal: SIGINT
    stop_grace_period: 90s
    logging: *logging
    # The image's own postgres user (999:999 in the Debian image): it initialises the cluster as that user, no capability.
    user: '999:999'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=2775
      - /tmp:uid=999,gid=999,mode=0700
      # The 16/17 images' default data directory (their VOLUME): empty and read-only, never an anonymous volume.
      - /var/lib/postgresql/data:uid=999,gid=999,mode=0555,size=64k
    shm_size: 256m
    pids_limit: 256
    mem_limit: ${CREWFLOW_POSTGRES_MEM_LIMIT:-1024m}
    cpus: ${CREWFLOW_POSTGRES_CPUS:-2}

  rab-redis:
    image: redis:7-alpine
    # AOF + noeviction (an evicting policy can drop BullMQ jobs and locks). No ACL file here: a platform without a host
    # secret directory cannot mount one, so this Redis is unauthenticated and must stay unpublished (docker-compose.image.yml
    # has the ACL).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - rab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # ---------------------------------------------------------------------------
  # db-setup — the ONE-SHOT database setup (PR #125 option A, owner decision 2026-11-13). The SAME image as rab-api and
  # rab-worker; its entrypoint db-setup.sh runs only the bootstrap child (creates crewflow_owner, or resets its password to
  # the one derived from APP_SECRET; a crewflow_owner PG_DATABASE_URL is passed through with no connection), writes the
  # target file /run/crewflow/db-target/target.json on the crewflow-db-target volume, and exits. It is the ONLY service of
  # the app image that receives the database ADMIN URL (PG_DATABASE_URL: the bundled db's superuser by default, or your own
  # database's admin URL), plus APP_SECRET and the TLS CA. rab-api and rab-worker never receive it: they mount the target
  # volume read-only and build the crewflow_owner URL from it (a credential-free target + APP_SECRET; or, in pass-through,
  # the crewflow_owner URL itself). It runs again on every `docker compose up` (it removes the old target first), then
  # rab-api starts (depends_on: service_completed_successfully). No port, no health check (it exits), never restarted.
  # ---------------------------------------------------------------------------
  db-setup:
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:-sha256:b2bd3bc40131df1245f60afb435e3b3d7eb8391168620e31e779078695d4b980}
    entrypoint: ["./db-setup.sh"]
    environment:
      # The database URL of the bootstrap child, this service only: PG_DATABASE_URL (a crewflow_owner URL: pass-through,
      # nothing to do), else PG_DATABASE_ADMIN_URL (your own database's admin URL, DIRECT host, sslmode=verify-full), else
      # the bundled db's superuser built from PG_DATABASE_PASSWORD.
      PG_DATABASE_URL: ${PG_DATABASE_URL:-${PG_DATABASE_ADMIN_URL:-postgresql://postgres:${PG_DATABASE_PASSWORD:?PG_DATABASE_PASSWORD is required (the bundled db), or set PG_DATABASE_ADMIN_URL}@db:5432/crewflow?sslmode=verify-full}}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required}
      # The same TLS settings as rab-api / rab-worker (the shared optional list above).
      PG_SSL_CA_CERT_PATH:
      PG_DATABASE_URL_IS_DIRECT:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
    networks: [default, crewflow-db]
    volumes:
      - crewflow-db-ca:/run/crewflow/db-ca:ro
      # The target file (written here; read-only in rab-api and rab-worker).
      - crewflow-db-target:/run/crewflow/db-target
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    stop_grace_period: 40s

  # rab-api — the HTTP API. Migrates on start, registers the job schedulers, then serves (O3). ONE instance (C5).
  rab-api:
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:-sha256:b2bd3bc40131df1245f60afb435e3b3d7eb8391168620e31e779078695d4b980}
    # DB-SETUP PID 1 (lead decision 2026-11-12, owner requirement #5): api-prestart.sh is the ENTRYPOINT (PID 1; no command,
    # no compose init). It runs the refusals, the runtime-isolation check, builds the crewflow_owner URL from db-setup's
    # target file (option A: this service never receives the admin URL), waits (bounded, 120 s) for a working login, runs
    # the migrate child and the scheduler registration, then `exec /sbin/tini -s -- node packages/rab-server/dist/main.js`.
    # Owner CLI one-offs: `docker compose run --rm --no-deps rab-api node packages/rab-server/dist/command/main.js <command>`
    # (the script builds the same crewflow_owner URL and runs the command with it, nothing else).
    entrypoint: ["./api-prestart.sh"]
    ports:
      - "${CREWFLOW_API_BIND:-127.0.0.1}:${CREWFLOW_API_HOST_PORT:-3000}:3000"
    networks: [default, crewflow-db]
    volumes:
      # The bundled db's own CA (read-only; api-prestart.sh sets PG_SSL_CA_CERT_PATH=/run/crewflow/db-ca/ca.crt for host db).
      - crewflow-db-ca:/run/crewflow/db-ca:ro
      # db-setup's target file (read-only): the crewflow_owner URL is built from it.
      - crewflow-db-target:/run/crewflow/db-target:ro
    environment:
      # REQUIRED and OPTIONAL: the shared lists above (identical on rab-worker).
      <<: [*required-env, *optional-env]
      # OPTIONAL, rab-api only. Pool ceiling (code default 10; the Worker's 12 is pinned on rab-worker).
      PG_POOL_MAX_CONNECTIONS:
      # Seconds api-prestart.sh waits before exiting after a start-up failure (0-300).
      CREWFLOW_STARTUP_FAILURE_DELAY_SECONDS: ${CREWFLOW_STARTUP_FAILURE_DELAY_SECONDS:-15}
      # continue (code default when unset) | refuse: whether the API starts after a failed schema UPGRADE (O3 C3).
      CREWFLOW_UPGRADE_FAILURE:
      # PINNED (owner decisions; shown, not to be changed):
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      REDIS_URL: redis://rab-redis:6379
      HWS_RUNTIME_ENABLED: "false"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      CREWFLOW_MIGRATE_ON_START: "true"
      # none by default (C4); token is an opt-in (BC-11), entered as the interpolation value (docker-compose.image.yml).
      CREWFLOW_MIGRATION_APPROVAL_MODE: ${CREWFLOW_MIGRATION_APPROVAL_MODE:-none}
      # Notification delivery (owner decision 2026-11-06), identical on rab-api and rab-worker: see docker-compose.image.yml.
      # Push sweep: the owner rule (2026-11-06, Phase X J2) for the day PUSH_ENABLED is turned on, committed now on both
      # services so turning push on needs no compose change. No effect while push is off: the push-dispatch scheduler is
      # registered only with PUSH_ENABLED=true (rab-worker scheduler-plan.ts).
      WORKER_FAST_PUBLISH_NOTIFY: "true"
      WORKER_EMAIL_DISPATCH_INTERVAL_SECONDS: "30"
      WORKER_PUSH_DISPATCH_INTERVAL_SECONDS: "30"
      # Phase D switches (owner decision 2026-11-06), identical on rab-api and rab-worker: see docker-compose.image.yml.
      # Timer triggers on for all four kinds; safety sweeps offer expiry 300 s, manager confirmation 120 s, late clock-in
      # 300 s; the shift monitor keeps 300 s (not set); the combined scan stays off (WORKER_SHIFT_SCAN_MODE not set).
      WORKER_TIMER_TRIGGERS: "on"
      WORKER_TIMER_TRIGGER_KINDS: "offer-expiry,manager-confirmation,no-show,late-clock-in"
      WORKER_OFFER_EXPIRY_INTERVAL_SECONDS: "300"
      WORKER_MANAGER_CONFIRMATION_TIMEOUT_INTERVAL_SECONDS: "120"
      WORKER_LATE_CLOCK_IN_INTERVAL_SECONDS: "300"
      # Pay-statement dispatch sweep (owner decision 2026-11-11, J1a), identical on rab-api and rab-worker: 30 s (code
      # default 5 s): see docker-compose.image.yml.
      WORKER_SHIFT_STATEMENT_DISPATCH_INTERVAL_SECONDS: "30"
    depends_on:
      rab-redis:
        condition: service_healthy
      # The bundled db (idle with your own database).
      db:
        condition: service_healthy
      # Option A: db-setup (the only service with the admin URL) has created crewflow_owner and written the target file.
      # A platform that drops this condition (OpenShip: NOT VERIFIED) still cannot start the API early: api-prestart.sh
      # waits, bounded (120 s), for the target file and a working crewflow_owner login, and never takes an admin path.
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 900s
    restart: unless-stopped
    logging: *logging
    # Runtime isolation (H6). REQUIRED; a platform that drops these keys runs the API degraded (warn mode: api-prestart.sh
    # logs each missing control) — the reason this file is not the supported deployment.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${CREWFLOW_API_MEM_LIMIT:-1024m}
    cpus: ${CREWFLOW_API_CPUS:-2}
    stop_grace_period: 40s

  # rab-worker — background jobs, ONE process as uid/gid 1000 (no root launcher, no per-child credentials, in-process
  # provisioning). Never migrates, only consumes the job schedulers; starts after a healthy API and Redis.
  rab-worker:
    # O1: the SAME image variable as rab-api (one release, one digest), a different command.
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:-sha256:b2bd3bc40131df1245f60afb435e3b3d7eb8391168620e31e779078695d4b980}
    # DB-SETUP PID 1: worker-start.sh is the ENTRYPOINT (PID 1): it builds the crewflow_owner URL from db-setup's target
    # file (option A: this service never receives the admin URL), then `exec /sbin/tini -s -- node
    # packages/rab-worker/dist/main.js`. tini is PID 1 (the Worker's watchdog SIGKILL, ignored by the kernel for PID 1, still
    # works). NO compose `init: true` (compose-owner-login.cjs refuses it).
    entrypoint: ["./worker-start.sh"]
    working_dir: /app
    networks: [default, crewflow-db]
    volumes:
      - crewflow-db-ca:/run/crewflow/db-ca:ro
      - crewflow-db-target:/run/crewflow/db-target:ro
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    # Kept from the separated sizing until the H6 matrix re-measures with the native renderer (#61).
    pids_limit: 1024
    # Native PDF render threads (review M-3): PDF_NATIVE_CONCURRENCY x 384 MB heap cap must fit
    # PDF_NATIVE_MEMORY_BUDGET_MB (default 768 = half of this 1536m), else the Worker refuses to boot. Set both together.
    mem_limit: ${CREWFLOW_WORKER_MEM_LIMIT:-1536m}
    cpus: ${CREWFLOW_WORKER_CPUS:-2}
    logging: *logging
    environment:
      # REQUIRED and OPTIONAL: the shared lists above (identical on rab-api).
      <<: [*required-env, *optional-env]
      # OPTIONAL, rab-worker only. Event-loop watchdog: a loop silent this long is a stall (30-900 s).
      CREWFLOW_WORKER_WATCHDOG_STALE_SECONDS: ${CREWFLOW_WORKER_WATCHDOG_STALE_SECONDS:-120}
      # Milliseconds the Worker waits for running jobs on shutdown (keep below stop_grace_period).
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-30000}
      # PINNED (owner decisions; shown, not to be changed):
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      REDIS_URL: redis://rab-redis:6379
      HWS_RUNTIME_ENABLED: "false"
      # The owner's "feel instant" onboarding pin, read by the in-process provisioner (Agent 2 interface).
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: "5"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      PG_POOL_MAX_CONNECTIONS: "12"
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: "0"
      # Notification delivery (owner decision 2026-11-06) and the push sweep (J2): identical to rab-api.
      WORKER_FAST_PUBLISH_NOTIFY: "true"
      WORKER_EMAIL_DISPATCH_INTERVAL_SECONDS: "30"
      WORKER_PUSH_DISPATCH_INTERVAL_SECONDS: "30"
      # Phase D switches (owner decision 2026-11-06): identical to rab-api.
      WORKER_TIMER_TRIGGERS: "on"
      WORKER_TIMER_TRIGGER_KINDS: "offer-expiry,manager-confirmation,no-show,late-clock-in"
      WORKER_OFFER_EXPIRY_INTERVAL_SECONDS: "300"
      WORKER_MANAGER_CONFIRMATION_TIMEOUT_INTERVAL_SECONDS: "120"
      WORKER_LATE_CLOCK_IN_INTERVAL_SECONDS: "300"
      # Pay-statement dispatch sweep (owner decision 2026-11-11, J1a): identical to rab-api.
      WORKER_SHIFT_STATEMENT_DISPATCH_INTERVAL_SECONDS: "30"
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    healthcheck:
      test: ["CMD", "env", "CREWFLOW_PROVISIONER_ENABLED=false", "node", "/opt/crewflow-bundle/worker-bundle-health.cjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      rab-redis:
        condition: service_healthy
      # API first, Worker after (like Twenty). restart: true makes Compose stop this Worker before it replaces rab-api, so
      # an old Worker never runs beside a new API.
      rab-api:
        condition: service_healthy
        restart: true
    restart: unless-stopped

networks:
  # The bundled db's network: internal (no route out), never published; only db, db-setup, rab-api and rab-worker are on it.
  crewflow-db:
    internal: true

volumes:
  rab-redis-data:
  # The bundled db: its cluster and server TLS key; and its CA certificate (shared read-only with db-setup, rab-api and
  # rab-worker).
  crewflow-db-data:
  crewflow-db-ca:
  # db-setup's target file (option A): written by db-setup only, mounted read-only by rab-api and rab-worker.
  crewflow-db-target:
