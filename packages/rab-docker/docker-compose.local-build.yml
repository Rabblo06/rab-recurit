# LOCAL / DEV ONLY — BUILD FROM SOURCE. NEVER RUN THIS FILE ON A SERVER (owner decision 2026-11-11).
#
# Production pulls the published, gated image: docker-compose.production.yml (or docker-compose.image.yml), both on ONE
# variable, CREWFLOW_IMAGE_TAG (the release's sha256 index digest), deployed with `docker compose pull && docker compose
# up -d`. A server must never build, so it always runs an image that passed the image security gate. This file is the
# former build-based docker-compose.production.yml, kept for local reference builds of the same runtime contract (same
# services, commands, isolation keys, environment keys, start order). Where it differs from docker-compose.image.yml,
# docker-compose.image.yml wins.
#
#   docker compose -f packages/rab-docker/docker-compose.local-build.yml build
#
# ONE DATABASE CREDENTIAL. rab-api and rab-worker each take PG_DATABASE_URL = crewflow_owner at the provider's DIRECT
# host, sslmode=verify-full — the SAME value on both (entered per service on a platform without env_file).
# There is no migrator, provisioner, worker, ops or replica URL, no .env.migrate and no role password. Created by the
# provider admin with Agent 1's postgres-init/owner-login/01-crewflow-owner.sql (fresh) or transition-from-separated.sql
# (existing separated database): a URL alone never works.
#
# LIFECYCLE (O3, owner decisions C1-C5, like Twenty): no release step, no rab-migrate. The API migrates on start
# (CREWFLOW_MIGRATE_ON_START=true, approval mode none), registers the job schedulers, then serves. The Worker never
# migrates, only consumes the schedulers, and starts after a healthy API and Redis. ONE rab-api, stop-then-start (C5).
# Accepted risk: every start of a new image applies what it ships; recovery is the mandatory pre-upgrade backup
# (docs/release/OWNER-LOGIN-RECOVERY.md).
#
# ENTER FOR rab-api AND rab-worker (identical values): PG_DATABASE_URL, PG_SSL_CA_CERT_PATH (mount the CA read-only),
# PG_EXPECTED_DATABASE_NAME, OPTIONALLY CREWFLOW_DEPLOYMENT_ENVIRONMENT=production + CREWFLOW_DEPLOYMENT_ID (BC-11 opt-ins,
# the same values on both services), the connection budget
# (PG_POOL_MAX_CONNECTIONS / PG_EXPECTED_* — one login, so all pools share crewflow_owner's limit), REDIS_URL, APP_SECRET
# (+ keyrings if used; CURRENT values unchanged in a transition), CORS_ORIGINS, APP_URL, ACCOUNTS_URL (https only),
# TRUSTED_PROXY_CIDRS, EMAIL_* / RESEND_API_KEY, S3_BUCKET, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_ENDPOINT,
# SENTRY_DSN / APP_VERSION (optional), AUTH_GOOGLE_* / AUTH_MICROSOFT_* (if enabled), WORKSPACE_BASE_DOMAIN (owner decision).
# MUST NOT BE ENTERED ANYWHERE: DATABASE_URL, DATABASE_URL_UNPOOLED, DATABASE_DIRECT_URL, DB_POOL_MAX, PG_WORKER_DATABASE_URL,
# CREWFLOW_PROVISIONER_DATABASE_URL, CREWFLOW_MIGRATION_DATABASE_URL, PG_DATABASE_REPLICA_*, PG_OPS_APP_DATABASE_URL,
# CREWFLOW_*_BOOTSTRAP_PASSWORD, CREWFLOW_MIGRATOR_PASSWORD, CREWFLOW_MIGRATION_PHASE, CREWFLOW_DEPLOYMENT_IDENTITY_BOOTSTRAP,
# ALLOW_PRODUCTION_DB_COMMANDS, DB_TARGET, CREWFLOW_DB_MODE, CREWFLOW_PROVISIONER_ENABLED, libpq PG* variables, NODE_OPTIONS,
# BOOTSTRAP_ADMIN_*, TEST_*, ALLOW_REMOTE_TEST_DATABASE, AUTH_*_ISSUER_URL, WORKER_CLAIM_MODE, WORKER_DISPATCH_MODE,
# WORKER_INVITE_AUTO_DELETE_ENABLED, WORKSPACE_SUBDOMAIN_ORIGIN_TRUST_ENABLED, CREWFLOW_MIGRATION_APPROVED,
# CREWFLOW_UPGRADE_INCOMPLETE (set only by api-prestart.sh), WORKER_SCHEDULER=interval; and any override of the keys
# committed below.
#
# SECURITY POSTURE: PT-01 (runbook section 1, THREAT-MODEL.md). SUPERSEDED, KEPT UNTIL THE FINAL CLEAN-UP PR (#9, owner
# approval): rab-ops (profile "ops"). O1: the Worker bundle launcher and its separate Dockerfile are gone; the API and
# the Worker build the SAME image (rab/Dockerfile) and differ only by command.

name: rab-local-build

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:

  rab-redis:
    image: redis:7-alpine
    # AOF + noeviction (an evicting policy can drop BullMQ jobs and locks). No ACL file here: a platform without a host
    # secret directory cannot mount one, so this Redis is unauthenticated and must stay unpublished (docker-compose.image.yml
    # has the ACL).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - rab-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  # rab-api — the HTTP API. Migrates on start, registers the job schedulers, then serves (O3). ONE instance (C5).
  rab-api:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    command: ["./api-prestart.sh"]
    ports:
      - "${CREWFLOW_API_BIND:-127.0.0.1}:${CREWFLOW_API_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      REDIS_URL: redis://rab-redis:6379
      HWS_RUNTIME_ENABLED: "false"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      CREWFLOW_MIGRATE_ON_START: "true"
      # none by default (C4); token is an opt-in (BC-11), entered as the interpolation value (docker-compose.image.yml).
      CREWFLOW_MIGRATION_APPROVAL_MODE: ${CREWFLOW_MIGRATION_APPROVAL_MODE:-none}
      # Notification delivery (owner decision 2026-11-06), identical on rab-api and rab-worker: see docker-compose.image.yml.
      # When PUSH_ENABLED is turned on, also set WORKER_PUSH_DISPATCH_INTERVAL_SECONDS: "30" on both (owner rule).
      WORKER_FAST_PUBLISH_NOTIFY: "true"
      WORKER_EMAIL_DISPATCH_INTERVAL_SECONDS: "30"
      # Phase D switches (owner decision 2026-11-06), identical on rab-api and rab-worker: see docker-compose.image.yml.
      # Timer triggers on for all four kinds; safety sweeps offer expiry 300 s, manager confirmation 120 s, late clock-in
      # 300 s; the shift monitor keeps 300 s (not set); the combined scan stays off (WORKER_SHIFT_SCAN_MODE not set).
      WORKER_TIMER_TRIGGERS: "on"
      WORKER_TIMER_TRIGGER_KINDS: "offer-expiry,manager-confirmation,no-show,late-clock-in"
      WORKER_OFFER_EXPIRY_INTERVAL_SECONDS: "300"
      WORKER_MANAGER_CONFIRMATION_TIMEOUT_INTERVAL_SECONDS: "120"
      WORKER_LATE_CLOCK_IN_INTERVAL_SECONDS: "300"
    depends_on:
      rab-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 900s
    restart: unless-stopped
    logging: *logging
    # Runtime isolation (H6). REQUIRED; a platform that drops these keys runs the API degraded (warn mode: api-prestart.sh
    # logs each missing control) — the reason this file is not the supported deployment.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${CREWFLOW_API_MEM_LIMIT:-1024m}
    cpus: ${CREWFLOW_API_CPUS:-2}
    stop_grace_period: 40s

  # rab-worker — background jobs, ONE process as uid/gid 1000 (no root launcher, no per-child credentials, in-process
  # provisioning). Never migrates, only consumes the job schedulers; starts after a healthy API and Redis.
  rab-worker:
    # O1: the same image as rab-api (rab/Dockerfile, its last stage `rab`), a different command.
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    command: ["node", "packages/rab-worker/dist/main.js"]
    working_dir: /app
    # Docker's init (tini) as PID 1: the Worker's watchdog SIGKILLs a stalled event loop, which the kernel ignores for PID 1,
    # so the Worker refuses to start as PID 1. Required (compose-owner-login.cjs).
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    # Kept from the separated sizing until the H6 matrix re-measures with the native renderer (#61).
    pids_limit: 1024
    # Native PDF render threads (review M-3): PDF_NATIVE_CONCURRENCY x 384 MB heap cap must fit
    # PDF_NATIVE_MEMORY_BUDGET_MB (default 768 = half of this 1536m), else the Worker refuses to boot. Set both together.
    mem_limit: ${CREWFLOW_WORKER_MEM_LIMIT:-1536m}
    cpus: ${CREWFLOW_WORKER_CPUS:-2}
    logging: *logging
    environment:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      REDIS_URL: redis://rab-redis:6379
      HWS_RUNTIME_ENABLED: "false"
      # The owner's "feel instant" onboarding pin, read by the in-process provisioner (Agent 2 interface).
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: "5"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      PG_POOL_MAX_CONNECTIONS: "12"
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: "0"
      # Notification delivery (owner decision 2026-11-06): identical to rab-api.
      WORKER_FAST_PUBLISH_NOTIFY: "true"
      WORKER_EMAIL_DISPATCH_INTERVAL_SECONDS: "30"
      # Phase D switches (owner decision 2026-11-06): identical to rab-api.
      WORKER_TIMER_TRIGGERS: "on"
      WORKER_TIMER_TRIGGER_KINDS: "offer-expiry,manager-confirmation,no-show,late-clock-in"
      WORKER_OFFER_EXPIRY_INTERVAL_SECONDS: "300"
      WORKER_MANAGER_CONFIRMATION_TIMEOUT_INTERVAL_SECONDS: "120"
      WORKER_LATE_CLOCK_IN_INTERVAL_SECONDS: "300"
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    healthcheck:
      test: ["CMD", "env", "CREWFLOW_PROVISIONER_ENABLED=false", "node", "/opt/crewflow-bundle/worker-bundle-health.cjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      rab-redis:
        condition: service_healthy
      # API first, Worker after; restart: true stops this Worker before Compose replaces rab-api.
      rab-api:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  # rab-ops — SUPERSEDED (separated mode), kept unchanged and never started by `up` until the final clean-up PR (#9, owner
  # approval). Do not run it against an owner-login deployment.
  rab-ops:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    profiles: ["ops"]
    env_file:
      - .env.ops
    environment:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      DB_TARGET: production
      AI_ENABLED: 'false'
      HWS_RUNTIME_ENABLED: "false"
    entrypoint: ["node", "packages/rab-server/dist/command/main.js"]
    command: ["--help"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp

volumes:
  rab-redis-data:
