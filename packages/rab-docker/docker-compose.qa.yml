name: rab-qa

# Isolated manual-QA stack on production's database setup (OWNER-DB-ULTIMATE.md Part F2, X2.3; Part A = PR #125, the
# Twenty Helm model, twentyhq/twenty@eedb0a73 packages/twenty-docker/helm/twenty/templates/deployment-server.yaml:81-130,
# secret-db-url.yaml:3-30, deployment-worker.yaml:76-90). A separate Compose project with its own containers, named volumes
# and loopback-only host ports. It shares nothing at runtime with the dev stack (docker-compose.yml, project `rab`) and
# never touches Neon, OpenShip, rab-devdb or any remote database.
#
# TOPOLOGY: mirrors docker-compose.production.yml, built from source:
#   - db: the bundled PostgreSQL, a VERBATIM copy of production's `db` (own CA, TLS-only SCRAM logins, non-root, internal
#     network only, never published). compose-credential-isolation.cjs fails if the two renders ever differ.
#   - db-setup: the one-shot setup (./db-setup.sh). The ONLY service with a database URL, the bundled db's superuser,
#     PINNED (QA has no external-database mode). It creates crewflow_owner with a random password stored in the
#     crewflow-db-target volume and reused on every later start, and writes the credential-free target.json.
#   - server (rab-api): ./api-prestart.sh (PID 1) builds the crewflow_owner URL from db-setup's two files (read-only),
#     migrates on start under the migration lock (approval mode none), registers the BullMQ job schedulers, then serves.
#   - worker (rab-worker): ./worker-start.sh (PID 1), the same URL; never migrates, only consumes the schedulers, starts
#     after a healthy server, provisions workspaces in-process at production's pinned 5 s.
#   - Redis (AOF + noeviction), and object storage through the S3 driver (MinIO stands in for R2, SSE header NONE as on
#     R2). There is no shared volume between api and worker, as in production.
#   - HWS runtime routing OFF (HWS_RUNTIME_ENABLED=false on api and worker), as in production until the cutover. The dev
#     stack runs HWS on; QA deliberately does not, so it tests what production runs.
#
# KNOWN DIFFERENCES FROM PRODUCTION (unavoidable):
#   - NODE_ENV/RAB_RUNTIME_ENV = development. NODE_ENV=production needs https URLs, TRUSTED_PROXY_CIDRS, real email and a
#     deployment identity, which a local QA stack does not have. `development` refuses any non-local database host. Email
#     uses the LOGGER driver.
#   - Built from source (production pulls the gated image by digest).
#
# SECRETS: none are committed. Put these in packages/rab-docker/.env.qa.local (git-ignored by `.env.*.local`); letters and
# digits only, for example `openssl rand -hex 32`:
#   PG_DATABASE_PASSWORD   the bundled db's superuser (read by `db` on its volume's first start, and by db-setup's URL only)
#   QA_APP_SECRET          QA-only application secret (32+ characters)
# Both are required (`:?`), so the stack fails closed without them. Passing `--env-file` also stops Compose from reading the
# dev stack's packages/rab-docker/.env.
#
# RUN (C is shorthand for the compose prefix). The server applies the whole migration chain on its first start:
#   C="docker compose --env-file packages/rab-docker/.env.qa.local -f packages/rab-docker/docker-compose.qa.yml"
#   $C up -d --build
# First platform admin, once the server is healthy:
#   $C run --rm --no-deps -e DB_TARGET=local -e BOOTSTRAP_ADMIN_EMAIL=you@example.test server \
#     node packages/rab-server/dist/command/main.js bootstrap-admin
# psql: `$C exec -e PGPASSWORD db psql -U postgres -d crewflow` (PGPASSWORD = PG_DATABASE_PASSWORD).
# Reset: `$C down -v` (QA data is disposable; this never touches dev volumes).
#
# PORTS (loopback only): server 3101, front 5174, MinIO 9010/9011. The database and Redis are not published.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  # ---------------------------------------------------------------------------
  # db — VERBATIM copy of docker-compose.production.yml's `db` (the comments there explain every line). Change it there
  # first, then copy it here and to docker-compose.yml: compose-credential-isolation.cjs compares the rendered services.
  # ---------------------------------------------------------------------------
  db:
    image: ${CREWFLOW_POSTGRES_IMAGE:-postgres@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # The data volume root arrives world-writable (copied from the image): only postgres may write it.
        chmod 0755 /var/lib/postgresql
        cd /var/lib/postgresql
        if ! { [ -s tls/server.key ] && [ -s tls/server.crt ] && [ -s /var/tmp/ca.crt ] &&
          openssl verify -CAfile /var/tmp/ca.crt tls/server.crt >/dev/null 2>&1 &&
          openssl x509 -checkend 2592000 -noout -in tls/server.crt >/dev/null 2>&1; }; then
          echo 'crewflow-db: creating the bundled database CA and server certificate (CN/SAN db)'
          rm -rf /var/lib/postgresql/tls.new
          ( umask 077; mkdir /var/lib/postgresql/tls.new )
          cd /var/lib/postgresql/tls.new
          openssl req -x509 -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout ca.key -out ca.crt -days 3650 -subj '/CN=crewflow bundled db CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' 2>/dev/null
          openssl req -new -nodes -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -keyout server.key -out server.csr -subj '/CN=db' 2>/dev/null
          printf 'subjectAltName=DNS:db\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=serverAuth\n' > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 3649 -extfile server.ext 2>/dev/null
          rm -f ca.key ca.srl server.csr server.ext
          chmod 0600 server.key
          chmod 0644 server.crt ca.crt
          if [ "$(id -u)" = 0 ]; then chown -R postgres:postgres /var/lib/postgresql/tls.new; fi
          cd /var/lib/postgresql
          rm -rf /var/lib/postgresql/tls
          mv tls.new tls
          cp tls/ca.crt /var/tmp/ca.crt.new
          chmod 0644 /var/tmp/ca.crt.new
          mv /var/tmp/ca.crt.new /var/tmp/ca.crt
        fi
        # TLS-only network logins (PR #125 review, finding 5), written on every start so an existing volume gets it too:
        # SCRAM over the socket; every TCP login must be TLS (hostssl) and SCRAM; there is no plain `host` line at all.
        printf 'local all all scram-sha-256\nhostssl all all 0.0.0.0/0 scram-sha-256\nhostssl all all ::/0 scram-sha-256\n' > /var/lib/postgresql/tls/pg_hba.conf.new
        chmod 0600 /var/lib/postgresql/tls/pg_hba.conf.new
        if [ "$(id -u)" = 0 ]; then chown postgres:postgres /var/lib/postgresql/tls/pg_hba.conf.new; fi
        mv /var/lib/postgresql/tls/pg_hba.conf.new /var/lib/postgresql/tls/pg_hba.conf
        exec docker-entrypoint.sh "$@"
      - crewflow-db
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/var/lib/postgresql/tls/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: crewflow
      # T-2 (owner decision D4): an environment variable, like Twenty (OpenShip has no secret files).
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?PG_DATABASE_PASSWORD is required for the bundled database (openssl rand -hex 32), also with your own database}
      # SCRAM for socket and TCP logins alike: no trust (the image default for loopback TCP) and no peer.
      POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256 --data-checksums
      # The cluster lives in a subdirectory of the data volume, beside the server's TLS key (tls/); fixed for every major.
      PGDATA: /var/lib/postgresql/pgdata
      # psql history and the like go to the private tmpfs, never to a volume.
      HOME: /tmp
    volumes:
      - crewflow-db-data:/var/lib/postgresql
      # Holds only ca.crt: mounted read-only by rab-api and rab-worker.
      - crewflow-db-ca:/var/tmp
    networks: [crewflow-db]
    healthcheck:
      # TCP, not the socket: the image's first-start init runs a socket-only temporary server, which must not count.
      test: ["CMD-SHELL", "pg_isready -q -h localhost -p 5432 -U postgres -d crewflow"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    # SIGINT = PostgreSQL fast shutdown (checkpoint, then exit); give it time before SIGKILL.
    stop_signal: SIGINT
    stop_grace_period: 90s
    logging: *logging
    # The image's own postgres user (999:999 in the Debian image): it initialises the cluster as that user, no capability.
    user: '999:999'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=2775
      - /tmp:uid=999,gid=999,mode=0700
      # The 16/17 images' default data directory (their VOLUME): empty and read-only, never an anonymous volume.
      - /var/lib/postgresql/data:uid=999,gid=999,mode=0555,size=64k
    shm_size: 256m
    pids_limit: 256
    mem_limit: ${CREWFLOW_POSTGRES_MEM_LIMIT:-1024m}
    cpus: ${CREWFLOW_POSTGRES_CPUS:-2}

  # No host port, as in production: only server/worker reach it on the compose network. AOF + noeviction, as in production
  # (BullMQ keeps its job schedulers here; the Worker refuses to boot under an evicting policy).
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - crewflow-qa-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stand-in for Cloudflare R2. The throwaway credentials are reachable on loopback only. The bucket is private,
  # versioned and encrypted by default at the bucket level, so, as on R2, the application sends no SSE headers.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rab_qa_minio_dev
      MINIO_ROOT_PASSWORD: rab_qa_minio_dev_only_secret
      MINIO_KMS_SECRET_KEY: 'rab-qa-dev-key:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
    ports:
      - '127.0.0.1:9010:9000'
      - '127.0.0.1:9011:9001'
    volumes:
      - crewflow-qa-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localqa http://minio:9000 rab_qa_minio_dev rab_qa_minio_dev_only_secret &&
      mc mb --ignore-existing localqa/rab-qa &&
      mc anonymous set none localqa/rab-qa &&
      mc version enable localqa/rab-qa &&
      mc encrypt set sse-s3 localqa/rab-qa &&
      echo bucket-ready"

  # ---------------------------------------------------------------------------
  # db-setup — the one-shot database setup (Part A), as production's `db-setup`, built from source. The ONLY service with a
  # database URL, PINNED to the bundled db. Runs on every `up`, then exits; server starts only after it completed.
  # ---------------------------------------------------------------------------
  db-setup:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    entrypoint: ['./db-setup.sh']
    environment:
      PG_DATABASE_URL: postgresql://postgres:${PG_DATABASE_PASSWORD:?set PG_DATABASE_PASSWORD (see the header of docker-compose.qa.yml)}@db:5432/crewflow?sslmode=verify-full
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
    networks: [default, crewflow-db]
    volumes:
      - crewflow-db-ca:/run/crewflow/db-ca:ro
      - crewflow-db-target:/run/crewflow/db-target
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    logging: *logging
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 256m
    stop_grace_period: 40s

  # rab-api equivalent: migrates on start, registers the job schedulers, then serves. It holds no database URL (pinned
  # empty; api-prestart.sh refuses any value) and no migration or command authority.
  server:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    entrypoint: ['./api-prestart.sh']
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      PG_DATABASE_URL: ''
      PG_EXPECTED_DATABASE_NAME: crewflow
      CREWFLOW_MIGRATE_ON_START: 'true'
      CREWFLOW_MIGRATION_APPROVAL_MODE: none
      # The server registers the BullMQ job schedulers; the worker only consumes them (same value on both).
      WORKER_SCHEDULER: bullmq
      # Phase D (E-1): same value as the worker; event = this API's sessions NOTIFY the Worker. Default poll = no NOTIFY.
      WORKER_DISPATCH_MODE: ${WORKER_DISPATCH_MODE:-poll}
      WORKER_CLAIM_MODE: ${WORKER_CLAIM_MODE:-per_scope}
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${QA_APP_SECRET:?set QA_APP_SECRET (see the header of docker-compose.qa.yml)}
      # OFF until the production cutover (see header). Explicit so a QA run can never silently differ from production.
      HWS_RUNTIME_ENABLED: 'false'
      EMAIL_DRIVER: LOGGER
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      # Same loopback alias as the front's VITE_API_URL, so the SameSite session cookie survives a reload.
      APP_URL: http://127.0.0.1:5174
      ACCOUNTS_URL: http://127.0.0.1:5174
      # TRUSTED_PROXY_CIDRS is unset: no reverse proxy sits in front of QA, so X-Forwarded-For is never trusted.
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: qa
      S3_BUCKET: rab-qa
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_qa_minio_dev
      S3_SECRET_ACCESS_KEY: rab_qa_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: NONE
    volumes:
      - crewflow-db-ca:/run/crewflow/db-ca:ro
      - crewflow-db-target:/run/crewflow/db-target:ro
    networks: [default, crewflow-db]
    ports:
      - '127.0.0.1:3101:3000'
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 15
      # A fresh install applies the whole chain before main.js listens.
      start_period: 600s
    restart: unless-stopped
    # Production's rab-api isolation (H6).
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 256
    mem_limit: 1024m
    stop_grace_period: 40s

  # rab-worker equivalent (O1, one image): the SAME image as `server`, with the production rab-worker's entrypoint and
  # security settings: worker-start.sh is PID 1 (no command, no compose init) and execs `/sbin/tini -s -- node
  # packages/rab-worker/dist/main.js` after building the crewflow_owner URL; ONE process as uid/gid 1000, workspace
  # provisioning in-process.
  worker:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    entrypoint: ['./worker-start.sh']
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      PG_DATABASE_URL: ''
      PG_EXPECTED_DATABASE_NAME: crewflow
      # Phase B (B5): the Worker runtime pool size, as in production.
      PG_POOL_MAX_CONNECTIONS: '12'
      # Never migrates, only consumes the schedulers the server registered, does not wait for the schema itself.
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: '0'
      WORKER_SCHEDULER: bullmq
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${QA_APP_SECRET:?set QA_APP_SECRET}
      HWS_RUNTIME_ENABLED: 'false'
      # In-process provisioning, the same pinned 5 s as production (the code default is 60 s), so QA tests what production
      # runs.
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: '5'
      # Phase D (D1/D2): per_scope / poll (the code defaults) unless a QA run deliberately sets them; event needs global.
      WORKER_CLAIM_MODE: ${WORKER_CLAIM_MODE:-per_scope}
      WORKER_DISPATCH_MODE: ${WORKER_DISPATCH_MODE:-poll}
      EMAIL_DRIVER: LOGGER
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      APP_URL: http://127.0.0.1:5174
      ACCOUNTS_URL: http://127.0.0.1:5174
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: qa
      S3_BUCKET: rab-qa
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_qa_minio_dev
      S3_SECRET_ACCESS_KEY: rab_qa_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: NONE
      # What the retired launcher gave its jobs child (H1-M1), as in production.
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    volumes:
      - crewflow-db-ca:/run/crewflow/db-ca:ro
      - crewflow-db-target:/run/crewflow/db-target:ro
    networks: [default, crewflow-db]
    healthcheck:
      # Jobs-only per-instance health (the provisioner role is off for this check only), as in production.
      test: ['CMD', 'env', 'CREWFLOW_PROVISIONER_ENABLED=false', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      redis:
        condition: service_healthy
      # API first, Worker after (like Twenty). restart: true makes Compose stop this Worker before it replaces the server.
      server:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  front:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../..:/app
      - rab-qa-front-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://127.0.0.1:3101/rest/v1
    command: sh -c "corepack enable && yarn install --immutable && cd packages/rab-front && npx vite --port 5173 --host 0.0.0.0"
    ports:
      - '127.0.0.1:5174:5173'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173/']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

networks:
  # The bundled db's network, as in production: internal (no route out), never published.
  crewflow-db:
    internal: true

volumes:
  # The bundled db (cluster + server TLS key; CA) and db-setup's target + password files: same keys as production, new
  # project-scoped names (rab-qa_crewflow-db-*). The previous QA volumes (rab-qa-postgres-data, rab-qa-redis-data,
  # rab-qa-minio-data) are no longer named.
  crewflow-db-data:
  crewflow-db-ca:
  crewflow-db-target:
  crewflow-qa-redis-data:
  crewflow-qa-minio-data:
  rab-qa-front-node-modules:
