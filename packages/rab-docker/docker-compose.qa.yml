name: rab-qa

# Isolated manual-QA stack. It is a separate Compose project with its own containers, named volumes and loopback-only
# host ports. It shares nothing at runtime with the dev stack (docker-compose.yml, project `rab`, rab_devdb_data) and
# never touches Neon, OpenShip or any remote database.
#
# TOPOLOGY: mirrors the INTENDED PRODUCTION topology (docker-compose.production.yml), not the dev stack:
#   - rab-api  (`server`): main.js only, restricted `crewflow_app` login, no migration or provisioning credential.
#   - rab-worker (`worker`): the four-core-service Worker bundle with the same image recipe and security settings as
#     production. The jobs child (uid 1000) runs as `crewflow_app` (PG_DATABASE_URL, direct). The provisioner child
#     (uid 10001) runs as `crewflow` (CREWFLOW_PROVISIONER_DATABASE_URL), which the launcher hands to that child only, as
#     its PG_DATABASE_URL.
#   - Redis, plus object storage through the S3 driver (MinIO stands in for R2, with SSE header NONE as on R2). There is
#     no shared volume between api and worker, as in production.
#   - Migrations ONLY through the one-off `migrate` step (deploy-prepare.js), which server and worker depend on
#     (service_completed_successfully), as production rab-migrate. It applies only with
#     CREWFLOW_MIGRATION_APPROVED=<the token its check run printed for the exact pending set> (final review F5);
#     otherwise it checks (exit 0 nothing pending, 3 pending + the list and the token).
#   - HWS runtime routing OFF (HWS_RUNTIME_ENABLED=false on api and jobs), as in production until gate G4. The dev
#     stack runs HWS on; QA deliberately does not, so it tests what production will run.
#
# KNOWN DIFFERENCES FROM PRODUCTION (unavoidable; see WAVE1_LANE_D_REPORT.md):
#   - NODE_ENV/RAB_RUNTIME_ENV = development. NODE_ENV=production needs TLS verify-full and a database bound to the
#     production deployment identity, which a local QA database is not. `development` is the strictest non-production mode: it refuses
#     any non-local database host. Production config refusals (https URLs, TRUSTED_PROXY_CIDRS, real email) are
#     therefore not exercised here, and email uses the LOGGER driver.
#   - Migrations run with DB_TARGET=local, which the N1 production approval list does not restrict. QA therefore
#     applies every migration on the branch, including 1786719500000 (server-path `core.provision_workspace`, G1).
#     Production does not have G1 (not on the N1 list). In QA the API provisions new workspaces itself, and the worker's
#     provisioner child remains the fallback and the path for `createFor` workspaces.
#   - The database is a local postgres:16-alpine with a superuser. Neon has none, so the production phase-B identity
#     (neondb_owner) is not reproduced.
#
# SECRETS: none are committed. Put these four variables in packages/rab-docker/.env.qa.local, which is git-ignored by
# `.env.*.local`. Use letters and digits only, for example `openssl rand -hex 32`, because the role-creating migrations
# reject other characters:
#   QA_POSTGRES_SUPERUSER_PASSWORD   the `rab` superuser (initdb only; phase-B migration identity)
#   QA_CREWFLOW_PASSWORD             becomes `crewflow`'s password (migration 1786682000000), provisioner child login
#   QA_CREWFLOW_APP_PASSWORD         becomes `crewflow_app`'s password (migration 1786687000000), api + jobs login
#   QA_APP_SECRET                    QA-only application secret (32+ characters)
# The variables are required (`:?`), so the stack fails closed without them. Passing `--env-file` also stops Compose
# from reading the dev stack's packages/rab-docker/.env.
#
# FIRST RUN (fresh volume). C is shorthand for the compose prefix:
#   C="docker compose --env-file packages/rab-docker/.env.qa.local -f packages/rab-docker/docker-compose.qa.yml"
#   $C up -d postgres redis minio minio-init
#   $C build server migrate
#   # Each phase below: run it once WITHOUT CREWFLOW_MIGRATION_APPROVED first (exit 3: it lists the pending migrations
#   # and prints "approval token for exactly this set: pending-<count>-<sha256>"), then again with that token. The token
#   # names one pending set, so phase B (after phase A applied part of it) needs its own check run and token.
#   # Phase A: the pre-split owner `rab_owner` (dev-only password from postgres-init/01-roles.sql). Phase A is expected
#   # to stop with exit 1 at CrewflowSingleCredentialRoleArchitecture1786682000000 (no bootstrap password in phase A).
#   CREWFLOW_MIGRATION_APPROVED=<phase A token> CREWFLOW_MIGRATION_PHASE=A \
#   CREWFLOW_MIGRATION_DATABASE_URL='postgres://rab_owner:<dev-only password>@postgres:5432/rab_manual_qa' \
#     $C run --rm migrate
#   # Phase B: the bootstrap superuser `rab`. This creates crewflow/crewflow_app with the QA_* passwords above.
#   CREWFLOW_MIGRATION_APPROVED=<phase B token> CREWFLOW_MIGRATION_PHASE=B \
#   CREWFLOW_MIGRATION_DATABASE_URL='postgres://rab:<QA_POSTGRES_SUPERUSER_PASSWORD>@postgres:5432/rab_manual_qa' \
#     $C run --rm migrate
#   # Every later `up` runs the migrate step first in check mode, so it needs the migration login again (shell, as above,
#   # or packages/rab-docker/.env.migrate): CREWFLOW_MIGRATION_DATABASE_URL='postgres://rab:...@postgres:5432/rab_manual_qa'
#   $C up -d server worker front
# Later migrations: phase B again. Reset: `$C down -v` (QA data is disposable; this never touches dev volumes).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: ${QA_POSTGRES_SUPERUSER_PASSWORD:?set QA_POSTGRES_SUPERUSER_PASSWORD (see the header of docker-compose.qa.yml)}
      POSTGRES_DB: rab_manual_qa
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - rab-qa-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab_manual_qa']
      interval: 5s
      timeout: 5s
      retries: 10

  # No host port, as in production: only server/worker reach it on the compose network.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - rab-qa-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stand-in for Cloudflare R2. The throwaway credentials are reachable on loopback only. The bucket is private,
  # versioned and encrypted by default at the bucket level, so, as on R2, the application sends no SSE headers.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rab_qa_minio_dev
      MINIO_ROOT_PASSWORD: rab_qa_minio_dev_only_secret
      MINIO_KMS_SECRET_KEY: 'rab-qa-dev-key:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
    ports:
      - '127.0.0.1:9010:9000'
      - '127.0.0.1:9011:9001'
    volumes:
      - rab-qa-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localqa http://minio:9000 rab_qa_minio_dev rab_qa_minio_dev_only_secret &&
      mc mb --ignore-existing localqa/rab-qa &&
      mc anonymous set none localqa/rab-qa &&
      mc version enable localqa/rab-qa &&
      mc encrypt set sse-s3 localqa/rab-qa &&
      echo bucket-ready"

  # rab-api equivalent. Runtime only: it never migrates, never bootstraps an admin, and holds no privileged credential.
  # DATABASE_URL, DATABASE_URL_UNPOOLED, DATABASE_DIRECT_URL, DB_TARGET and CREWFLOW_* are deliberately absent, as on production
  # rab-api. The runtime guard refuses DATABASE_URL_UNPOOLED and CREWFLOW_* if they are present. assert-runtime-db-role
  # refuses any login other than crewflow_app. An existing QA volume that predates crewflow_app (old `crewflow` URL)
  # fails to boot by design: reset it with `down -v`, then rerun both migration phases.
  server:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    image: rab-qa-server
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      PG_DATABASE_URL: postgres://crewflow_app:${QA_CREWFLOW_APP_PASSWORD:?set QA_CREWFLOW_APP_PASSWORD (see the header of docker-compose.qa.yml)}@postgres:5432/rab_manual_qa
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${QA_APP_SECRET:?set QA_APP_SECRET (see the header of docker-compose.qa.yml)}
      # OFF until production gate G4 (see header). Explicit so a QA run can never silently differ from production.
      HWS_RUNTIME_ENABLED: 'false'
      EMAIL_DRIVER: LOGGER
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      # Same loopback alias as the front's VITE_API_URL, so the SameSite session cookie survives a reload.
      APP_URL: http://127.0.0.1:5174
      ACCOUNTS_URL: http://127.0.0.1:5174
      # TRUSTED_PROXY_CIDRS is unset: no reverse proxy sits in front of QA, so X-Forwarded-For is never trusted.
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: qa
      S3_BUCKET: rab-qa
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_qa_minio_dev
      S3_SECRET_ACCESS_KEY: rab_qa_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: NONE
    command: node packages/rab-server/dist/main.js
    ports:
      - '127.0.0.1:3101:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # rab-worker equivalent: the Worker bundle, identical in recipe and security settings to production rab-worker.
  # The launcher refuses to start if DATABASE_URL_UNPOOLED, CREWFLOW_MIGRATION_*, CREWFLOW_*_BOOTSTRAP_PASSWORD or
  # ALLOW_PRODUCTION_DB_COMMANDS is non-empty, if PG_DATABASE_URL does not log in as crewflow_app, or if
  # CREWFLOW_PROVISIONER_DATABASE_URL does not log in as crewflow. PG_DATABASE_URL is a direct connection (it is also the
  # session-lock connection), as in production.
  worker:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile.worker-bundle
      additional_contexts:
        crewflow-app: service:server
      args:
        CREWFLOW_BASE_IMAGE: crewflow-app
    image: rab-qa-worker
    command: ['node', '/opt/crewflow-bundle/start-worker-bundle.cjs']
    user: '0:0'
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /tmp/crewflow-provisioner:uid=10001,gid=10001,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
      - /run/crewflow-health/provisioner:uid=10001,gid=10001,mode=0755
    stop_grace_period: 55s
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      PG_DATABASE_URL: postgres://crewflow_app:${QA_CREWFLOW_APP_PASSWORD:?set QA_CREWFLOW_APP_PASSWORD}@postgres:5432/rab_manual_qa
      # Phase B (B5): the Worker runtime pool size, as in production.
      PG_POOL_MAX_CONNECTIONS: '12'
      # Read only by the launcher. It is handed to the provisioner child alone, as that child's PG_DATABASE_URL.
      CREWFLOW_PROVISIONER_DATABASE_URL: postgres://crewflow:${QA_CREWFLOW_PASSWORD:?set QA_CREWFLOW_PASSWORD (see the header of docker-compose.qa.yml)}@postgres:5432/rab_manual_qa
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${QA_APP_SECRET:?set QA_APP_SECRET}
      # Forwarded unchanged to both children (Phase A: the launcher no longer forces it on for the provisioner child).
      HWS_RUNTIME_ENABLED: 'false'
      # Phase A (pa-provisioner): the provisioner switch. QA keeps the provisioner, as production does: it is the fallback
      # and the only path for `createFor` workspaces (see the header). Unset = the pre-Phase-A behaviour (on, 5 s); "false"
      # makes the launcher refuse to start while CREWFLOW_PROVISIONER_DATABASE_URL is set.
      CREWFLOW_PROVISIONER_ENABLED: 'true'
      # Same pinned 5 s as production (pre-Phase-A cadence; the code default is now 60 s), so QA tests what production runs.
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: '5'
      # Lane A (BullMQ migration): historical per-replica timers unless a QA run deliberately sets WORKER_SCHEDULER=bullmq.
      WORKER_SCHEDULER: ${WORKER_SCHEDULER:-interval}
      EMAIL_DRIVER: LOGGER
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      APP_URL: http://127.0.0.1:5174
      ACCOUNTS_URL: http://127.0.0.1:5174
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: qa
      S3_BUCKET: rab-qa
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_qa_minio_dev
      S3_SECRET_ACCESS_KEY: rab_qa_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: NONE
    healthcheck:
      test: ['CMD', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      server:
        condition: service_healthy
    restart: unless-stopped

  # Migrations (Phase B P7): the one-off `migrate` step (deploy-prepare.js), run to completion before server and worker.
  # It applies only with CREWFLOW_MIGRATION_APPROVED=<token of the exact pending set> (final review F5); otherwise it
  # checks: exit 0 nothing pending, exit 3 pending (the stack does not start; the log prints the list and the token), exit
  # 1 refused (a stale, mismatched or malformed approval, or the retired apply-pending-migrations, included). It is the only service that ever holds a migration
  # identity: PG_DATABASE_URL from packages/rab-docker/.env.migrate, or CREWFLOW_MIGRATION_DATABASE_URL from the
  # operator's shell for one run. The runner enforces the rest: DB_TARGET=local refuses a non-local host, the deployment
  # identity marker, CREWFLOW_MIGRATION_PHASE (A: the session must be rab_owner; B: never a runtime/owner login), and CF-41.
  migrate:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    image: rab-qa-server
    env_file:
      - path: .env.migrate
        required: false
    environment:
      NODE_ENV: development
      DB_TARGET: local
      CREWFLOW_MIGRATION_APPROVED: ${CREWFLOW_MIGRATION_APPROVED:-}
      CREWFLOW_MIGRATION_PHASE: ${CREWFLOW_MIGRATION_PHASE:-}
      CREWFLOW_MIGRATION_DATABASE_URL: ${CREWFLOW_MIGRATION_DATABASE_URL:-}
      # Read only by the two role-creating migrations, in phase B on a fresh volume. They become the passwords that the
      # server/worker URLs above log in with. Phase A unsets them before the runner starts.
      CREWFLOW_BOOTSTRAP_PASSWORD: ${QA_CREWFLOW_PASSWORD:?set QA_CREWFLOW_PASSWORD}
      CREWFLOW_APP_BOOTSTRAP_PASSWORD: ${QA_CREWFLOW_APP_PASSWORD:?set QA_CREWFLOW_APP_PASSWORD}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        # Phase B P7: the migration login reaches deploy-prepare ONLY as its PG_DATABASE_URL: from .env.migrate, or (legacy
        # operator habit) from CREWFLOW_MIGRATION_DATABASE_URL in the shell. The legacy name is removed before exec.
        url="$${PG_DATABASE_URL:-$${CREWFLOW_MIGRATION_DATABASE_URL:-}}"
        unset CREWFLOW_MIGRATION_DATABASE_URL || true
        if [ -z "$$url" ]; then
          echo "migrate: REFUSED - no migration connection. Put PG_DATABASE_URL in packages/rab-docker/.env.migrate (see .env.migrate.example) or set CREWFLOW_MIGRATION_DATABASE_URL for this run." >&2; exit 64
        fi
        if [ "$${CREWFLOW_MIGRATION_PHASE:-}" = "A" ]; then unset CREWFLOW_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD || true; fi
        exec env PG_DATABASE_URL="$$url" node packages/rab-server/dist/database/typeorm/scripts/deploy-prepare.js

  front:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../..:/app
      - rab-qa-front-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://127.0.0.1:3101/rest/v1
    command: sh -c "corepack enable && yarn install --immutable && cd packages/rab-front && npx vite --port 5173 --host 0.0.0.0"
    ports:
      - '127.0.0.1:5174:5173'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173/']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  rab-qa-postgres-data:
  rab-qa-redis-data:
  rab-qa-minio-data:
  rab-qa-front-node-modules:
