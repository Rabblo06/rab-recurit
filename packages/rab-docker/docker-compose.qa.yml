name: rab-qa

# Isolated manual-QA stack. It is a separate Compose project with its own containers, named volumes and loopback-only
# host ports. It shares nothing at runtime with the dev stack (docker-compose.yml, project `rab`, rab_devdb_data) and
# never touches Neon, OpenShip or any remote database.
#
# TOPOLOGY: mirrors the PRODUCTION owner-login topology (docker-compose.image.yml + docker-compose.local-db.yml; Phase X
# X2.3, the same pattern as the e2e system and cost harnesses, P0-H #94), not the dev stack:
#   - postgres: on a FRESH (empty) volume its only init step is the committed one-time provider-admin SQL,
#     postgres-init/owner-login/01-crewflow-owner.sql, which creates the ONE application login crewflow_owner with the
#     password read from /run/secrets/crewflow-owner-password (a compose secret fed from QA_CREWFLOW_OWNER_PASSWORD, never
#     a command line). postgres-init/01-roles.sql and transition-from-separated.sql are never mounted.
#   - rab-api (`server`): the image's own start, ./api-prestart.sh with CREWFLOW_MIGRATE_ON_START=true: the migration child
#     (lock, classifier, whole chain, post-checks; a first-install failure never serves), the BullMQ job-scheduler
#     registration (WORKER_SCHEDULER=bullmq), then main.js.
#   - rab-worker (`worker`): O1, the SAME image as `server`, run as `node packages/rab-worker/dist/main.js`, ONE process
#     as uid 1000 under compose's init with the production security settings. Consume-only: it never migrates, never
#     registers schedulers, and starts after a healthy server. It provisions workspaces in-process.
#   - ONE PG_DATABASE_URL, crewflow_owner, on the server and the worker, built here from the password below:
#     postgres://crewflow_owner:<QA_CREWFLOW_OWNER_PASSWORD>@postgres:5432/rab_manual_qa. No migration login, no
#     runtime-role login.
#   - Redis, plus object storage through the S3 driver (MinIO stands in for R2, with SSE header NONE as on R2). There is
#     no shared volume between api and worker, as in production.
#   - HWS runtime routing OFF (HWS_RUNTIME_ENABLED=false on api and jobs), as in production until gate G4. The dev
#     stack runs HWS on; QA deliberately does not, so it tests what production will run.
#   - migrate (the separated-mode one-off deploy-prepare step) is kept for ONE cycle behind the `migrate` profile only; it
#     is never started by `up` and nothing depends on it.
#
# KNOWN DIFFERENCES FROM PRODUCTION (unavoidable; see WAVE1_LANE_D_REPORT.md):
#   - NODE_ENV/RAB_RUNTIME_ENV = development. NODE_ENV=production needs TLS verify-full and a database bound to the
#     production deployment identity, which a local QA database is not. `development` is the strictest non-production mode: it refuses
#     any non-local database host. Production config refusals (https URLs, TRUSTED_PROXY_CIDRS, real email) are
#     therefore not exercised here, and email uses the LOGGER driver.
#   - The database is a local postgres:16-alpine with the image's default pg_hba and a `rab` superuser (initdb and DBA
#     tasks only, never an app login); production's local-db/pg_hba.conf and TLS are not reproduced.
#
# SECRETS: none are committed. Put these variables in packages/rab-docker/.env.qa.local, which is git-ignored by
# `.env.*.local`. Use letters and digits only, for example `openssl rand -hex 32`:
#   QA_POSTGRES_SUPERUSER_PASSWORD   the `rab` superuser (initdb only)
#   QA_CREWFLOW_OWNER_PASSWORD       crewflow_owner, the ONE application login (at least 24 characters)
#   QA_APP_SECRET                    QA-only application secret (32+ characters)
# The variables are required (`:?`), so the stack fails closed without them. Passing `--env-file` also stops Compose
# from reading the dev stack's packages/rab-docker/.env. QA_CREWFLOW_PASSWORD / QA_CREWFLOW_APP_PASSWORD are read only by
# the superseded `migrate` profile.
#
# FIRST RUN (fresh volume). C is shorthand for the compose prefix:
#   C="docker compose --env-file packages/rab-docker/.env.qa.local -f packages/rab-docker/docker-compose.qa.yml"
#   $C up -d --build        # the server applies the whole chain on its first start (health check allows 600 s)
#   # First platform admin, after the server is healthy (DB_TARGET=local on that run only):
#   $C exec -e DB_TARGET=local -e BOOTSTRAP_ADMIN_EMAIL=you@example.test server #     node packages/rab-server/dist/command/main.js bootstrap-admin
# Later releases: `$C up -d --build` again (the server migrates on start). An existing QA volume initialised before this
# change (separated logins, no crewflow_owner) keeps postgres unhealthy, by design: reset it with `$C down -v`.
# Reset: `$C down -v` (QA data is disposable; this never touches dev volumes).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: ${QA_POSTGRES_SUPERUSER_PASSWORD:?set QA_POSTGRES_SUPERUSER_PASSWORD (see the header of docker-compose.qa.yml)}
      POSTGRES_DB: rab_manual_qa
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - '127.0.0.1:55433:5432'
    secrets:
      - crewflow-owner-password
    volumes:
      - rab-qa-postgres-data:/var/lib/postgresql/data
      # File by file, never the directory: postgres-init/ also holds the retired separated-mode 01-roles.sql, and
      # owner-login/ holds transition-from-separated.sql, which must never run on a fresh cluster.
      - ./postgres-init/owner-login/01-crewflow-owner.sql:/docker-entrypoint-initdb.d/01-crewflow-owner.sql:ro
    healthcheck:
      # Ready AND the one-time owner step completed: a half-initialised volume (or an old one) without crewflow_owner stays
      # unhealthy, as docker-compose.local-db.yml checks it.
      test:
        - CMD-SHELL
        - "pg_isready -U rab -d rab_manual_qa && psql -X -U rab -d rab_manual_qa -Atc \"select 1 from pg_roles where rolname = 'crewflow_owner' and rolcanlogin\" | grep -qx 1"
      interval: 5s
      timeout: 5s
      retries: 20

  # No host port, as in production: only server/worker reach it on the compose network.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - rab-qa-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stand-in for Cloudflare R2. The throwaway credentials are reachable on loopback only. The bucket is private,
  # versioned and encrypted by default at the bucket level, so, as on R2, the application sends no SSE headers.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rab_qa_minio_dev
      MINIO_ROOT_PASSWORD: rab_qa_minio_dev_only_secret
      MINIO_KMS_SECRET_KEY: 'rab-qa-dev-key:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
    ports:
      - '127.0.0.1:9010:9000'
      - '127.0.0.1:9011:9001'
    volumes:
      - rab-qa-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localqa http://minio:9000 rab_qa_minio_dev rab_qa_minio_dev_only_secret &&
      mc mb --ignore-existing localqa/rab-qa &&
      mc anonymous set none localqa/rab-qa &&
      mc version enable localqa/rab-qa &&
      mc encrypt set sse-s3 localqa/rab-qa &&
      echo bucket-ready"

  # rab-api equivalent: migrates on start (O3 C1), registers the job schedulers (C2), then main.js, on the ONE owner login.
  # DATABASE_URL, DATABASE_URL_UNPOOLED, DATABASE_DIRECT_URL, DB_TARGET and every role password are deliberately absent, as
  # on production rab-api; api-prestart.sh refuses them if they are present.
  server:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    image: rab-qa-server
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      # The ONE application login (owner-login architecture), identical on the server and the worker.
      PG_DATABASE_URL: postgres://crewflow_owner:${QA_CREWFLOW_OWNER_PASSWORD:?set QA_CREWFLOW_OWNER_PASSWORD (see the header of docker-compose.qa.yml)}@postgres:5432/rab_manual_qa
      # O3 C1 (production's lifecycle): the server migrates on start, under the migration lock (approval mode none, the
      # production default). A failed first install never serves; a failed upgrade starts degraded (C3), as in production.
      CREWFLOW_MIGRATE_ON_START: 'true'
      CREWFLOW_MIGRATION_APPROVAL_MODE: none
      # O3 C2 (production's scheduler mode): the server registers the BullMQ job schedulers in api-prestart.sh; the worker
      # only consumes them. The same value on both.
      WORKER_SCHEDULER: bullmq
      # Phase D (E-1): same value as the worker; event = this API's sessions NOTIFY the Worker. Default poll = no NOTIFY.
      WORKER_DISPATCH_MODE: ${WORKER_DISPATCH_MODE:-poll}
      WORKER_CLAIM_MODE: ${WORKER_CLAIM_MODE:-per_scope}
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${QA_APP_SECRET:?set QA_APP_SECRET (see the header of docker-compose.qa.yml)}
      # OFF until production gate G4 (see header). Explicit so a QA run can never silently differ from production.
      HWS_RUNTIME_ENABLED: 'false'
      EMAIL_DRIVER: LOGGER
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      # Same loopback alias as the front's VITE_API_URL, so the SameSite session cookie survives a reload.
      APP_URL: http://127.0.0.1:5174
      ACCOUNTS_URL: http://127.0.0.1:5174
      # TRUSTED_PROXY_CIDRS is unset: no reverse proxy sits in front of QA, so X-Forwarded-For is never trusted.
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: qa
      S3_BUCKET: rab-qa
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_qa_minio_dev
      S3_SECRET_ACCESS_KEY: rab_qa_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: NONE
    # The image's default command, stated as production states it: env refusals, the migration child, the scheduler
    # registration, then main.js.
    command: ['./api-prestart.sh']
    ports:
      - '127.0.0.1:3101:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 15
      # A fresh install applies the whole chain before main.js listens.
      start_period: 600s
    restart: unless-stopped

  # rab-worker equivalent (O1, one image): the SAME image as `server` (rab/Dockerfile), a different command, with the
  # production rab-worker's security settings: ONE process as uid/gid 1000 under compose's init, workspace provisioning
  # in-process. The retired root launcher, its provisioner child (uid 10001) and CREWFLOW_PROVISIONER_DATABASE_URL are
  # gone. PG_DATABASE_URL is a direct connection (it is also the session-lock connection), as in production. O3 C1/C2: it
  # never migrates, only consumes the job schedulers the server registered, and starts after a healthy server.
  worker:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
    image: rab-qa-worker
    command: ['node', 'packages/rab-worker/dist/main.js']
    # Docker's init as PID 1: the Worker's watchdog SIGKILLs a stalled event loop, which the kernel ignores for PID 1.
    init: true
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    stop_grace_period: 45s
    environment:
      NODE_ENV: development
      RAB_RUNTIME_ENV: development
      # The same ONE owner login as the server.
      PG_DATABASE_URL: postgres://crewflow_owner:${QA_CREWFLOW_OWNER_PASSWORD:?set QA_CREWFLOW_OWNER_PASSWORD}@postgres:5432/rab_manual_qa
      DISABLE_DB_MIGRATIONS: 'true'
      DISABLE_CRON_JOBS_REGISTRATION: 'true'
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: '0'
      # Phase B (B5): the Worker runtime pool size, as in production.
      PG_POOL_MAX_CONNECTIONS: '12'
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${QA_APP_SECRET:?set QA_APP_SECRET}
      HWS_RUNTIME_ENABLED: 'false'
      # In-process provisioning, the same pinned 5 s as production (the code default is 60 s), so QA tests what production
      # runs.
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: '5'
      # O3 C2: production's scheduler mode, the same value as the server, which registers the schedulers.
      WORKER_SCHEDULER: bullmq
      # Phase D (D1/D2): per_scope / poll (the code defaults, as in production) unless a QA run deliberately sets them;
      # event needs global.
      WORKER_CLAIM_MODE: ${WORKER_CLAIM_MODE:-per_scope}
      WORKER_DISPATCH_MODE: ${WORKER_DISPATCH_MODE:-poll}
      EMAIL_DRIVER: LOGGER
      CORS_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      APP_URL: http://127.0.0.1:5174
      ACCOUNTS_URL: http://127.0.0.1:5174
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: qa
      S3_BUCKET: rab-qa
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_qa_minio_dev
      S3_SECRET_ACCESS_KEY: rab_qa_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: NONE
      # What the retired launcher gave its jobs child (H1-M1), as in production.
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json
    healthcheck:
      # Jobs-only per-instance health (the provisioner role is off for this check only), as in production.
      test: ['CMD', 'env', 'CREWFLOW_PROVISIONER_ENABLED=false', 'node', '/opt/crewflow-bundle/worker-bundle-health.cjs']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped

  # SUPERSEDED, KEPT FOR ONE CYCLE (Phase X X2.3): the separated-mode one-off `migrate` step (deploy-prepare.js), behind the
  # `migrate` profile only. `up` never starts it and nothing depends on it: the server migrates on start (above). Run it
  # explicitly (`$C --profile migrate run --rm migrate`) only against a volume still on the separated logins. It applies
  # only with CREWFLOW_MIGRATION_APPROVED=<token of the exact pending set> (final review F5); otherwise it checks: exit 0
  # nothing pending, exit 3 pending (the log prints the list and the token), exit 1 refused. It is the only service that
  # ever holds a migration identity: PG_DATABASE_URL from packages/rab-docker/.env.migrate, or
  # CREWFLOW_MIGRATION_DATABASE_URL from the operator's shell for one run. The runner enforces the rest: DB_TARGET=local
  # refuses a non-local host, the deployment identity marker, CREWFLOW_MIGRATION_PHASE (A: the session must be rab_owner;
  # B: never a runtime/owner login), and CF-41. Removed in the next cycle.
  migrate:
    profiles: ['migrate']
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    image: rab-qa-server
    env_file:
      - path: .env.migrate
        required: false
    environment:
      NODE_ENV: development
      DB_TARGET: local
      CREWFLOW_MIGRATION_APPROVED: ${CREWFLOW_MIGRATION_APPROVED:-}
      CREWFLOW_MIGRATION_PHASE: ${CREWFLOW_MIGRATION_PHASE:-}
      CREWFLOW_MIGRATION_DATABASE_URL: ${CREWFLOW_MIGRATION_DATABASE_URL:-}
      # Read only by the two role-creating migrations, in phase B on a separated-mode volume. Phase A unsets them before
      # the runner starts. Optional here (`:-`), so the default `up` never needs them; the migrations refuse an empty one.
      CREWFLOW_BOOTSTRAP_PASSWORD: ${QA_CREWFLOW_PASSWORD:-}
      CREWFLOW_APP_BOOTSTRAP_PASSWORD: ${QA_CREWFLOW_APP_PASSWORD:-}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        # Phase B P7: the migration login reaches deploy-prepare ONLY as its PG_DATABASE_URL: from .env.migrate, or (legacy
        # operator habit) from CREWFLOW_MIGRATION_DATABASE_URL in the shell. The legacy name is removed before exec.
        url="$${PG_DATABASE_URL:-$${CREWFLOW_MIGRATION_DATABASE_URL:-}}"
        unset CREWFLOW_MIGRATION_DATABASE_URL || true
        if [ -z "$$url" ]; then
          echo "migrate: REFUSED - no migration connection. Put PG_DATABASE_URL in packages/rab-docker/.env.migrate (see .env.migrate.example) or set CREWFLOW_MIGRATION_DATABASE_URL for this run." >&2; exit 64
        fi
        if [ "$${CREWFLOW_MIGRATION_PHASE:-}" = "A" ]; then unset CREWFLOW_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD || true; fi
        exec env PG_DATABASE_URL="$$url" node packages/rab-server/dist/database/typeorm/scripts/deploy-prepare.js

  front:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../..:/app
      - rab-qa-front-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://127.0.0.1:3101/rest/v1
    command: sh -c "corepack enable && yarn install --immutable && cd packages/rab-front && npx vite --port 5173 --host 0.0.0.0"
    ports:
      - '127.0.0.1:5174:5173'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173/']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

secrets:
  # The crewflow_owner password for 01-crewflow-owner.sql, mounted into postgres at /run/secrets/crewflow-owner-password (the
  # file the SQL reads by default), from the env file; never on a command line. Read only on a fresh volume.
  crewflow-owner-password:
    environment: QA_CREWFLOW_OWNER_PASSWORD

volumes:
  rab-qa-postgres-data:
  rab-qa-redis-data:
  rab-qa-minio-data:
  rab-qa-front-node-modules:
