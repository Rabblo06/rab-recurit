name: rab-qa

# Fully isolated manual-QA stack — separate Compose project, separate
# containers, separate named volumes, separate host ports. Shares nothing at
# runtime with the normal dev stack (packages/rab-docker/docker-compose.yml,
# project `rab`, ports 3000/5173/55432/6379/9000-9001). Safe to bring up/down
# independently; never touches `rab-postgres-data`/`rab-redis-data`/
# `rab-minio-data` or their containers.
#
# Usage:
#   docker compose -f packages/rab-docker/docker-compose.qa.yml up -d
#   docker compose -f packages/rab-docker/docker-compose.qa.yml stop
#   docker compose -f packages/rab-docker/docker-compose.qa.yml logs -f worker

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rab
      POSTGRES_PASSWORD: rab
      POSTGRES_DB: rab_manual_qa
    ports:
      - '55433:5432'
    volumes:
      - rab-qa-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rab -d rab_manual_qa']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - rab-qa-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: rab_qa_minio_dev
      MINIO_ROOT_PASSWORD: rab_qa_minio_dev_only_secret
      MINIO_KMS_SECRET_KEY: 'rab-qa-dev-key:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
    ports:
      - '127.0.0.1:9010:9000'
      - '127.0.0.1:9011:9001'
    volumes:
      - rab-qa-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set localqa http://minio:9000 rab_qa_minio_dev rab_qa_minio_dev_only_secret &&
      mc mb --ignore-existing localqa/rab-qa &&
      mc anonymous set none localqa/rab-qa &&
      mc version enable localqa/rab-qa &&
      mc encrypt set sse-s3 localqa/rab-qa &&
      echo bucket-ready"

  server:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    environment:
      DATABASE_URL: postgres://rab_app:rab_app_dev_only@postgres:5432/rab_manual_qa
      DATABASE_URL_UNPOOLED: postgres://rab_owner:rab_owner_dev_only@postgres:5432/rab_manual_qa
      REDIS_URL: redis://redis:6379
      APP_SECRET: 'qa-only-not-a-real-secret-0000000000000000000000'
      EMAIL_DRIVER: LOGGER
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174
      STORAGE_DRIVER: S3
      S3_BUCKET: rab-qa
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_qa_minio_dev
      S3_SECRET_ACCESS_KEY: rab_qa_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: AES256
      STORAGE_KEY_PREFIX: qa
    command: ./start.sh
    ports:
      - '3101:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/healthz']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: packages/rab-docker/rab/Dockerfile
      target: rab
    environment:
      DATABASE_URL: postgres://rab_app:rab_app_dev_only@postgres:5432/rab_manual_qa
      DATABASE_URL_UNPOOLED: postgres://rab_owner:rab_owner_dev_only@postgres:5432/rab_manual_qa
      REDIS_URL: redis://redis:6379
      APP_SECRET: 'qa-only-not-a-real-secret-0000000000000000000000'
      EMAIL_DRIVER: LOGGER
      STORAGE_DRIVER: S3
      S3_BUCKET: rab-qa
      S3_REGION: eu-west-2
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: rab_qa_minio_dev
      S3_SECRET_ACCESS_KEY: rab_qa_minio_dev_only_secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_SERVER_SIDE_ENCRYPTION: AES256
      STORAGE_KEY_PREFIX: qa
    command: node packages/rab-worker/dist/main.js
    depends_on:
      server:
        condition: service_healthy
      minio:
        condition: service_healthy

  front:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../..:/app
      - rab-qa-front-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://127.0.0.1:3101/rest/v1
    command: sh -c "corepack enable && yarn install --immutable && cd packages/rab-front && npx vite --port 5173 --host 0.0.0.0"
    ports:
      - '5174:5173'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173/']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  rab-qa-postgres-data:
  rab-qa-redis-data:
  rab-qa-minio-data:
  rab-qa-front-node-modules:
