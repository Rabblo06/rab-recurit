# Crewflow production stack, IMAGE-BASED and DIGEST-PINNED (owner decisions R1, R4, R5; 2026-11-03), on the OWNER LOGIN
# (owner's final decision, 2026-11-04: ONE schema-owning login, crewflow_owner, for the API, the Worker and the release
# step; no mode switch). Runbook: packages/rab-docker/docs/release/OWNER-LOGIN-DEPLOYMENT.md.
#
# DEPLOY = ONE COMMAND, like Twenty (owner decision 2026-11-11), with COMPOSE_FILE / COMPOSE_ENV_FILES (or -f/--env-file):
#   docker compose pull && docker compose up -d
# It updates rab-api and rab-worker together, from the same image variable. The API starts first, migrates and becomes
# healthy; the Worker starts after it (and Compose stops the old Worker before replacing the API: restart: true).
# Rollback: CREWFLOW_IMAGE_TAG=<previous digest>, then the same command. Both go back together.
#   + -f docker-compose.local-db.yml           bundled PostgreSQL 16 (its init is Agent 1's crewflow_owner SQL)
#   + -f staging/docker-compose.staging.yml    the isolated staging project
#
# Every application service runs a prebuilt image by IMMUTABLE DIGEST. Nothing is built on the host: this file has no
# `build:` section anywhere, so a host can never rebuild the release from whatever commit it happens to have checked out.
#
#   rab-api, rab-worker, rab-ops  ${CREWFLOW_IMAGE_REPOSITORY}@${CREWFLOW_IMAGE_TAG}
#   rab-redis                     ${CREWFLOW_REDIS_IMAGE} (repository@sha256:<digest>)
# CREWFLOW_IMAGE_TAG is the multi-platform INDEX digest (amd64 + arm64, sha256:<64 hex>) of the approved release, never a
# tag (the variable is named like Twenty's TAG; the `@` form and compose-owner-login.cjs refuse a plain tag); compose
# refuses to render without it. CREWFLOW_IMAGE_DIGEST (its name until 2026-11-11) is retired and refused in compose.env.
# O1/O2: the API and the Worker are ONE image (rab/Dockerfile), chosen by command, published
# under ONE tag (the full commit). The former CREWFLOW_API_IMAGE_DIGEST / CREWFLOW_WORKER_IMAGE_DIGEST pair is retired
# (scripts/compose-owner-login.cjs refuses it in compose.env); rolling back to a two-digest release such as v0.4.0 uses
# that release's own compose files (docs/release/OWNER-LOGIN-RECOVERY.md section 4.4).
#
# ONE DATABASE CREDENTIAL. rab-api and rab-worker read PG_DATABASE_URL (crewflow_owner at the DIRECT host,
# sslmode=verify-full) from ONE file, ${CREWFLOW_SECRETS_DIR}/database.env (template env/database.env.example), so it is
# byte-identical everywhere. There is no migrator, provisioner, worker, ops or replica URL, no .env.migrate and no role
# password anywhere in this stack. The runtime settings (APP_SECRET, REDIS_URL, URLs, email, S3) are in a SECOND file,
# ${CREWFLOW_SECRETS_DIR}/runtime.env (template env/runtime.env.example), read by rab-api and rab-worker.
# scripts/compose-owner-login.cjs enforces all of this in CI.
#
# LIFECYCLE (O3, owner decisions C1-C5, 2026-11-05, "EXACTLY LIKE TWENTY"; G-07 accepted). There is NO release step and
# no rab-migrate: the API MIGRATES ON START (CREWFLOW_MIGRATE_ON_START=true; approval mode none by default, token an opt-in
# of compose.env, BC-11/C4; with token, the API's start needs CREWFLOW_MIGRATION_APPROVED). api-prestart.sh runs the
# migration child under the migration lock before main.js (a first-install failure exits non-zero and the API never becomes
# healthy; a failed UPGRADE logs an ERROR and the API starts degraded, C3), then registers the BullMQ job schedulers (C2).
# The Worker NEVER migrates (DISABLE_DB_MIGRATIONS=true) and never registers schedulers (DISABLE_CRON_JOBS_REGISTRATION=
# true, consume only); it starts only after a healthy API and a healthy Redis, so it does not wait for the schema itself
# (CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS=0). ONE rab-api, deployed STOP-THEN-START (C5): `docker compose up -d` stops the old
# Worker, replaces the API container (the old one stops, then the new one starts and migrates), then starts the new Worker
# once the API is healthy; never scale rab-api, never run a second stack (blue-green) against the same database. Never
# update the API alone while an older Worker keeps running. The deployment id (CREWFLOW_DEPLOYMENT_*) stays an optional
# database.env entry.
# Accepted risk: every start of a new image applies what it ships; recovery is the MANDATORY pre-upgrade backup
# (docs/release/OWNER-LOGIN-DEPLOYMENT.md section 3, OWNER-LOGIN-RECOVERY.md).
#
# SECURITY POSTURE. The runtime login owns the schema (PT-01; M0 G-01..G-04 and the rest: runbook section 1, THREAT-MODEL.md).
# Container isolation below limits what a compromised PROCESS can do to the HOST; it does nothing for what the database
# login can do. The owner-approval items not covered by the owner's accepted list are in runbook section 1.
#
# RUNTIME ISOLATION (Docker hardening H1-H6), on every service: non-root numeric user, read-only root, cap_drop ALL with
# nothing added, no-new-privileges, PID/memory/CPU limits, health checks (long-running services), a graceful stop window,
# bounded logs. CREWFLOW_RUNTIME_ISOLATION=enforce: the API (api-prestart.sh) refuses to start when a control is missing at
# runtime, and so does the Worker's own process (the retired launcher's check, ported into rab-worker: uid 1000, empty
# capability bounding set, no-new-privileges, read-only root, PID and memory limits; "[worker-isolation] ..." log line).
#
# WHERE IT RUNS: plain `docker compose` (v2.24+) on a VM the operator controls. Never OpenShip (it drops user / read_only /
# tmpfs / cap_drop / security_opt / pids_limit / env_file / depends_on conditions); the long-form tmpfs on rab-ops makes
# OpenShip refuse to import this file (docs/release/OPENSHIP-COMPATIBILITY.md).
#
# SUPERSEDED, KEPT UNTIL THE FINAL CLEAN-UP PR (#9, owner approval): rab-ops (profile "ops", never started by `up`) still
# names .env.ops and its separated-mode credentials; it is not part of the owner-login deployment and must not be run.

name: rab-production

x-logging: &logging
  # Bounded container logs: a crash loop must not fill the host disk.
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:

  # ---------------------------------------------------------------------------
  # rab-redis — BullMQ, rate limits, caches, realtime Pub/Sub. Never published. Durable (AOF everysec) and NEVER evicting
  # (an evicting policy can silently drop BullMQ jobs and locks). The ACL file (template env/redis-users.acl.example:
  # default user OFF, the app user `crewflow` by SHA-256, a PING-only `healthcheck` user) lives in the host secret
  # directory, never in the repository. Settings are explicit flags (checked in CI), not a separate config file.
  # ---------------------------------------------------------------------------
  rab-redis:
    image: ${CREWFLOW_REDIS_IMAGE:?CREWFLOW_REDIS_IMAGE must be a redis image pinned by digest (repository@sha256:<digest>)}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --maxmemory
      - ${CREWFLOW_REDIS_MAXMEMORY:-1gb}
      - --aclfile
      - /run/secrets/redis-users.acl
    volumes:
      - rab-redis-data:/data
      - ${CREWFLOW_SECRETS_DIR:?CREWFLOW_SECRETS_DIR must name the host secret directory}/redis-users.acl:/run/secrets/redis-users.acl:ro
    healthcheck:
      # PING-only ACL user; answers LOADING (unhealthy) until the AOF is loaded.
      test: ["CMD-SHELL", "redis-cli --no-auth-warning --user healthcheck --pass healthcheck ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    # The image's own `redis` user (uid 999, gid 1000): no privilege drop needed, so no capability.
    user: '999:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=8m,mode=1777
    pids_limit: 128
    mem_limit: 1600m
    cpus: ${CREWFLOW_REDIS_CPUS:-1}

  # ---------------------------------------------------------------------------
  # rab-api — the HTTP API. Migrates on start (O3 C1), registers the job schedulers (C2), then main.js. ONE instance (C5).
  # ---------------------------------------------------------------------------
  rab-api:
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:?CREWFLOW_IMAGE_TAG must be the release image index digest (sha256:<64 hex>), never a tag}

    # The image's default command, stated explicitly (api-prestart.sh: env refusals, the runtime-isolation check, the
    # migration child under the migration lock, the scheduler registration, then main.js).
    command: ["./api-prestart.sh"]

    env_file:
      - path: ${CREWFLOW_SECRETS_DIR:?CREWFLOW_SECRETS_DIR must name the host secret directory}/database.env
        required: true
      - path: ${CREWFLOW_SECRETS_DIR:?CREWFLOW_SECRETS_DIR must name the host secret directory}/runtime.env
        required: true

    # Never on every interface: the address the edge proxy connects to (127.0.0.1 when the proxy runs on the host). The
    # host port is configurable so the stack can coexist with another service already on 3000.
    ports:
      - "${CREWFLOW_API_BIND:-127.0.0.1}:${CREWFLOW_API_HOST_PORT:-3000}:3000"

    volumes:
      # The CA that signs the database server certificate (verify-full): PG_SSL_CA_CERT_PATH=/run/crewflow/pg-ca.crt.
      - ${CREWFLOW_PG_CA_FILE:?CREWFLOW_PG_CA_FILE must name the PostgreSQL CA certificate file}:/run/crewflow/pg-ca.crt:ro

    environment:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      HWS_RUNTIME_ENABLED: "false"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      # Refuse to start when the platform did not apply the runtime isolation below (H6 enforce mode). Never override.
      CREWFLOW_RUNTIME_ISOLATION: enforce
      # O3 C1 (owner decision 2026-11-05, like Twenty): the API migrates on start. Approval mode none by default (C4), token
      # an opt-in (BC-11): set CREWFLOW_MIGRATION_APPROVAL_MODE=token in compose.env (the ONLY place; the gate refuses it in
      # database.env / runtime.env, where this line would silently override it). A failed UPGRADE starts degraded (C3:
      # CREWFLOW_UPGRADE_FAILURE unset = continue; runtime.env may opt into refuse); a failed first install never serves. It
      # registers the BullMQ job schedulers itself (C2: DISABLE_CRON_JOBS_REGISTRATION unset).
      CREWFLOW_MIGRATE_ON_START: "true"
      CREWFLOW_MIGRATION_APPROVAL_MODE: ${CREWFLOW_MIGRATION_APPROVAL_MODE:-none}
      # Notification delivery (owner decision 2026-11-06), the SAME two values on rab-api and rab-worker. Fast publish: the
      # email (and, once PUSH_ENABLED=true, push) rows NotificationService.notify() writes are published right after the
      # transaction commits; the dispatcher stays the safety net. The email sweep runs every 30 s (code default 2 s, bounds
      # 1-60): the API registers the BullMQ scheduler with ITS value; the Worker only consumes it, and is set identically.
      # Push and realtime sweeps keep the 2 s default (not set here). When PUSH_ENABLED is turned on, set
      # WORKER_PUSH_DISPATCH_INTERVAL_SECONDS: "30" here on both services (owner rule; its immediate send is this flag). The
      # gate and the verifier refuse PUSH_ENABLED=true without it (Phase X J2, SJ-03).
      # Committed (scripts/compose-owner-login.cjs and staging/verify-image-compose.cjs enforce both, on both services).
      WORKER_FAST_PUBLISH_NOTIFY: "true"
      WORKER_EMAIL_DISPATCH_INTERVAL_SECONDS: "30"
      # Phase D switches (owner decision 2026-11-06), the SAME values on rab-api and rab-worker. Timer triggers ON for all
      # four kinds (shadow run: 0 wrong / early / missed over 336 decisions). The kinds are listed explicitly so a future
      # kind is never switched on by default. No-show and late clock-in touch attendance and payroll: owner decision, see
      # THREAT-MODEL. The scans stay as safety sweeps at these intervals (within worker-scan-intervals.ts bounds): offer
      # expiry 300 s (10-300), manager confirmation 120 s (10-300), late clock-in 300 s (30-600). The shift monitor stays at
      # its 300 s default (it also sends the reminders and arms the no-show/late triggers), so it is not set here. The API
      # registers each BullMQ scheduler with ITS value and the Worker only consumes them, so both carry the same values.
      # WORKER_SHIFT_SCAN_MODE (combined scan, D-Q4a) stays unset = separate (owner decision). Committed; the gate and the
      # verifier enforce every value on both services.
      WORKER_TIMER_TRIGGERS: "on"
      WORKER_TIMER_TRIGGER_KINDS: "offer-expiry,manager-confirmation,no-show,late-clock-in"
      WORKER_OFFER_EXPIRY_INTERVAL_SECONDS: "300"
      WORKER_MANAGER_CONFIRMATION_TIMEOUT_INTERVAL_SECONDS: "120"
      WORKER_LATE_CLOCK_IN_INTERVAL_SECONDS: "300"

    depends_on:
      rab-redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 15
      # A fresh install applies the whole chain (plus a lock wait bounded at 600 s) before main.js listens.
      start_period: 900s

    restart: unless-stopped
    logging: *logging
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    # The migration child is a second Node process in this container on start. NOT MEASURED; tune after a fresh-install run.
    mem_limit: ${CREWFLOW_API_MEM_LIMIT:-1024m}
    cpus: ${CREWFLOW_API_CPUS:-2}
    stop_grace_period: 40s

  # ---------------------------------------------------------------------------
  # rab-worker — background jobs, ONE process as uid/gid 1000 on the same crewflow_owner login (DBA-01, the API/Worker
  # separation, is lost: runbook section 1, NEEDS OWNER APPROVAL). O1: the SAME image as rab-api, a different command. The
  # image's ENTRYPOINT (tini -s) runs under compose's init and forwards SIGTERM; there is no root process, no capability and
  # no provisioner identity (workspace provisioning runs in-process). It never migrates, never registers job schedulers
  # (it consumes them) and starts only after a healthy API and a healthy Redis (O3 C1/C2).
  # ---------------------------------------------------------------------------
  rab-worker:
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:?CREWFLOW_IMAGE_TAG must be the release image index digest (sha256:<64 hex>), never a tag}

    command: ["node", "packages/rab-worker/dist/main.js"]
    working_dir: /app
    # Docker's init (tini) as PID 1: the Worker's watchdog SIGKILLs a stalled event loop, which the kernel ignores for PID 1,
    # so the Worker refuses to start as PID 1. Required (compose-owner-login.cjs).
    init: true
    env_file:
      - path: ${CREWFLOW_SECRETS_DIR:?CREWFLOW_SECRETS_DIR must name the host secret directory}/database.env
        required: true
      - path: ${CREWFLOW_SECRETS_DIR:?CREWFLOW_SECRETS_DIR must name the host secret directory}/runtime.env
        required: true
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp/crewflow-jobs:uid=1000,gid=1000,mode=0700
      - /run/crewflow-health/jobs:uid=1000,gid=1000,mode=0755
    volumes:
      - ${CREWFLOW_PG_CA_FILE:?CREWFLOW_PG_CA_FILE must name the PostgreSQL CA certificate file}:/run/crewflow/pg-ca.crt:ro
    # Above the 30 s jobs drain plus margin, so a SIGTERM never cuts a drain short.
    stop_grace_period: 45s
    # Kept from the separated sizing until the H6 matrix re-measures with the native renderer (#61).
    pids_limit: 1024
    # Native PDF render threads (review M-3): PDF_NATIVE_CONCURRENCY x 384 MB heap cap must fit
    # PDF_NATIVE_MEMORY_BUDGET_MB (default 768 = half of this 1536m; the rest is the jobs process, the
    # threads' young generations and WASM, and in-process provisioning), else the Worker refuses to boot. Raising
    # CREWFLOW_WORKER_MEM_LIMIT does not raise the budget: set both together.
    mem_limit: ${CREWFLOW_WORKER_MEM_LIMIT:-1536m}
    cpus: ${CREWFLOW_WORKER_CPUS:-2}
    logging: *logging

    environment:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      AI_ENABLED: 'false'
      HWS_RUNTIME_ENABLED: "false"
      STORAGE_DRIVER: S3
      STORAGE_KEY_PREFIX: production
      S3_FORCE_PATH_STYLE: "true"
      S3_SERVER_SIDE_ENCRYPTION: NONE
      # The owner's "feel instant" onboarding pin (5 s instead of the 60 s code default), now read by the in-process
      # workspace provisioner (Agent 2 interface). OWNER DECISION to relax it.
      WORKSPACE_PROVISIONER_INTERVAL_SECONDS: "5"
      PG_POOL_MAX_CONNECTIONS: "12"
      CREWFLOW_RUNTIME_ISOLATION: enforce
      # O3 C1/C2 (like Twenty): the Worker never migrates and only CONSUMES the job schedulers the API registers (production
      # runs WORKER_SCHEDULER=bullmq by default; interval is refused in production). It starts after a healthy API, so it
      # does not wait for the schema itself.
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      CREWFLOW_WORKER_SCHEMA_WAIT_SECONDS: "0"
      # Notification delivery (owner decision 2026-11-06): identical to rab-api (see its comment there).
      WORKER_FAST_PUBLISH_NOTIFY: "true"
      WORKER_EMAIL_DISPATCH_INTERVAL_SECONDS: "30"
      # Phase D switches (owner decision 2026-11-06): identical to rab-api (see its comment there).
      WORKER_TIMER_TRIGGERS: "on"
      WORKER_TIMER_TRIGGER_KINDS: "offer-expiry,manager-confirmation,no-show,late-clock-in"
      WORKER_OFFER_EXPIRY_INTERVAL_SECONDS: "300"
      WORKER_MANAGER_CONFIRMATION_TIMEOUT_INTERVAL_SECONDS: "120"
      WORKER_LATE_CLOCK_IN_INTERVAL_SECONDS: "300"
      # What the retired launcher gave the jobs child (H1-M1): HOME a path the process can neither write nor create (Node
      # searches $HOME/.node_modules), temp and XDG caches in its own 0700 tmpfs, and the per-instance heartbeat file.
      HOME: /nonexistent
      TMPDIR: /tmp/crewflow-jobs
      XDG_CONFIG_HOME: /tmp/crewflow-jobs/.config
      XDG_CACHE_HOME: /tmp/crewflow-jobs/.cache
      CREWFLOW_INSTANCE_HEALTH_FILE: /run/crewflow-health/jobs/heartbeat.json

    # JOBS-ONLY per-instance health: the bundle health script with the provisioner role off FOR THIS CHECK ONLY (set on the
    # check's own command line, never in the Worker's environment). It reads the heartbeat file this process writes —
    # never rab-api's /healthz and never the global Redis keys another replica would keep fresh.
    healthcheck:
      test: ["CMD", "env", "CREWFLOW_PROVISIONER_ENABLED=false", "node", "/opt/crewflow-bundle/worker-bundle-health.cjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    depends_on:
      rab-redis:
        condition: service_healthy
      # A healthy API means it ran the migrations (or started degraded after a failed upgrade, C3) and registered the job
      # schedulers. restart: true: Compose stops this Worker BEFORE it replaces rab-api, so an old Worker never runs beside
      # a new API (owner decision 2026-11-11).
      rab-api:
        condition: service_healthy
        restart: true

    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # rab-ops — SUPERSEDED (separated mode). Kept unchanged, never started by `up`, until the final clean-up PR (#9) with
  # owner approval. Do not run it against an owner-login deployment.
  # ---------------------------------------------------------------------------
  rab-ops:
    image: ${CREWFLOW_IMAGE_REPOSITORY:-adhin007/adolphus}@${CREWFLOW_IMAGE_TAG:?CREWFLOW_IMAGE_TAG must be the release image index digest (sha256:<64 hex>), never a tag}
    profiles: ["ops"]
    env_file:
      - .env.ops
    environment:
      NODE_ENV: production
      RAB_RUNTIME_ENV: production
      DB_TARGET: production
      AI_ENABLED: 'false'
      HWS_RUNTIME_ENABLED: "false"
    entrypoint: ["node", "packages/rab-server/dist/command/main.js"]
    command: ["--help"]
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The long-form tmpfs is the OpenShip IMPORT GUARD (OpenShip refuses a `type: tmpfs` volume as blocking, so this file
    # can never be imported there). It moved here from the removed rab-migrate (O3); verify-image-compose.cjs requires it.
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 16777216

volumes:
  rab-redis-data:
