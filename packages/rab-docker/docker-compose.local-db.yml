# OWNER-LOGIN DEPLOYMENT — OPTIONAL BUNDLED POSTGRESQL 16. An override for docker-compose.image.yml (and its staging
# override) when the host runs its own database instead of a managed provider:
#
#   docker compose --env-file /etc/crewflow/compose.env -f docker-compose.image.yml -f docker-compose.local-db.yml up -d --wait
#
# Runbook: packages/rab-docker/docs/release/OWNER-LOGIN-DEPLOYMENT.md (sections 2 and 4).
#
# THE ONE-TIME PROVIDER-ADMIN STEP (M0 section 5.1) runs from Agent 1's reviewed, tested SQL file
# packages/rab-docker/postgres-init/owner-login/01-crewflow-owner.sql, mounted as the ONLY init script. The directory is
# never mounted: it also holds transition-from-separated.sql, which must never run on a fresh cluster. The image's
# entrypoint runs it ONCE, on an empty data volume, as the bootstrap superuser over the local socket, connected to
# POSTGRES_DB (crewflow). Interface it relies on (Agent 1): the crewflow_owner password is read from
# /run/secrets/crewflow-owner-password inside the SQL (never a command line or environment variable), and a missing or
# short password fails the init. Everything after it (schema roles, extensions, schema, the chain) is done by the
# application as crewflow_owner.
#
# THE SUPERUSER IS FOR ADMINISTRATION ONLY, NEVER THE APP LOGIN. `postgres` (password from a host secret file, never an env
# file) can connect ONLY over the container's local socket (`docker compose exec rab-postgres psql -U postgres -d crewflow`):
# local-db/pg_hba.conf rejects it from the network outright. PG_DATABASE_URL must name crewflow_owner; the compose gate
# (scripts/compose-owner-login.cjs) fails CI if a rendered app URL names the superuser, and its --lint-env-file mode refuses
# a real env file that does.
#
# TLS IS REQUIRED. NODE_ENV=production makes every Crewflow process demand sslmode=verify-full, so "give a URL" is NOT
# enough for a bundled database either: the operator issues a server certificate whose SAN is the service name
# `rab-postgres` (signed by a CA the operator keeps), places server.crt / server.key in ${CREWFLOW_SECRETS_DIR}/pg-tls/, and
# sets CREWFLOW_PG_CA_FILE=${CREWFLOW_SECRETS_DIR}/pg-tls/ca.crt (mounted into the app containers as
# PG_SSL_CA_CERT_PATH=/run/crewflow/pg-ca.crt). PostgreSQL refuses to start when the key is group/world readable: on a
# Linux host `chown 70:70 server.key && chmod 0600 server.key` (uid 70 = postgres in the alpine image). Docker Desktop bind
# mounts from Windows/macOS paths cannot express this; use a Linux host. pg_hba accepts crewflow_owner ONLY over TLS
# (hostssl, SCRAM) on the crewflow database and rejects every other network login.
#
# PostgreSQL 16 (refuse < 16; PG18 needs Agent 1's PG18 workspace fingerprints first). Pinned by digest.
#
# BACKUP: the app login cannot take a logical backup (FORCE-RLS tables dump empty: M0 G-11). Back up as the superuser over
# the local socket, or snapshot the volume with the stack stopped (runbook section 3.3).

services:

  rab-postgres:
    image: ${CREWFLOW_POSTGRES_IMAGE:?CREWFLOW_POSTGRES_IMAGE must be a PostgreSQL 16 image pinned by digest (repository@sha256:<64 hex>)}
    command:
      - postgres
      - -c
      - hba_file=/etc/crewflow-postgres/pg_hba.conf
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/secrets/pg-tls/server.crt
      - -c
      - ssl_key_file=/run/secrets/pg-tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - password_encryption=scram-sha-256
      - -c
      - listen_addresses=*
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: crewflow
      # Read by the image's entrypoint from the file; the superuser password never sits in an env file or the environment.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-superuser-password
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=reject --data-checksums
    volumes:
      - crewflow-pg-data:/var/lib/postgresql/data
      - ./postgres-init/owner-login/01-crewflow-owner.sql:/docker-entrypoint-initdb.d/01-crewflow-owner.sql:ro
      - ./local-db/pg_hba.conf:/etc/crewflow-postgres/pg_hba.conf:ro
      - ${CREWFLOW_SECRETS_DIR:?CREWFLOW_SECRETS_DIR must name the host secret directory (absolute path)}/pg-tls:/run/secrets/pg-tls:ro
      - ${CREWFLOW_SECRETS_DIR:?CREWFLOW_SECRETS_DIR must name the host secret directory (absolute path)}/postgres-superuser-password:/run/secrets/postgres-superuser-password:ro
      - ${CREWFLOW_SECRETS_DIR:?CREWFLOW_SECRETS_DIR must name the host secret directory (absolute path)}/crewflow-owner-password:/run/secrets/crewflow-owner-password:ro
    # Internal network only: reachable by the app containers by name, never published, no route out.
    networks: [crewflow-db]
    healthcheck:
      # Local socket, peer auth as the container's own postgres user: the server accepts connections AND the one-time
      # admin step completed. If an init script fails, the entrypoint exits, and on restart it finds an initialised data
      # directory and skips the init scripts, so a bare pg_isready would report a database WITHOUT crewflow_owner as
      # healthy. Requiring the role keeps that half-initialised volume unhealthy (fail closed); recovery is in the runbook.
      test:
        - CMD-SHELL
        - "pg_isready -q -h /var/run/postgresql -U postgres -d crewflow && psql -X -h /var/run/postgresql -U postgres -d crewflow -Atc \"select 1 from pg_roles where rolname = 'crewflow_owner' and rolcanlogin\" | grep -qx 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    # SIGINT = PostgreSQL fast shutdown (checkpoint, then exit); give it time before SIGKILL.
    stop_signal: SIGINT
    stop_grace_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'
    # The image's own postgres user (uid/gid 70 in the alpine image): the entrypoint initialises the cluster as that user,
    # so no capability is needed.
    user: '70:70'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70,mode=2775
      - /tmp:uid=70,gid=70,mode=0700
    shm_size: 256m
    pids_limit: 256
    mem_limit: ${CREWFLOW_POSTGRES_MEM_LIMIT:-1024m}
    cpus: ${CREWFLOW_POSTGRES_CPUS:-2}

  # The app services reach the database on the internal network (and keep the default network for egress), and wait for
  # it.
  rab-api:
    networks: [default, crewflow-db]
    depends_on:
      rab-postgres:
        condition: service_healthy

  rab-worker:
    networks: [default, crewflow-db]
    depends_on:
      rab-postgres:
        condition: service_healthy

networks:
  crewflow-db:
    internal: true

volumes:
  crewflow-pg-data: {}
