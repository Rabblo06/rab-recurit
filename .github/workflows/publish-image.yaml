name: publish-image

# Publishes the shared backend image (packages/rab-docker/rab/Dockerfile, final stage `rab` = the API / rab-migrate /
# rab-ops image) to GitHub Container Registry. Runs ONLY when a GitHub release is published or on manual dispatch: never on
# a push or a merge. Since Docker hardening H2 this image has NO Chromium: the Worker image (PDF rendering) is
# packages/rab-docker/rab/Dockerfile.worker-bundle built FROM it; it is built and gated here but not published.
#
# Docker hardening H5: nothing is pushed unless the release-mode image security gate (image-security-gate.yaml) passed
# for linux/amd64 AND linux/arm64 (native runners, no cache). The publish job then pushes THE EXACT gated multi-platform
# index (digests preserved; no rebuild), verifies the registry serves that digest, and attaches a GitHub build-provenance
# attestation. Immutable tags (the release version, sha-<commit>) are never overwritten: if one already points at a
# different digest the job fails. `latest` is the only moving tag (non-prerelease releases only).
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/rabblo06/rab-recurit-server

jobs:
  gate:
    uses: ./.github/workflows/image-security-gate.yaml
    permissions:
      contents: read
      security-events: write
    with:
      mode: release
      platforms: '["linux/amd64","linux/arm64"]'
      export-layouts: true

  publish:
    needs: gate
    if: ${{ needs.gate.result == 'success' }}
    # One publication at a time across ALL refs (two releases of the same commit share sha-<commit>): the immutable-tag
    # check and the push below can never interleave with another run's. The gate builds still run in parallel.
    concurrency:
      group: publish-image-ghcr-rab-recurit-server
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # GITHUB_TOKEN only (no stored secret): packages:write to push to GHCR; id-token + attestations to sign and store the
    # build-provenance attestation. Scoped to this job; the gate jobs never get them.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GATED_DIGEST: ${{ needs.gate.outputs.api-index-digest }}
      EVENT: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - name: Download the gated multi-platform API layout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gated-api-layout
          path: ${{ runner.temp }}/gated
      - name: Verify the layout is exactly what the gate passed
        run: |
          set -euo pipefail
          [[ "$GATED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no gated digest from the gate"; exit 1; }
          python3 - "$RUNNER_TEMP/gated" "$GATED_DIGEST" <<'EOF'
          import hashlib, json, os, sys
          layout, want = sys.argv[1], sys.argv[2]
          top = json.load(open(os.path.join(layout, 'index.json')))['manifests']
          assert len(top) == 1 and top[0]['digest'] == want, f'layout index {top} != gated {want}'
          bad = []
          for name in os.listdir(os.path.join(layout, 'blobs', 'sha256')):
              h = hashlib.sha256()
              with open(os.path.join(layout, 'blobs', 'sha256', name), 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''):
                      h.update(chunk)
              if h.hexdigest() != name:
                  bad.append(name)
          assert not bad, f'corrupt blobs: {bad}'
          print(f'layout verified: {want}')
          EOF
      - name: Tags
        id: tags
        run: |
          set -euo pipefail
          tags="sha-${GITHUB_SHA::12}"
          if [ "$EVENT" = release ]; then
            # Release tags follow the repo's rab/vX.Y.Z naming; anything else is refused rather than guessed.
            if [[ ! "$RELEASE_TAG" =~ ^rab/v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
              echo "::error::release tag '$RELEASE_TAG' is not rab/vX.Y.Z"
              exit 1
            fi
            tags="$tags ${BASH_REMATCH[1]}"
            if [ "$PRERELEASE" != true ]; then tags="$tags latest"; fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "tags: $tags"
      # docker login: skopeo and actions/attest-build-provenance (push-to-registry) both read Docker's credential store.
      - name: Log in to GHCR (GITHUB_TOKEN, never printed)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Refuse to overwrite an immutable tag
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          for t in $TAGS; do
            [ "$t" != latest ] || continue
            if out="$(skopeo inspect --raw "docker://$IMAGE:$t" 2> "$RUNNER_TEMP/inspect.err")"; then
              have="sha256:$(printf '%s' "$out" | sha256sum | cut -d' ' -f1)"
              if [ "$have" != "$GATED_DIGEST" ]; then
                echo "::error::$IMAGE:$t already exists at $have; immutable tags are never overwritten"
                exit 1
              fi
              echo "$IMAGE:$t already points at the gated digest (re-run)"
            elif grep -qiE 'manifest unknown|not found|name unknown' "$RUNNER_TEMP/inspect.err"; then
              echo "$IMAGE:$t is new"
            else
              echo "::error::cannot tell whether $IMAGE:$t exists: $(tail -c 300 "$RUNNER_TEMP/inspect.err")"
              exit 1
            fi
          done
      - name: Push the gated index (digests preserved, no rebuild) and verify the registry serves it
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          for t in $TAGS; do
            skopeo copy --all --preserve-digests --retry-times 3 "oci:$RUNNER_TEMP/gated:gated" "docker://$IMAGE:$t"
            have="sha256:$(skopeo inspect --raw "docker://$IMAGE:$t" | sha256sum | cut -d' ' -f1)"
            if [ "$have" != "$GATED_DIGEST" ]; then
              echo "::error::$IMAGE:$t serves $have, not the gated $GATED_DIGEST"
              exit 1
            fi
            echo "pushed $IMAGE:$t = $GATED_DIGEST"
          done
          {
            echo "### Published $IMAGE@$GATED_DIGEST"
            echo "Tags: $TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build-provenance attestation (GitHub, OIDC-signed)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.GATED_DIGEST }}
          push-to-registry: true
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true
