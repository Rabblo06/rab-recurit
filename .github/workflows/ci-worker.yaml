name: ci-worker

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  test:
    needs: changed
    if: needs.changed.outputs.worker == 'true'
    # PDF integration branch only (integration/pdf-native-pre-removal, CI only): every Worker suite, including the
    # DB-backed specs that render report PDFs (shift-statement, attendance-lifecycle-42, report-email-*, report-storage-*,
    # report-worker-concurrency, worker-scan-adapters, ...), runs once per renderer, each leg on its own fresh database.
    # The chromium leg is the existing run, unchanged.
    name: test (PDF_RENDERER=${{ matrix.pdf_renderer }})
    strategy:
      fail-fast: false
      matrix:
        pdf_renderer: [chromium, native]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      PDF_RENDERER: ${{ matrix.pdf_renderer }}
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      EMAIL_DRIVER: LOGGER
      # PostgreSQL (M2 CI reliability, 2026-10-28): same change as ci-server. No service volume of postgres-init (checkout
      # failed with EACCES) and no rab_owner migration run (refused at the role split). The database is started after
      # checkout and built by the restricted-migrator fresh install; tests get TEST_DATABASE_URL (crewflow_app),
      # TEST_DATABASE_URL_UNPOOLED (bootstrap superuser) and TEST_DATABASE_CREWFLOW_URL (crewflow, provisioner tests).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      # The lint target is `tsc --noEmit`, which resolves @rab/shared and @rab/emails through their built dist: build them
      # first (on GitHub these jobs never got past checkout before, so the missing order was never visible).
      - name: Build the workspace libraries (lint and the migration harness import them)
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - run: npx nx run-many -t lint -p rab-worker,rab-server,rab-shared
      - uses: ./.github/actions/disposable-postgres
      # Owner-login architecture (owner decision 2026-11-04): the suites run on a database built the way every install is
      # now built: the provider SQL (01-crewflow-owner.sql, psql as the cluster superuser) and Agent 1's migrate child as
      # crewflow_owner, followed by the head-state checks (ledger = chain, 1786721330000 absent, B3, reachability, golden
      # posture). The legacy restricted-migrator build (CF-41) keeps its own job in ci-migration-security.yaml until PR #9.
      - name: Build the test database the owner-login way (provider SQL, migrate child, head-state checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts ci-db
        env:
          TWENTY_PG_CONTAINER: disposable-postgres
          TWENTY_CI_DB_FILE: ${{ runner.temp }}/test-database.env
      # The worker renders report PDFs with Playwright's Chromium (queues/rab-reports/render-pdf.util.ts); ci-e2e installs it
      # the same way. Without it reports stay pending and the report-email suites fail.
      - name: Install Playwright Chromium for the PDF renderer
        run: npx playwright install --with-deps chromium
      - name: Worker tests
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          # TEST_DATABASE_URL = crewflow_owner (the one runtime login); TEST_DATABASE_URL_UNPOOLED = the cluster superuser
          # (fixtures only). The Twenty catalogue suites run in ci-twenty-tests.yaml, not here.
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap)"  # a helper refusal fails the step here, not later
          eval "$test_env"
          # The owner password is inside TEST_DATABASE_URL now; the raw value never reaches a test process or the live API.
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD
          # In band: the integration suites share ONE database, and the email/offer dispatchers of one suite claim rows
          # another suite created (first real GitHub run, PR #19). One suite at a time, as the local regression runs them.
          # worker-scan-adapters runs FIRST, alone, on the still-empty database: it drives every real scan cycle UNSCOPED
          # (all tenants, exactly as production does), so its runtime is proportional to every other suite's leftover
          # fixtures. After the other suites, shift-report-scheduler alone renders a roster PDF for each of ~165 leftover
          # live shifts (~170 s measured) and the suite exceeds its 180 s timeout. The other suites deliberately keep their
          # organisations (audit_log FK), so there is no per-suite cleanup that empties the database for it. A rename that
          # makes the first pattern match nothing fails the step ("No tests found"), never silently skips the suite. The second
          # run excludes it with a path regex, NOT --testPathIgnorePatterns (that CLI flag replaces jest.config's list and
          # would start running the __tests__/load suites).
          # Both runs always execute (the first failing must not hide the second's results); the step fails if either did.
          status=0
          npx nx run-many -t test -p rab-worker --runInBand --testTimeout=180000 '--testFile=worker-scan-adapters\.integration' || status=$?
          npx nx run-many -t test -p rab-worker --runInBand --testTimeout=180000 '--testFile=^(?!.*worker-scan-adapters\.integration)' || status=$?
          exit $status
      - run: npx nx run-many -t build -p rab-worker,rab-server,rab-shared,rab-ui
      - uses: ./.github/actions/save-cache
        if: always()
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true
