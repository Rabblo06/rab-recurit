name: ci-worker

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  test:
    needs: changed
    if: needs.changed.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      EMAIL_DRIVER: LOGGER
      # PostgreSQL (M2 CI reliability, 2026-10-28): same change as ci-server. No service volume of postgres-init (checkout
      # failed with EACCES) and no rab_owner migration run (refused at the role split). The database is started after
      # checkout and built by the restricted-migrator fresh install; tests get TEST_DATABASE_URL (crewflow_app),
      # TEST_DATABASE_URL_UNPOOLED (bootstrap superuser) and TEST_DATABASE_CREWFLOW_URL (crewflow, provisioner tests).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # P5 (PDF renderer migration): the Worker renders PDFs natively. Fails if @rab/worker or @rab/server declares or
      # imports a browser package again (tests included). Scoped to those two packages only: the web e2e suite's own
      # @playwright/test (ci-e2e) is not affected. Dependency-free, so it runs before the install.
      - name: No browser dependency in the Worker or the server code it runs
        run: node tools/check-no-browser-in-worker.cjs
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      # The lint target is `tsc --noEmit`, which resolves @rab/shared and @rab/emails through their built dist: build them
      # first (on GitHub these jobs never got past checkout before, so the missing order was never visible).
      - name: Build the workspace libraries (lint and the migration harness import them)
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - run: npx nx run-many -t lint -p rab-worker,rab-server,rab-shared
      - uses: ./.github/actions/disposable-postgres
      - name: Build the test database with the restricted migrator (fresh install, with its security checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json             packages/rab-server/src/database/typeorm/scripts/migration-security-check.ts
        env:
          MIGRATION_SECURITY_SCENARIOS: fresh
          MIGRATION_SECURITY_KEEP_DATABASES: 'true'
          MIGRATION_SECURITY_DB_FILE: ${{ runner.temp }}/test-database.env
      # P5: no browser install. The Worker renders report PDFs natively (queues/rab-reports/render-pdf.util.ts); a test
      # that needed Chromium here would fail, which is the point (check-no-browser-in-worker.cjs above also refuses one).
      - name: Worker tests
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/migration-security-test-env.cjs "$FRESH_DB")"  # a helper refusal fails the step here, not later
          eval "$test_env"
          # In band: the integration suites share ONE database, and the email/offer dispatchers of one suite claim rows
          # another suite created (first real GitHub run, PR #19). One suite at a time, as the local regression runs them.
          # worker-scan-adapters runs FIRST, alone, on the still-empty database: it drives every real scan cycle UNSCOPED
          # (all tenants, exactly as production does), so its runtime is proportional to every other suite's leftover
          # fixtures. After the other suites, shift-report-scheduler alone renders a roster PDF for each of ~165 leftover
          # live shifts (~170 s measured) and the suite exceeds its 180 s timeout. The other suites deliberately keep their
          # organisations (audit_log FK), so there is no per-suite cleanup that empties the database for it. A rename that
          # makes the first pattern match nothing fails the step ("No tests found"), never silently skips the suite. The second
          # run excludes it with a path regex, NOT --testPathIgnorePatterns (that CLI flag replaces jest.config's list and
          # would start running the __tests__/load suites).
          npx nx run-many -t test -p rab-worker --runInBand --testTimeout=180000 '--testFile=worker-scan-adapters\.integration'
          npx nx run-many -t test -p rab-worker --runInBand --testTimeout=180000 '--testFile=^(?!.*worker-scan-adapters\.integration)'
      - run: npx nx run-many -t build -p rab-worker,rab-server,rab-shared,rab-ui
      - uses: ./.github/actions/save-cache
        if: always()
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true

  # E5 (Twenty Mode M0-H, 2026-11-04): the gated Phase D suites, in SEPARATED mode, on a database the restricted migrator
  # built. Before E5 every one of them reported "skipped" in CI: PHASE_D_SQL_APPROVED and TEST_DATABASE_WORKER_URL were
  # never set, and the harness gave crewflow_worker a random password nobody else knew. Now disposable-postgres exports
  # CREWFLOW_WORKER_BOOTSTRAP_PASSWORD, the harness creates crewflow_worker with it (the reviewed operator bootstrap step),
  # and migration-security-test-env.cjs --with-worker-login emits TEST_DATABASE_WORKER_URL for this job only.
  # PHASE_D_D5=before ONLY: 1786721330000 (gated-migrations/, never in the chain) stays excluded; the job asserts that the
  # ledger does not contain it and phase-d-ci-suite-check.cjs refuses any other PHASE_D_D5 value. That checker also proves
  # the required suites actually ran (passed > 0) rather than skipped, from jest's JSON result.
  phase-d:
    needs: changed
    if: needs.changed.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      EMAIL_DRIVER: LOGGER
      PHASE_D_SQL_APPROVED: 'true'
      PHASE_D_D5: before
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - name: Build the workspace libraries (the migration harness imports them)
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - uses: ./.github/actions/disposable-postgres
      - name: Build the test database with the restricted migrator (fresh install, with its security checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json             packages/rab-server/src/database/typeorm/scripts/migration-security-check.ts
        env:
          MIGRATION_SECURITY_SCENARIOS: fresh
          MIGRATION_SECURITY_KEEP_DATABASES: 'true'
          MIGRATION_SECURITY_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: The gated migration 1786721330000 is NOT in the ledger (PHASE_D_D5=before is the real state)
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          applied="$(docker exec disposable-postgres psql -U ci_bootstrap -d "$FRESH_DB" -tAc \
            "SELECT count(*) FROM core.migrations WHERE timestamp = 1786721330000 OR name LIKE '%1786721330000%'")"
          phase_d="$(docker exec disposable-postgres psql -U ci_bootstrap -d "$FRESH_DB" -tAc \
            "SELECT count(*) FROM core.migrations WHERE timestamp IN (1786721300000, 1786721310000, 1786721320000, 1786721340000, 1786721350000)")"
          worker="$(docker exec disposable-postgres psql -U ci_bootstrap -d "$FRESH_DB" -tAc \
            "SELECT count(*) FROM pg_roles WHERE rolname = 'crewflow_worker' AND rolcanlogin AND NOT rolsuper AND NOT rolbypassrls")"
          echo "1786721330000 applied: ${applied}; approved Phase D migrations applied: ${phase_d}/5; crewflow_worker login: ${worker}"
          [ "$applied" = 0 ] || { echo "1786721330000 is in the ledger: refusing" >&2; exit 1; }
          [ "$phase_d" = 5 ] || { echo "the approved Phase D migrations are not all applied" >&2; exit 1; }
          [ "$worker" = 1 ] || { echo "crewflow_worker is missing or has the wrong shape" >&2; exit 1; }
      # Same reason as the test job above: the shift-statement processors these suites drive render PDFs with Playwright's
      # Chromium. Goes away with the PDF Chromium removal (#61/#62), together with the test job's copy.
      - name: Install Playwright Chromium for the PDF renderer
        run: npx playwright install --with-deps chromium
      - name: Phase D server suites (crewflow_worker login, separated mode)
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/migration-security-test-env.cjs "$FRESH_DB" --with-worker-login)"
          eval "$test_env"
          # --skip-nx-cache: the opt-in lives in the environment, which is not part of nx's task hash; a replayed result
          # from a run without it would be a "skipped" run reported as green, the exact failure E5 exists to remove.
          status=0
          npx nx run-many -t test -p rab-server --skip-nx-cache --runInBand --testTimeout=180000 \
            '--testFile=(phase-d-|worker-identity-boot-gates\.integration)' \
            --json "--outputFile=${RUNNER_TEMP}/phase-d-server.json" || status=$?
          node packages/rab-server/src/database/typeorm/scripts/phase-d-ci-suite-check.cjs server "${RUNNER_TEMP}/phase-d-server.json"
          exit $status
      - name: Phase D worker suites (crewflow_worker login, WORKER_CLAIM_MODE=global, separated mode)
        if: success() || failure()
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/migration-security-test-env.cjs "$FRESH_DB" --with-worker-login)"
          eval "$test_env"
          status=0
          npx nx run-many -t test -p rab-worker --skip-nx-cache --runInBand --testTimeout=180000 \
            '--testFile=(phase-d-|dq4b-timer-triggers\.integration|push-dispatch-global-publish-failure\.integration)' \
            --json "--outputFile=${RUNNER_TEMP}/phase-d-worker.json" || status=$?
          node packages/rab-server/src/database/typeorm/scripts/phase-d-ci-suite-check.cjs worker "${RUNNER_TEMP}/phase-d-worker.json"
          exit $status
      - uses: ./.github/actions/save-cache
        if: always()
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true
