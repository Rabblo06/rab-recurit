name: ci-worker

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  test:
    needs: changed
    if: needs.changed.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        # redis:7-alpine index digest, read 2026-11-18 (7.4.12); equal to .github/ci-images/redis (Dependabot renews both)
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      EMAIL_DRIVER: LOGGER
      # X3.3 (XR-14): production runs only WORKER_SCHEDULER=bullmq (env.validation.ts refuses interval there); NODE_ENV=test
      # would otherwise default to interval. This sets the value env validation sees; no suite boots main.ts from
      # process.env. The bullmq scheduler path itself is covered by scheduler-registration.spec and
      # bullmq-scheduler.integration.spec, which pass an explicit env.
      WORKER_SCHEDULER: bullmq
      # PostgreSQL (M2 CI reliability, 2026-10-28): same change as ci-server. No service volume of postgres-init (checkout
      # failed with EACCES) and no rab_owner migration run (refused at the role split). The database is started after
      # checkout and built by the restricted-migrator fresh install; tests get TEST_DATABASE_URL (crewflow_app),
      # TEST_DATABASE_URL_UNPOOLED (bootstrap superuser) and TEST_DATABASE_CREWFLOW_URL (crewflow, provisioner tests).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # P5 (PDF renderer migration): the Worker renders PDFs natively. Fails if @rab/worker or @rab/server declares or
      # imports a browser package again (tests included). Scoped to those two packages only: the web e2e suite's own
      # @playwright/test (ci-e2e) is not affected. Dependency-free, so it runs before the install.
      - name: No browser dependency in the Worker or the server code it runs
        run: node tools/check-no-browser-in-worker.cjs
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      # lint and test get their library builds from Nx (nx.json: `dependsOn: ["^build"]`). This step stays because the
      # test-database harness below runs on ts-node outside Nx and imports @rab/shared and @rab/emails through their built dist.
      - name: Build the workspace libraries (the migration harness imports them)
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - run: npx nx run-many -t lint -p rab-worker,rab-server,rab-shared
      - uses: ./.github/actions/disposable-postgres
      # Owner-login architecture (owner decision 2026-11-04): the suites run on a database built the way every install is
      # now built: the provider SQL (01-crewflow-owner.sql, psql as the cluster superuser) and Agent 1's migrate child as
      # crewflow_owner, followed by the head-state checks (ledger = chain, 1786721330000 absent, B3, reachability, golden
      # posture). The legacy restricted-migrator build (CF-41) keeps its own job in ci-migration-security.yaml until PR #9.
      - name: Build the test database the owner-login way (provider SQL, migrate child, head-state checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts ci-db
        env:
          TWENTY_PG_CONTAINER: disposable-postgres
          TWENTY_CI_DB_FILE: ${{ runner.temp }}/test-database.env
      # P5: no browser install. The Worker renders report PDFs natively (queues/rab-reports/render-pdf.util.ts); a test
      # that needed Chromium here would fail, which is the point (check-no-browser-in-worker.cjs above also refuses one).
      - name: Worker tests
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          # TEST_DATABASE_URL = crewflow_owner (the one runtime login); TEST_DATABASE_URL_UNPOOLED = the cluster superuser
          # (fixtures only). The Twenty catalogue suites run in ci-twenty-tests.yaml, not here.
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap)"  # a helper refusal fails the step here, not later
          eval "$test_env"
          # The owner password is inside TEST_DATABASE_URL now; the raw value never reaches a test process or the live API.
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD CREWFLOW_WORKER_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD CREWFLOW_BOOTSTRAP_PASSWORD
          # In band: the integration suites share ONE database, and the email/offer dispatchers of one suite claim rows
          # another suite created (first real GitHub run, PR #19). One suite at a time, as the local regression runs them.
          # worker-scan-adapters runs FIRST, alone, on the still-empty database: it drives every real scan cycle UNSCOPED
          # (all tenants, exactly as production does), so its runtime is proportional to every other suite's leftover
          # fixtures. After the other suites, shift-report-scheduler alone renders a roster PDF for each of ~165 leftover
          # live shifts (~170 s measured) and the suite exceeds its 180 s timeout. The other suites deliberately keep their
          # organisations (audit_log FK), so there is no per-suite cleanup that empties the database for it. A rename that
          # makes the first pattern match nothing fails the step ("No tests found"), never silently skips the suite. The second
          # run excludes it with a path regex, NOT --testPathIgnorePatterns (that CLI flag replaces jest.config's list and
          # would start running the __tests__/load suites).
          # Both runs always execute (the first failing must not hide the second's results); the step fails if either did.
          status=0
          mkdir -p "${RUNNER_TEMP}/jest-results"
          npx nx run-many -t test -p rab-worker --runInBand --testTimeout=180000 --output-style=stream '--testFile=worker-scan-adapters\.integration' \
            --json "--outputFile=${RUNNER_TEMP}/jest-results/worker-scan-adapters.json" || status=$?
          npx nx run-many -t test -p rab-worker --runInBand --testTimeout=180000 --output-style=stream '--testFile=^(?!.*worker-scan-adapters\.integration)' \
            --json "--outputFile=${RUNNER_TEMP}/jest-results/worker-rest.json" || status=$?
          node -e 'const fs=require("fs");for(const f of process.argv.slice(1)){if(!fs.existsSync(f)){console.log(`no jest result: ${f}`);continue}const r=JSON.parse(fs.readFileSync(f,"utf8"));for(const t of r.testResults){const n=s=>t.assertionResults.filter(a=>a.status===s).length;const name=t.name.split(/[\\/]/).slice(-2).join("/");if(t.status!=="passed"||n("failed"))console.log(`FAILED-FILE ${name} passed=${n("passed")} failed=${n("failed")}${t.testExecError||(!t.assertionResults.length&&t.failureMessage)?" (file failed to run)":""}`)}console.log(`jest ${f.split(/[\\/]/).pop()}: suites=${r.numTotalTestSuites} failedSuites=${r.numFailedTestSuites} tests=${r.numTotalTests} failed=${r.numFailedTests}`)}' "${RUNNER_TEMP}"/jest-results/*.json
          exit $status
      - run: npx nx run-many -t build -p rab-worker,rab-server,rab-shared,rab-ui
      - uses: ./.github/actions/save-cache
        if: always()
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true

  # E5 (Twenty Mode M0-H, 2026-11-04): the gated Phase D suites, in SEPARATED mode, on a database the restricted migrator
  # built. Before E5 every one of them reported "skipped" in CI: PHASE_D_SQL_APPROVED and TEST_DATABASE_WORKER_URL were
  # never set, and the harness gave crewflow_worker a random password nobody else knew. Now disposable-postgres exports
  # CREWFLOW_WORKER_BOOTSTRAP_PASSWORD, the harness creates crewflow_worker with it (the reviewed operator bootstrap step),
  # and migration-security-test-env.cjs --with-worker-login emits TEST_DATABASE_WORKER_URL for this job only.
  # PHASE_D_D5=before ONLY: 1786721330000 (gated-migrations/, never in the chain) stays excluded; the job asserts that the
  # ledger does not contain it and phase-d-ci-suite-check.cjs refuses any other PHASE_D_D5 value. That checker also proves
  # the required suites actually ran (passed > 0) rather than skipped, from jest's JSON result.
  phase-d:
    needs: changed
    if: needs.changed.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        # redis:7-alpine index digest, read 2026-11-18 (7.4.12); equal to .github/ci-images/redis (Dependabot renews both)
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      EMAIL_DRIVER: LOGGER
      # X3.3 (XR-14): the production scheduler mode, as in the test job above.
      WORKER_SCHEDULER: bullmq
      PHASE_D_SQL_APPROVED: 'true'
      PHASE_D_D5: before
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - name: Build the workspace libraries (the database build imports them)
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - uses: ./.github/actions/disposable-postgres
      # Owner-login architecture: E5's gated Phase D suites now run "Phase D under one login" (M0-H F2). The in-place gates
      # accept only crewflow_owner, so the separated crewflow_worker login is refused at Worker boot (deploy 852c8991:
      # "connects as crewflow_worker, a schema role ... Every process connects as crewflow_owner"). The database is the
      # owner-login install (ci-db) and TEST_DATABASE_WORKER_URL is the owner URL (twenty-test-env.cjs
      # --worker-login-is-owner). Suites that assert the separated crewflow_worker identity or its exclusive privileges are
      # I/P-class differences: they are migrated through the behaviour-change catalogue (BC-08/BC-10), never flipped.
      - name: Build the test database the owner-login way (provider SQL, migrate child, head-state checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts ci-db
        env:
          TWENTY_PG_CONTAINER: disposable-postgres
          TWENTY_CI_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: The gated migration 1786721330000 is NOT in the ledger (PHASE_D_D5=before is the real state)
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          applied="$(docker exec disposable-postgres psql -U ci_bootstrap -d "$OWNER_DB" -tAc \
            "SELECT count(*) FROM core.migrations WHERE timestamp = 1786721330000 OR name LIKE '%1786721330000%'")"
          phase_d="$(docker exec disposable-postgres psql -U ci_bootstrap -d "$OWNER_DB" -tAc \
            "SELECT count(*) FROM core.migrations WHERE timestamp IN (1786721300000, 1786721310000, 1786721320000, 1786721340000, 1786721350000)")"
          worker="$(docker exec disposable-postgres psql -U ci_bootstrap -d "$OWNER_DB" -tAc \
            "SELECT count(*) FROM pg_roles r WHERE r.rolname = 'crewflow_worker' AND NOT r.rolsuper AND NOT r.rolbypassrls AND NOT EXISTS (SELECT 1 FROM pg_auth_members m WHERE m.roleid = r.oid)")"
          echo "1786721330000 applied: ${applied}; approved Phase D migrations applied: ${phase_d}/5; crewflow_worker schema role with 0 members: ${worker}"
          [ "$applied" = 0 ] || { echo "1786721330000 is in the ledger: refusing" >&2; exit 1; }
          [ "$phase_d" = 5 ] || { echo "the approved Phase D migrations are not all applied" >&2; exit 1; }
          [ "$worker" = 1 ] || { echo "crewflow_worker is missing, privileged or has members (B3)" >&2; exit 1; }
      # P5: no browser install; the Worker renders report PDFs natively.
      - name: Phase D server suites (one owner login)
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap --worker-login-is-owner)"
          eval "$test_env"
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD CREWFLOW_WORKER_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD CREWFLOW_BOOTSTRAP_PASSWORD
          # --skip-nx-cache: the opt-in lives in the environment, which is not part of nx's task hash; a replayed result
          # from a run without it would be a "skipped" run reported as green, the exact failure E5 exists to remove.
          status=0
          npx nx run-many -t test -p rab-server --skip-nx-cache --runInBand --testTimeout=180000 '--testFile=phase-d-' --json "--outputFile=${RUNNER_TEMP}/phase-d-server.json" || status=$?
          node packages/rab-server/src/database/typeorm/scripts/phase-d-ci-suite-check.cjs server "${RUNNER_TEMP}/phase-d-server.json" || status=1
          exit $status
      - name: Phase D worker suites (one owner login, WORKER_CLAIM_MODE=global)
        if: success() || failure()
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap --worker-login-is-owner)"
          eval "$test_env"
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD CREWFLOW_WORKER_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD CREWFLOW_BOOTSTRAP_PASSWORD
          status=0
          npx nx run-many -t test -p rab-worker --skip-nx-cache --runInBand --testTimeout=180000 '--testFile=(phase-d-|dq4b-timer-triggers\.integration|push-dispatch-global-publish-failure\.integration)' --json "--outputFile=${RUNNER_TEMP}/phase-d-worker.json" || status=$?
          node packages/rab-server/src/database/typeorm/scripts/phase-d-ci-suite-check.cjs worker "${RUNNER_TEMP}/phase-d-worker.json" || status=1
          exit $status
      - uses: ./.github/actions/save-cache
        if: always()
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true

  # Part C1: the legacy HWS OFF mode for the Worker suites, until C4 (see ci-server.yaml test-hws-off).
  test-hws-off:
    needs: changed
    if: needs.changed.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        # redis:7-alpine index digest, read 2026-11-18 (7.4.12); equal to .github/ci-images/redis (Dependabot renews both)
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      EMAIL_DRIVER: LOGGER
      WORKER_SCHEDULER: bullmq
      HWS_RUNTIME_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - name: Build the workspace libraries
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - uses: ./.github/actions/disposable-postgres
      - name: Build the test database the owner-login way (provider SQL, migrate child, head-state checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts ci-db
        env:
          TWENTY_PG_CONTAINER: disposable-postgres
          TWENTY_CI_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: Worker tests, HWS OFF
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap)"
          eval "$test_env"
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD CREWFLOW_WORKER_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD CREWFLOW_BOOTSTRAP_PASSWORD
          status=0
          npx nx run-many -t test -p rab-worker --skip-nx-cache --runInBand --testTimeout=180000 --output-style=stream '--testFile=worker-scan-adapters\.integration' || status=$?
          npx nx run-many -t test -p rab-worker --skip-nx-cache --runInBand --testTimeout=180000 --output-style=stream '--testFile=^(?!.*worker-scan-adapters\.integration)' || status=$?
          exit $status
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true

  # Part C2 (HWS-AUDIT-C2-SIZING.md §7 layer 2): the worker suites with every binder binding search_path = '' (the test-only
  # trap CREWFLOW_TEST_SEARCH_PATH_TRAP, refused outside NODE_ENV=test). Any unqualified table then fails with 42P01.
  # REQUIRED since C2-7 (the ratchet baseline is empty and every suite passes under the trap): a failure fails the workflow.
  # The owner adds "test-search-path-trap" (ci-worker) to branch protection.
  test-search-path-trap:
    needs: changed
    if: needs.changed.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      redis:
        # redis:7-alpine index digest, read 2026-11-18 (7.4.12); equal to .github/ci-images/redis (Dependabot renews both)
        image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      EMAIL_DRIVER: LOGGER
      WORKER_SCHEDULER: bullmq
      CREWFLOW_TEST_SEARCH_PATH_TRAP: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - name: Build the workspace libraries
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - uses: ./.github/actions/disposable-postgres
      - name: Build the test database the owner-login way (provider SQL, migrate child, head-state checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts ci-db
        env:
          TWENTY_PG_CONTAINER: disposable-postgres
          TWENTY_CI_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: Worker tests under the search_path trap
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap)"
          eval "$test_env"
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD CREWFLOW_WORKER_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD CREWFLOW_BOOTSTRAP_PASSWORD
          status=0
          npx nx run-many -t test -p rab-worker --skip-nx-cache --runInBand --testTimeout=180000 --output-style=stream '--testFile=worker-scan-adapters\.integration' || status=$?
          npx nx run-many -t test -p rab-worker --skip-nx-cache --runInBand --testTimeout=180000 --output-style=stream '--testFile=^(?!.*worker-scan-adapters\.integration)' || status=$?
          exit $status
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true

  # One always-reporting status for branch protection. A skipped matrix job never reports its expanded names
  # ("test (1)", ...), so a PR the change filter skips could never satisfy those required checks. This job always runs:
  # it fails if a required job failed or was cancelled, and accepts "skipped" only when `changed` succeeded and its
  # filter output(s) (worker) said there was nothing to run; when the filter said run, every job must succeed.
  ci-worker-gate:
    name: ci-worker gate
    needs: [changed, test, test-hws-off, phase-d, test-search-path-trap]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required ci-worker job succeeded, or was skipped by the change filter
        env:
          RESULTS: ${{ toJSON(needs) }}
          # The changed-files outputs this workflow's `if:` conditions read: the suites run when any of them is 'true'.
          FILTER_OUTPUTS: worker
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          keys = os.environ['FILTER_OUTPUTS'].split()
          for k, v in sorted(needs.items()):
              print(f"{k}: {v['result']}")
          changed = needs.get('changed') or {}
          if changed.get('result') != 'success':
              print(f"::error::change detection did not succeed ({changed.get('result')}): cannot tell a skip from a job that never ran")
              sys.exit(1)
          outputs = changed.get('outputs') or {}
          flags = {k: outputs.get(k) for k in keys}
          print(f"change filter outputs: {flags}")
          if not flags or any(v not in ('true', 'false') for v in flags.values()):
              print(f"::error::change filter outputs are missing or not 'true'/'false': {flags}")
              sys.exit(1)
          should_run = 'true' in flags.values()
          allowed = ('success',) if should_run else ('success', 'skipped')
          jobs = {k: v['result'] for k, v in needs.items() if k != 'changed'}
          bad = {k: r for k, r in jobs.items() if r not in allowed}
          if not jobs or bad:
              print(f"::error::required jobs did not {'succeed' if should_run else 'succeed or skip'}: {bad}")
              sys.exit(1)
          print('the change filter ' + ('ran the suites and every one succeeded' if should_run else 'skipped the suites (no relevant change)'))
          EOF
