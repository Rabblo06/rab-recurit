name: ci-worker

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  test:
    needs: changed
    if: needs.changed.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      EMAIL_DRIVER: LOGGER
      # PostgreSQL (M2 CI reliability, 2026-10-28): same change as ci-server. No service volume of postgres-init (checkout
      # failed with EACCES) and no rab_owner migration run (refused at the role split). The database is started after
      # checkout and built by the restricted-migrator fresh install; tests get TEST_DATABASE_URL (crewflow_app),
      # TEST_DATABASE_URL_UNPOOLED (bootstrap superuser) and TEST_DATABASE_CREWFLOW_URL (crewflow, provisioner tests).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - run: npx nx run-many -t lint -p rab-worker,rab-server,rab-shared
      - uses: ./.github/actions/disposable-postgres
      - name: Build the workspace libraries the migration harness imports
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - name: Build the test database with the restricted migrator (fresh install, with its security checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json             packages/rab-server/src/database/typeorm/scripts/migration-security-check.ts
        env:
          MIGRATION_SECURITY_SCENARIOS: fresh
          MIGRATION_SECURITY_KEEP_DATABASES: 'true'
          MIGRATION_SECURITY_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: Worker tests
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/migration-security-test-env.cjs "$FRESH_DB")"  # a helper refusal fails the step here, not later
          eval "$test_env"
          npx nx run-many -t test -p rab-worker
      - run: npx nx run-many -t build -p rab-worker,rab-server,rab-shared,rab-ui
      - uses: ./.github/actions/save-cache
        if: always()
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true
