name: ci-worker

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  test:
    needs: changed
    if: needs.changed.outputs.worker == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rab
          POSTGRES_PASSWORD: rab
          POSTGRES_DB: rab
        ports: ['5432:5432']
        # Bootstraps rab_owner/rab_app (packages/rab-docker/postgres-init) so
        # this job's DATABASE_URL matches the real role model — same as
        # ci-server.yaml's own identical setup.
        volumes:
          - ${{ github.workspace }}/packages/rab-docker/postgres-init:/docker-entrypoint-initdb.d
        options: >-
          --health-cmd "pg_isready -U rab -d rab" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      # rab_app (restricted, NOBYPASSRLS) — matches what AppModule's own
      # primary DataSource connects as (core.datasource.ts reads
      # DATABASE_URL only), the same role the deployed worker is required
      # to run as (assertRuntimeDbRole(..., 'worker') in
      # packages/rab-worker/src/main.ts). See ci-server.yaml's own comment
      # for the full reasoning — the same "app runs as owner in CI" gap this
      # fixes there applies identically here.
      DATABASE_URL: postgres://rab_app:rab_app_dev_only@localhost:5432/rab
      # Read by createAdminDataSource() (test fixture bootstrap) AND by the
      # worker's own cross-org maintenance jobs (email-dispatch,
      # account-invite-cleanup, storage-cleanup) — same convention as local
      # dev's docker-compose.yml `worker` service.
      DATABASE_URL_UNPOOLED: postgres://rab_owner:rab_owner_dev_only@localhost:5432/rab
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-test-secret-please-do-not-use-in-prod-000000
      EMAIL_DRIVER: LOGGER
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - run: npx nx run-many -t lint -p rab-worker,rab-server,rab-shared
      - run: npx nx run rab-server:migration:run
        env:
          DATABASE_URL: postgres://rab_owner:rab_owner_dev_only@localhost:5432/rab
      - run: npx nx run-many -t test -p rab-worker
      - run: npx nx run-many -t build -p rab-worker,rab-server,rab-shared,rab-ui
      - uses: ./.github/actions/save-cache
        if: always()
