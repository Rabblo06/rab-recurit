name: ci-e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  web:
    needs: changed
    if: needs.changed.outputs.front == 'true' || needs.changed.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - run: npx nx run-many -t build -p rab-shared,rab-ui
      - run: npx playwright install --with-deps chromium
        working-directory: packages/rab-e2e-testing
      - run: npx nx e2e rab-e2e-testing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: ./.github/actions/save-cache
        if: always()

  # Mobile E2E (Maestro) needs a device/simulator farm — not wired into CI
  # until the mobile app has real screens to exercise (M3+).
