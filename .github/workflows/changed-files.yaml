name: Changed files

on:
  workflow_call:
    outputs:
      server:
        value: ${{ jobs.filter.outputs.server }}
      worker:
        value: ${{ jobs.filter.outputs.worker }}
      front:
        value: ${{ jobs.filter.outputs.front }}
      mobile:
        value: ${{ jobs.filter.outputs.mobile }}
      shared:
        value: ${{ jobs.filter.outputs.shared }}
      ui:
        value: ${{ jobs.filter.outputs.ui }}
      docker:
        value: ${{ jobs.filter.outputs.docker }}
      e2e:
        value: ${{ jobs.filter.outputs.e2e }}

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      worker: ${{ steps.filter.outputs.worker }}
      front: ${{ steps.filter.outputs.front }}
      mobile: ${{ steps.filter.outputs.mobile }}
      shared: ${{ steps.filter.outputs.shared }}
      ui: ${{ steps.filter.outputs.ui }}
      docker: ${{ steps.filter.outputs.docker }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          filters: |
            # The Node version every CI job runs (setup-node reads .nvmrc in .github/actions/yarn-install): a change to it
            # must re-run every suite on the new Node, so it counts as a change to every package below (and to e2e).
            toolchain: &toolchain
              - '.nvmrc'
            # Root Node manifests and shared build/test configuration: a dependency bump or a config change alters what every
            # Node suite compiles and runs, so it re-runs each of them (the Flutter app is unaffected and is not included).
            node: &node
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - 'yarn.config.cjs'
              - 'tsconfig.base.json'
              - 'jest.preset.js'
            # CI wiring every Node job runs through (this filter and the composite actions: yarn-install, restore-cache,
            # disposable-postgres, ...): a change to it must run the suites it wires.
            ci-wiring: &ciwiring
              - '.github/workflows/changed-files.yaml'
              - '.github/actions/**'
            # Source of each package plus everything it imports (the Nx project graph: server -> shared, emails;
            # worker -> server; front -> shared, ui). The *-lib keys are anchors; the outputs below add the triggers that
            # must not spread to other packages (root manifests, CI wiring, the package's own workflow file).
            shared-lib: &shared
              - *toolchain
              - 'packages/rab-shared/**'
            ui-lib: &ui
              - *toolchain
              - 'packages/rab-ui/**'
            # rab-server depends on @rab/emails (packages/rab-server/package.json): an email-template change must run the
            # server (and so the Worker) suites. Before this, a PR touching only packages/rab-emails/** ran no server CI.
            emails-lib: &emails
              - *toolchain
              - 'packages/rab-emails/**'
            server-lib: &server
              - *shared
              - *emails
              - 'packages/rab-server/**'
            shared:
              - *shared
              - *node
              - *ciwiring
              - '.github/workflows/ci-shared.yaml'
            ui:
              - *ui
              - *node
              - *ciwiring
              - '.github/workflows/ci-ui.yaml'
            server:
              - *server
              - *node
              - *ciwiring
              - '.github/workflows/ci-server.yaml'
            worker:
              - *server
              - 'packages/rab-worker/**'
              - *node
              - *ciwiring
              # X3.3: a change to the Worker CI itself (or to this filter) must run the Worker CI.
              - '.github/workflows/ci-worker.yaml'
            front:
              - *shared
              - *ui
              - 'packages/rab-front/**'
              - *node
              - *ciwiring
              - '.github/workflows/ci-front.yaml'
            mobile:
              - *shared
              - *ui
              - 'packages/rab-mobile/**'
            # Root dependency manifests are copied into the image's install stage: a change there must also build and
            # gate linux/arm64 on the PR (CodeRabbit, PR #41).
            docker:
              - 'packages/rab-docker/**'
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'
              - '.yarn/**'
              - '.dockerignore'
              - 'packages/rab-server/**'
              - 'packages/rab-worker/**'
              - 'packages/rab-shared/**'
              - 'packages/rab-ui/**'
              - 'packages/rab-emails/**'
            # The e2e package itself, the fixtures its AI visual suites load, and the CI wiring that runs it: a change
            # to any of these must run ci-e2e even when no application package changed.
            e2e:
              - *toolchain
              - 'packages/rab-e2e-testing/**'
              - 'packages/rab-docs/tools/web/**'
              - '.github/workflows/ci-e2e.yaml'
              - '.github/workflows/changed-files.yaml'
              - '.github/actions/**'
              - 'package.json'
              - 'yarn.lock'
