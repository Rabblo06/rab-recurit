name: ci-security

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/yarn-install
      - name: yarn npm audit (high+)
        run: yarn npm audit --severity high --all --recursive

  constraints-and-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/yarn-install
      - name: Yarn constraints (dependency version drift)
        run: yarn constraints
      # The previous `license-checker --production` from the root only ever looked at the private workspace root (no runtime
      # dependencies of its own) and failed on its UNLICENSED marker; it checked no third-party package. This walks the real
      # production dependency closure of every shipped workspace and checks every third-party licence (PR #19).
      - name: Licence allowlist (third-party production dependencies of every shipped workspace)
        run: node tools/check-licences.mjs

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3

  rls-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379
    # PostgreSQL (M2 CI reliability, 2026-10-28): no longer a service with postgres-init mounted from the workspace (it
    # starts before checkout, so Docker created that directory as root and checkout failed with EACCES), and no longer
    # migrated as the rab_owner login (the role split refuses it under CF-41; rab_app is NOLOGIN since). The database is
    # started after checkout and built by the M2 harness's restricted-migrator fresh install; the gate then runs as
    # crewflow_app, the restricted NOBYPASSRLS runtime login, exactly as before in intent (check-rls-coverage.ts asserts
    # current_user = crewflow_app and rolbypassrls = false).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/disposable-postgres
      - name: Build the workspace libraries the migration harness imports
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - name: Build the database with the restricted migrator (fresh install, with its security checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json             packages/rab-server/src/database/typeorm/scripts/migration-security-check.ts
        env:
          MIGRATION_SECURITY_SCENARIOS: fresh
          MIGRATION_SECURITY_KEEP_DATABASES: 'true'
          MIGRATION_SECURITY_DB_FILE: ${{ runner.temp }}/rls-database.env
      - name: FORCE RLS coverage as crewflow_app
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/rls-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/migration-security-test-env.cjs "$FRESH_DB")"  # a helper refusal fails the step here, not later
          eval "$test_env"
          # Phase B: the connection factory's one variable (the deprecated DATABASE_URL is no longer passed).
          PG_DATABASE_URL="$TEST_DATABASE_URL" yarn check-rls
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true

  # Phase B (B6-A/B7): the deployment configuration, without a database: the API start scripts (api-prestart.sh / start.sh
  # never migrate, refuse migration credentials), the Worker bundle launcher (PG_* forwarding, legacy names refused in
  # production, the provisioner child's own PG_DATABASE_URL), every committed compose definition fed to the real launcher,
  # and the compose credential isolation (the migration login reaches rab-migrate only; rab-api / rab-worker wait for it).
  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - name: API start shell tests (api-prestart.sh, start.sh)
        run: node packages/rab-docker/rab/api-prestart-test/run-prestart-shell-tests.cjs
      - name: Worker bundle launcher and committed deployment definitions
        run: node --test packages/rab-docker/rab/worker-bundle/test/launcher.test.cjs packages/rab-docker/rab/worker-bundle/test/deployment-provisioner.test.cjs
      - name: Compose credential isolation (docker compose config)
        run: node packages/rab-docker/scripts/compose-credential-isolation.cjs
      # Docker hardening H5: the H1-L1 apk-option check (no `apk -X…/--rep…/--allow-u…/--keys-dir` in a Dockerfile) now runs
      # in image-security-gate.yaml's static job, which the image-gate job below (and every release) calls.

  # Docker hardening H5: replaces the former `trivy` job. Builds the API and Worker images exactly as a release would
  # (no cache, SBOM + provenance, nothing pushed) and gates the built images: floors, privileges, writable code paths,
  # dev packages, Trivy + Grype, layer secrets, SBOM/provenance, manifest. Mode pr: fixable High/Critical and every
  # structural check fail the PR; release-only items (unfixed High/Critical without an owner decision, H3's
  # development packages, the unpinned Dockerfile frontend) are reported as HOLD (NEEDS OWNER APPROVAL) and block a
  # release. arm64 (native runner) is added when the Docker inputs change; every release gates both architectures.
  changes:
    uses: ./.github/workflows/changed-files.yaml

  image-gate:
    needs: changes
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/image-security-gate.yaml
    permissions:
      contents: read
      security-events: write
    with:
      mode: release
      platforms: ${{ needs.changes.outputs.docker == 'true' && '["linux/amd64","linux/arm64"]' || '["linux/amd64"]' }}

  # One required status for the whole workflow: fails if any job above failed, was cancelled or was skipped.
  ci-security-gate:
    name: ci-security gate
    # `changes` too: if change detection fails, the image gate falls back to amd64 only, which must not read as passed.
    needs: [audit, constraints-and-licenses, gitleaks, codeql, rls-coverage, deployment-config, changes, image-gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required ci-security job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          bad = {k: v['result'] for k, v in needs.items() if v['result'] != 'success'}
          for k, v in sorted(needs.items()):
              print(f"{k}: {v['result']}")
          if bad:
              print(f"::error::ci-security: required jobs did not succeed: {bad}")
              sys.exit(1)
          EOF
