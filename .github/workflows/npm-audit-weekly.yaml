name: npm-audit-weekly

# Review F8 of #229: the ci-security audit only runs when something is pushed, so an owner exception could expire, or
# a fix could ship (which lapses the exception), with nobody noticing until the next PR goes red. This runs the same
# check every week against main's checked-out register (no --base: there is no PR). Review G3 of #238: with
# --fail-on-expiring the run FAILS (a red scheduled run notifies the workflow's owner) when an entry has 7 days or fewer
# left, so the expiry is noticed before every PR turns red; ci-security's audit only warns at that point. Same tool,
# same rules as ci-security's `audit` job. Read-only token: no issue is opened.
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  group: npm-audit-weekly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - name: The check's own tests
        run: node --test tools/check-npm-audit.test.cjs
      - name: yarn npm audit (high+), owner exceptions from main; fails at 7 days or fewer left
        env:
          GITHUB_TOKEN: ${{ github.token }} # the GitHub advisory lookup (first_patched_version)
        run: node tools/check-npm-audit.cjs --fail-on-expiring
