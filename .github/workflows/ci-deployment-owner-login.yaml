# Owner-login deployment configuration CI. NOT a release workflow: it builds, pushes and deploys nothing, holds no secret
# and needs only `contents: read`.
#
#   deployment-config  the gate's self-tests and the gate (packages/rab-docker/scripts/compose-owner-login.cjs) in FULL mode
#                      (PG_DATABASE_URL pinned "" and NO PG_ADMIN_URL on rab-api / rab-worker: the admin URL reaches
#                      db-setup only, owner decision 2026-11-17; no second identity, no token, the H1-H6
#                      keys, the O3 lifecycle: the API migrates on start, no rab-migrate, one API, the Worker never
#                      migrates and only consumes the job schedulers; the bundled database), plus
#                      `docker compose config` of every supported combination, and the ONE-IMAGE check
#                      (scripts/compose-one-image.cjs, owner decision 2026-11-11 "deploy exactly like Twenty"): every
#                      deploy compose gives rab-api and rab-worker the SAME image variable (CREWFLOW_IMAGE_TAG, a digest),
#                      no build, and the Worker starts after a healthy API (restart: true). ci-security.yaml's deployment-config job
#                      keeps running verify-image-compose.cjs and compose-credential-isolation.cjs.
#   db-setup-capability  (NOT a required check yet; owner decision pending on making it one) the live harness of the
#                      bootstrap child against disposable PostgreSQL 16, 17 and 18 containers (a matrix), one at a time, memory-capped
#                      (scripts/owner-login/fallback-check/run-fallback-check.sh): the pre-hashed path (P1, P2), a server
#                      that refuses pre-hashed passwords (a test-only C extension built here: N1 the plain-text fallback
#                      over verified TLS in one run, N1b no verified TLS -> the printed step, N2a/N2b plain text refused
#                      too -> passwordless role + steps / the printed SQL, N3 an existing password changed only with
#                      CREWFLOW_ROTATE_APP_PASSWORD=1, N4 no value in the server log at log_statement=ddl, including a
#                      plain set cancelled by lock_timeout; N5 on 17+: a database-level transaction_timeout), the rotate opt-in on H1, PgBouncer in transaction mode refused
#                      by capability (B1, B2) and PG_ADMIN_DIRECT_URL (B3), and a pg_hba that trusts crewflow_owner refused
#                      (T1). Secrets are generated per run and never printed.
# The owner-login integration suites (packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts, lifecycle /
# transition) run in ci-twenty-tests.yaml (Agent 5), not here: this workflow never reports a suite it does not run.
name: CI owner-login deployment

on:
  pull_request:
    paths:
      - packages/rab-docker/docker-compose*.yml
      - packages/rab-docker/staging/docker-compose.staging.yml
      - packages/rab-docker/staging/rehearsal/docker-compose.image-rehearsal.yml
      - packages/rab-docker/env/**
      - packages/rab-docker/local-db/**
      - packages/rab-docker/postgres-init/owner-login/**
      - packages/rab-docker/scripts/compose-owner-login*.cjs
      - packages/rab-docker/scripts/compose-one-image*.cjs
      - packages/rab-docker/rab/worker-bundle/worker-bundle-health.cjs
      - packages/rab-docker/rab/api-prestart.sh
      - packages/rab-docker/rab/worker-start.sh
      - packages/rab-docker/staging/verify-image-compose*.cjs
      - .github/workflows/ci-deployment-owner-login.yaml
      - .nvmrc
      - packages/rab-docker/rab/db-setup.sh
      - packages/rab-server/src/database/typeorm/scripts/owner-login/**
  push:
    branches: [main, deploy/twenty-mode-a]
    paths:
      - packages/rab-docker/docker-compose*.yml
      - packages/rab-docker/staging/docker-compose.staging.yml
      - packages/rab-docker/staging/rehearsal/docker-compose.image-rehearsal.yml
      - packages/rab-docker/env/**
      - packages/rab-docker/local-db/**
      - packages/rab-docker/postgres-init/owner-login/**
      - packages/rab-docker/scripts/compose-owner-login*.cjs
      - packages/rab-docker/scripts/compose-one-image*.cjs
      - packages/rab-docker/rab/worker-bundle/worker-bundle-health.cjs
      - packages/rab-docker/rab/api-prestart.sh
      - packages/rab-docker/rab/worker-start.sh
      - packages/rab-docker/staging/verify-image-compose*.cjs
      - .github/workflows/ci-deployment-owner-login.yaml
      - .nvmrc
      - packages/rab-docker/rab/db-setup.sh
      - packages/rab-server/src/database/typeorm/scripts/owner-login/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deployment-owner-login-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-config:
    name: Owner-login compose and env gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The self-tests skip their rendered-model cases without docker compose; here it is required, so they cannot skip.
      - name: docker compose is available
        run: docker compose version
      - name: docker compose config — every supported combination
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/owner-login-config"
          mkdir -p "$t/project" "$t/secrets"
          : > "$t/secrets/database.env"
          : > "$t/secrets/runtime.env"
          z="$(printf '%064d' 0)"
          {
            echo "CREWFLOW_IMAGE_TAG=sha256:$z"
            echo "CREWFLOW_REDIS_IMAGE=redis@sha256:$z"
            echo "CREWFLOW_POSTGRES_IMAGE=postgres@sha256:$z"
            echo "CREWFLOW_SECRETS_DIR=$t/secrets"
            echo "PG_DATABASE_PASSWORD=$(printf '%064d' 0)"
            echo "PG_DATABASE_APP_PASSWORD=$(printf '%064d' 1)"
          } > "$t/compose.env"
          D=packages/rab-docker
          I="$D/docker-compose.image.yml"; S="$D/staging/docker-compose.staging.yml"
          # DB-SETUP D3: docker-compose.local-db.yml is retired (the bundled db is in the image compose).
          test ! -e "$D/docker-compose.local-db.yml"
          # O3: docker-compose.migrate-on-start.yml is folded into the image compose (the API migrates on start).
          test ! -e "$D/docker-compose.migrate-on-start.yml"
          for combo in "$I" "$I $S"; do
            args=()
            for f in $combo; do args+=(-f "$f"); done
            echo "docker compose config: $combo"
            docker compose --env-file "$t/compose.env" --project-directory "$t/project" "${args[@]}" config -q
          done
          # Owner decisions 2026-11-17 / 2026-11-18 (no dummy password, Twenty's way): your own database renders WITHOUT
          # PG_DATABASE_PASSWORD and PG_DATABASE_APP_PASSWORD, in both modes: (b) CREWFLOW_BUNDLED_DB=0 + PG_ADMIN_URL + a
          # crewflow_owner PG_DATABASE_URL, (c) CREWFLOW_BUNDLED_DB=0 + a crewflow_owner PG_DATABASE_URL.
          own="$(grep -v -e '^PG_DATABASE_PASSWORD=' -e '^PG_DATABASE_APP_PASSWORD=' "$t/compose.env")"
          printf '%s\nCREWFLOW_BUNDLED_DB=0\nPG_ADMIN_URL=postgresql://doadmin:x@db-direct.example:5432/crewflow?sslmode=verify-full\nPG_DATABASE_URL=postgresql://crewflow_owner:x@db-direct.example:5432/crewflow?sslmode=verify-full\n' "$own" > "$t/compose-own-admin.env"
          printf '%s\nCREWFLOW_BUNDLED_DB=0\nPG_DATABASE_URL=postgresql://crewflow_owner:x@db-direct.example:5432/crewflow?sslmode=verify-full\n' "$own" > "$t/compose-own-owner.env"
          for e in compose-own-admin.env compose-own-owner.env; do
            echo "docker compose config: $I ($e, no PG_DATABASE_PASSWORD / PG_DATABASE_APP_PASSWORD)"
            docker compose --env-file "$t/$e" --project-directory "$t/project" -f "$I" config -q
          done
          # Fail closed: a missing required interpolation value must refuse to render. PG_DATABASE_PASSWORD is no longer a
          # compose `:?` (it is required only while the bundled db runs): the db entrypoint, db-setup and the compose.env lint
          # refuse it instead, and the lint is checked here on a bundled compose.env without it.
          grep -v '^PG_DATABASE_PASSWORD=' "$t/compose.env" > "$t/compose-bundled-no-password.env"
          if node packages/rab-docker/scripts/compose-owner-login.cjs --lint-env-file compose "$t/compose-bundled-no-password.env"; then
            echo "::error::the compose.env lint accepted the bundled db without PG_DATABASE_PASSWORD"
            exit 1
          fi
          # Owner decision 2026-11-18: the bundled db's crewflow_owner password (PG_DATABASE_APP_PASSWORD) likewise.
          grep -v '^PG_DATABASE_APP_PASSWORD=' "$t/compose.env" > "$t/compose-bundled-no-app-password.env"
          if node packages/rab-docker/scripts/compose-owner-login.cjs --lint-env-file compose "$t/compose-bundled-no-app-password.env"; then
            echo "::error::the compose.env lint accepted the bundled db without PG_DATABASE_APP_PASSWORD"
            exit 1
          fi
          for var in CREWFLOW_IMAGE_TAG CREWFLOW_SECRETS_DIR; do
            grep -v "^$var=" "$t/compose.env" > "$t/compose-missing.env"
            if docker compose --env-file "$t/compose-missing.env" --project-directory "$t/project" -f "$I" config -q 2>/dev/null; then
              echo "::error::docker-compose.image.yml rendered without $var"
              exit 1
            fi
          done
      - name: Gate self-tests (static and full)
        run: node --test packages/rab-docker/scripts/compose-owner-login.test.cjs packages/rab-docker/scripts/compose-owner-login.full.test.cjs
      - name: Owner-login gate (full)
        run: node packages/rab-docker/scripts/compose-owner-login.cjs
      - name: One image, API first, Worker after (self-tests, then every deploy compose)
        run: |
          node --test packages/rab-docker/scripts/compose-one-image.test.cjs
          node packages/rab-docker/scripts/compose-one-image.cjs

  db-setup-capability:
    name: db-setup by capability (live PostgreSQL ${{ matrix.pg.major }}; not required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Debian postgres images by index digest, the same pins as upgrade-with-data.yaml (16 = the compose default; 17 =
        # what Neon runs; N5, the transaction_timeout guard, runs on 17 and 18 only).
        pg:
          - { major: 16, image: 'postgres@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f' }
          - { major: 17, image: 'postgres@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f' }
          - { major: 18, image: 'postgres@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - name: Build the workspace libraries (the harness imports them)
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - name: db-setup capability harness (P1, P2, Q1, H1, B1-B3, N1, N1b, N2a, N2b, N3, N4, N5, T1)
        env:
          FBC_PG_IMAGE: ${{ matrix.pg.image }}
        run: bash packages/rab-server/src/database/typeorm/scripts/owner-login/fallback-check/run-fallback-check.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fbc"
