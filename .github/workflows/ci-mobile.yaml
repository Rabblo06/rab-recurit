name: ci-mobile

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  test:
    needs: changed
    if: needs.changed.outputs.mobile == 'true'
    # Windows: the committed goldens (test/goldens) are generated on Windows; on Linux the text rasterises differently
    # and every golden differs by 2-4 % while all behaviour tests pass. Matching the generating platform keeps the
    # golden comparison meaningful (and the tests' lower-case font paths work on its case-insensitive file system).
    runs-on: windows-latest
    timeout-minutes: 30
    # packages/rab-mobile is a Flutter app, not an Nx project: the previous `nx run-many -p rab-mobile` steps ran nothing.
    # Phase C1 (D4): install the Flutter SDK and run the app's own analyzer and test suite.
    defaults:
      run:
        working-directory: packages/rab-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true
      - run: flutter --version
      # The golden/visual tests load Roboto from the SDK cache (bin/cache/artifacts/material_fonts); the action does not
      # download those universal artifacts and `flutter test` does not fetch them. No platform engines are needed.
      # --force: the cached SDK reports the universal artifacts as up to date while material_fonts is missing.
      - run: flutter precache --force --universal --no-android --no-ios --no-web --no-linux --no-macos --no-windows
      # Fail early (not in 18 test setUpAll blocks) if the golden tests' font is still missing.
      - name: Material fonts present
        shell: pwsh
        run: if (-not (Test-Path "$env:FLUTTER_ROOT/bin/cache/artifacts/material_fonts/roboto-regular.ttf")) { exit 1 }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # On-device end-to-end flows (packages/rab-mobile/integration_test/): the real debug app on an Android emulator,
  # talking over real HTTP to FakeCrewflowApi, a CI-local API the test serves on the emulator's own loopback interface.
  # Nothing here can reach a real backend: API_URL names that loopback server, and the test refuses to run against any
  # other base URL. Not a required check (branch protection names the required gates); it becomes one once it has
  # proved stable.
  integration-android:
    needs: changed
    if: needs.changed.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.38.7
          cache: true
      - name: Resolve Dart packages
        working-directory: packages/rab-mobile
        run: flutter pub get
      # Hardware acceleration for the x86_64 emulator (the runner's /dev/kvm is root-only by default).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Staff journey on an Android emulator (sign in, today, shift detail)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A common phone size (the AVD default is a 320x640 dp screen, smaller than any device the app supports).
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: packages/rab-mobile
          script: flutter test integration_test/staff_journey_test.dart -d emulator-5554 --dart-define=API_URL=http://localhost:38917/rest/v1
