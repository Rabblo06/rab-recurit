name: cd-deploy-tag

# Release record: triggered by pushing a version tag (e.g. v0.1.0), never
# automatically. It deploys nothing and pushes no image. The only job is the
# GitHub release, whose notes name the ONE release image (O2): the API and
# the Worker run the same image, published by publish-image.yaml under ONE
# immutable tag, the full commit (docker.io/adhin007/adolphus:<commit>).
# Deploy by the index digest from that run's release manifest, never by tag
# (IMAGE_SECURITY_RELEASE_POLICY.md section 8), and like Twenty: ONE variable (CREWFLOW_IMAGE_TAG = that digest) and ONE
# command, `docker compose pull && docker compose up -d`, which updates the API and the Worker together. There is no
# API-only or Worker-only deploy.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: cd-deploy-tag
  cancel-in-progress: false

# Least privilege: nothing by default; only the release job may write, and only repository contents (the release).
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write # gh release create (and the generated notes); nothing else
    steps:
      # Only to read tools/create-github-release.sh; nothing pushes, so no credential is left in .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # The preinstalled gh CLI instead of a third-party release action. The command is exercised on every PR by
      # ci-security's action-pins job (tools/create-github-release.test.cjs: dry run, a recording gh, and the installed gh's
      # own flag list), because this workflow only runs on a tag.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash tools/create-github-release.sh
