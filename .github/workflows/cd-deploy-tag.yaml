name: cd-deploy-tag

# Production release: triggered by pushing a version tag (e.g. v0.1.0),
# never automatically. rab-server itself is deployed by Render's own
# GitHub integration (autoDeploy: true in render.yaml) as soon as the
# commit lands on main — by the time a tag is pushed, that commit is
# already live, so this workflow's only job is the release record.
# There is no worker deploy step: queue-worker/main.ts registers no
# BullMQ processors yet (see its own comment), so it isn't deployed at
# all on the free tier — revisit once M3 adds real jobs to it.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: cd-deploy-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
