name: cd-deploy-tag

# Production release: triggered by pushing a version tag (e.g. v0.1.0),
# never automatically. Both rab-server AND rab-worker (render.yaml) are
# deployed by Render's own GitHub integration (autoDeploy: true on both
# services) as soon as the commit lands on main — by the time a tag is
# pushed, that commit is already live on both, so this workflow's only
# job is the release record.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: cd-deploy-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
