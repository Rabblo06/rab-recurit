name: ci-server

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  test:
    needs: changed
    if: needs.changed.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # C1b: HWS on makes the full in-band server suite exceed 120 min on one database; three shards, one database each
    # (Jest --shard splits by test path, deterministically).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      # Required by the command/migration target guard (database-target.ts). The test cluster is loopback: DB_TARGET=local.
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      # PostgreSQL (M2 CI reliability, 2026-10-28): no longer a service. A service starts BEFORE checkout, so mounting
      # packages/rab-docker/postgres-init from the workspace made Docker create that directory as root and checkout failed
      # (EACCES). And migrating the whole chain as the rab_owner login can no longer pass the role split (CF-41), while
      # rab_app is NOLOGIN since then. The database is now started after checkout (.github/actions/disposable-postgres)
      # and built by the restricted-migrator path of the M2 harness, so the suite runs on a database a NON-superuser
      # migrator built. The application connects as crewflow_app (TEST_DATABASE_URL, restricted, NOBYPASSRLS); fixtures as
      # the disposable cluster's bootstrap superuser (TEST_DATABASE_URL_UNPOOLED). Every value is random and masked.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      # lint and test get their library builds from Nx (nx.json: `dependsOn: ["^build"]`). This step stays because the
      # test-database harness below runs on ts-node outside Nx and imports @rab/shared and @rab/emails through their built dist.
      - name: Build the workspace libraries (the migration harness imports them)
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - run: npx nx run-many -t lint -p rab-server,rab-shared
      - uses: ./.github/actions/disposable-postgres
      # Owner-login architecture (owner decision 2026-11-04): the suites run on a database built the way every install is
      # now built: the provider SQL (01-crewflow-owner.sql, psql as the cluster superuser) and Agent 1's migrate child as
      # crewflow_owner, followed by the head-state checks (ledger = chain, 1786721330000 absent, B3, reachability, golden
      # posture). The legacy restricted-migrator build (CF-41) keeps its own job in ci-migration-security.yaml until PR #9.
      - name: Build the test database the owner-login way (provider SQL, migrate child, head-state checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts ci-db
        env:
          TWENTY_PG_CONTAINER: disposable-postgres
          TWENTY_CI_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: Unit and integration tests
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          # TEST_DATABASE_URL = crewflow_owner (the one runtime login); TEST_DATABASE_URL_UNPOOLED = the cluster superuser
          # (fixtures only). The Twenty catalogue suites run in ci-twenty-tests.yaml, not here.
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap)"  # a helper refusal fails the step here, not later
          eval "$test_env"
          # The owner password is inside TEST_DATABASE_URL now; the raw value never reaches a test process or the live API.
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD CREWFLOW_WORKER_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD CREWFLOW_BOOTSTRAP_PASSWORD
          # In band: the integration suites share ONE database, and the email/offer dispatchers of one suite claim rows
          # another suite created (first real GitHub run, PR #19). One suite at a time, as the local regression runs them.
          # JSON results (one file per project) and a per-file summary: the classification of the owner-login differences
          # (behaviour-change catalogue / schema-role test / removed in PR #9) is made from these, not from truncated output.
          status=0
          mkdir -p "${RUNNER_TEMP}/jest-results"
          if [ "${{ matrix.shard }}" = 1 ]; then
            npx nx run-many -t test -p rab-shared --runInBand --output-style=stream --json "--outputFile=${RUNNER_TEMP}/jest-results/rab-shared.json" || status=$?
          fi
          # --skip-nx-cache: nx caches per task, not per --shard argument (a cached shard 1 must never be replayed as shard 2).
          npx nx run-many -t test -p rab-server --skip-nx-cache --runInBand --testTimeout=180000 --output-style=stream "--shard=${{ matrix.shard }}/3" --json "--outputFile=${RUNNER_TEMP}/jest-results/rab-server-${{ matrix.shard }}.json" || status=$?
          node -e 'const fs=require("fs");for(const f of process.argv.slice(1)){if(!fs.existsSync(f)){console.log(`no jest result: ${f}`);continue}const r=JSON.parse(fs.readFileSync(f,"utf8"));for(const t of r.testResults){const n=s=>t.assertionResults.filter(a=>a.status===s).length;const name=t.name.split(/[\\/]/).slice(-2).join("/");if(t.status!=="passed"||n("failed"))console.log(`FAILED-FILE ${name} passed=${n("passed")} failed=${n("failed")}${t.testExecError||(!t.assertionResults.length&&t.failureMessage)?" (file failed to run)":""}`)}console.log(`jest ${f.split(/[\\/]/).pop()}: suites=${r.numTotalTestSuites} failedSuites=${r.numFailedTestSuites} tests=${r.numTotalTests} failed=${r.numFailedTests}`)}' "${RUNNER_TEMP}"/jest-results/*.json
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jest-results-server-${{ matrix.shard }}
          path: ${{ runner.temp }}/jest-results/
          if-no-files-found: ignore
      - if: matrix.shard == 1
        run: npx nx run-many -t build -p rab-server,rab-shared,rab-ui
      - uses: ./.github/actions/save-cache
        if: always() && matrix.shard == 1
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true

  # Part C1 (OWNER-DB-ULTIMATE.md Part C): HWS runtime routing is ON by default outside production, so the job above runs
  # it on. This job keeps the legacy OFF mode (business rows in the core copies, production's mode until C3) covered until
  # C4 deletes the off path. Same database build; only HWS_RUNTIME_ENABLED differs.
  test-hws-off:
    needs: changed
    if: needs.changed.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      HWS_RUNTIME_ENABLED: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - name: Build the workspace libraries
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - uses: ./.github/actions/disposable-postgres
      - name: Build the test database the owner-login way (provider SQL, migrate child, head-state checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts ci-db
        env:
          TWENTY_PG_CONTAINER: disposable-postgres
          TWENTY_CI_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: Server integration tests, HWS OFF
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap)"
          eval "$test_env"
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD CREWFLOW_WORKER_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD CREWFLOW_BOOTSTRAP_PASSWORD
          npx nx run-many -t test -p rab-server --skip-nx-cache --runInBand --testTimeout=180000 --output-style=stream "--shard=${{ matrix.shard }}/2"
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true

  # Part C2 (HWS-AUDIT-C2-SIZING.md §7 layer 2): the server suites with every binder binding search_path = '' (the test-only
  # trap CREWFLOW_TEST_SEARCH_PATH_TRAP, refused outside NODE_ENV=test). Any unqualified table then fails with 42P01.
  # REQUIRED since C2-7 (the ratchet baseline is empty and every suite passes under the trap): a failure fails the workflow.
  # The owner adds "test-search-path-trap (1)", "(2)", "(3)" to branch protection. The FAILED-FILE list names failing suites.
  test-search-path-trap:
    needs: changed
    if: needs.changed.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      CREWFLOW_TEST_SEARCH_PATH_TRAP: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      - name: Build the workspace libraries
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - uses: ./.github/actions/disposable-postgres
      - name: Build the test database the owner-login way (provider SQL, migrate child, head-state checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts ci-db
        env:
          TWENTY_PG_CONTAINER: disposable-postgres
          TWENTY_CI_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: Server tests under the search_path trap
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap)"
          eval "$test_env"
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD CREWFLOW_WORKER_BOOTSTRAP_PASSWORD CREWFLOW_APP_BOOTSTRAP_PASSWORD CREWFLOW_BOOTSTRAP_PASSWORD
          status=0
          mkdir -p "${RUNNER_TEMP}/jest-results"
          npx nx run-many -t test -p rab-server --skip-nx-cache --runInBand --testTimeout=180000 --output-style=stream "--shard=${{ matrix.shard }}/3" --json "--outputFile=${RUNNER_TEMP}/jest-results/rab-server-trap-${{ matrix.shard }}.json" || status=$?
          node -e 'const fs=require("fs");for(const f of process.argv.slice(1)){if(!fs.existsSync(f)){console.log(`no jest result: ${f}`);continue}const r=JSON.parse(fs.readFileSync(f,"utf8"));for(const t of r.testResults){const n=s=>t.assertionResults.filter(a=>a.status===s).length;const name=t.name.split(/[\/]/).slice(-2).join("/");if(t.status!=="passed"||n("failed"))console.log(`FAILED-FILE ${name} passed=${n("passed")} failed=${n("failed")}`)}console.log(`jest ${f.split(/[\/]/).pop()}: suites=${r.numTotalTestSuites} failedSuites=${r.numFailedTestSuites} tests=${r.numTotalTests} failed=${r.numFailedTests}`)}' "${RUNNER_TEMP}"/jest-results/*.json
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jest-results-server-trap-${{ matrix.shard }}
          path: ${{ runner.temp }}/jest-results/
          if-no-files-found: ignore
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true

  # One always-reporting status for branch protection. A skipped matrix job never reports its expanded names
  # ("test (1)", ...), so a PR the change filter skips could never satisfy those required checks. This job always runs:
  # it fails if a required job failed or was cancelled, and accepts "skipped" only when `changed` succeeded and its
  # filter output(s) (server) said there was nothing to run; when the filter said run, every job must succeed.
  ci-server-gate:
    name: ci-server gate
    needs: [changed, test, test-hws-off, test-search-path-trap]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required ci-server job succeeded, or was skipped by the change filter
        env:
          RESULTS: ${{ toJSON(needs) }}
          # The changed-files outputs this workflow's `if:` conditions read: the suites run when any of them is 'true'.
          FILTER_OUTPUTS: server
        run: |
          python3 - <<'EOF'
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          keys = os.environ['FILTER_OUTPUTS'].split()
          for k, v in sorted(needs.items()):
              print(f"{k}: {v['result']}")
          changed = needs.get('changed') or {}
          if changed.get('result') != 'success':
              print(f"::error::change detection did not succeed ({changed.get('result')}): cannot tell a skip from a job that never ran")
              sys.exit(1)
          outputs = changed.get('outputs') or {}
          flags = {k: outputs.get(k) for k in keys}
          print(f"change filter outputs: {flags}")
          if not flags or any(v not in ('true', 'false') for v in flags.values()):
              print(f"::error::change filter outputs are missing or not 'true'/'false': {flags}")
              sys.exit(1)
          should_run = 'true' in flags.values()
          allowed = ('success',) if should_run else ('success', 'skipped')
          jobs = {k: v['result'] for k, v in needs.items() if k != 'changed'}
          bad = {k: r for k, r in jobs.items() if r not in allowed}
          if not jobs or bad:
              print(f"::error::required jobs did not {'succeed' if should_run else 'succeed or skip'}: {bad}")
              sys.exit(1)
          print('the change filter ' + ('ran the suites and every one succeeded' if should_run else 'skipped the suites (no relevant change)'))
          EOF
