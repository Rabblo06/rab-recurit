name: ci-server

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  test:
    needs: changed
    if: needs.changed.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      # Required by the command/migration target guard (database-target.ts). The test cluster is loopback: DB_TARGET=local.
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      # PostgreSQL (M2 CI reliability, 2026-10-28): no longer a service. A service starts BEFORE checkout, so mounting
      # packages/rab-docker/postgres-init from the workspace made Docker create that directory as root and checkout failed
      # (EACCES). And migrating the whole chain as the rab_owner login can no longer pass the role split (CF-41), while
      # rab_app is NOLOGIN since then. The database is now started after checkout (.github/actions/disposable-postgres)
      # and built by the restricted-migrator path of the M2 harness, so the suite runs on a database a NON-superuser
      # migrator built. The application connects as crewflow_app (TEST_DATABASE_URL, restricted, NOBYPASSRLS); fixtures as
      # the disposable cluster's bootstrap superuser (TEST_DATABASE_URL_UNPOOLED). Every value is random and masked.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      # The lint target is `tsc --noEmit`, which resolves @rab/shared and @rab/emails through their built dist: build them
      # first (on GitHub these jobs never got past checkout before, so the missing order was never visible).
      - name: Build the workspace libraries (lint and the migration harness import them)
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - run: npx nx run-many -t lint -p rab-server,rab-shared
      - uses: ./.github/actions/disposable-postgres
      - name: Build the test database with the restricted migrator (fresh install, with its security checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json             packages/rab-server/src/database/typeorm/scripts/migration-security-check.ts
        env:
          MIGRATION_SECURITY_SCENARIOS: fresh
          MIGRATION_SECURITY_KEEP_DATABASES: 'true'
          MIGRATION_SECURITY_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: Unit and integration tests
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/migration-security-test-env.cjs "$FRESH_DB")"  # a helper refusal fails the step here, not later
          eval "$test_env"
          npx nx run-many -t test -p rab-server,rab-shared
      - run: npx nx run-many -t build -p rab-server,rab-shared,rab-ui
      - uses: ./.github/actions/save-cache
        if: always()
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true
