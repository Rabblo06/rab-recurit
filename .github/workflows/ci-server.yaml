name: ci-server

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    uses: ./.github/workflows/changed-files.yaml

  test:
    needs: changed
    if: needs.changed.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      # Required by the command/migration target guard (database-target.ts). The test cluster is loopback: DB_TARGET=local.
      DB_TARGET: local
      REDIS_URL: redis://localhost:6379
      # PostgreSQL (M2 CI reliability, 2026-10-28): no longer a service. A service starts BEFORE checkout, so mounting
      # packages/rab-docker/postgres-init from the workspace made Docker create that directory as root and checkout failed
      # (EACCES). And migrating the whole chain as the rab_owner login can no longer pass the role split (CF-41), while
      # rab_app is NOLOGIN since then. The database is now started after checkout (.github/actions/disposable-postgres)
      # and built by the restricted-migrator path of the M2 harness, so the suite runs on a database a NON-superuser
      # migrator built. The application connects as crewflow_app (TEST_DATABASE_URL, restricted, NOBYPASSRLS); fixtures as
      # the disposable cluster's bootstrap superuser (TEST_DATABASE_URL_UNPOOLED). Every value is random and masked.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/yarn-install
      - uses: ./.github/actions/restore-cache
      # The lint target is `tsc --noEmit`, which resolves @rab/shared and @rab/emails through their built dist: build them
      # first (on GitHub these jobs never got past checkout before, so the missing order was never visible).
      - name: Build the workspace libraries (lint and the migration harness import them)
        run: npx nx run-many -t build -p rab-shared,rab-emails
      - run: npx nx run-many -t lint -p rab-server,rab-shared
      - uses: ./.github/actions/disposable-postgres
      # Owner-login architecture (owner decision 2026-11-04): the suites run on a database built the way every install is
      # now built: the provider SQL (01-crewflow-owner.sql, psql as the cluster superuser) and Agent 1's migrate child as
      # crewflow_owner, followed by the head-state checks (ledger = chain, 1786721330000 absent, B3, reachability, golden
      # posture). The legacy restricted-migrator build (CF-41) keeps its own job in ci-migration-security.yaml until PR #9.
      - name: Build the test database the owner-login way (provider SQL, migrate child, head-state checks)
        run: |
          npx ts-node --transpile-only -P packages/rab-server/tsconfig.app.json packages/rab-server/src/database/typeorm/scripts/twenty-mode-check.ts ci-db
        env:
          TWENTY_PG_CONTAINER: disposable-postgres
          TWENTY_CI_DB_FILE: ${{ runner.temp }}/test-database.env
      - name: Unit and integration tests
        run: |
          set -euo pipefail
          set -a; source "${RUNNER_TEMP}/test-database.env"; set +a
          # TEST_DATABASE_URL = crewflow_owner (the one runtime login); TEST_DATABASE_URL_UNPOOLED = the cluster superuser
          # (fixtures only). The Twenty catalogue suites run in ci-twenty-tests.yaml, not here.
          test_env="$(node packages/rab-server/src/database/typeorm/scripts/twenty-test-env.cjs "$OWNER_DB" --source bootstrap)"  # a helper refusal fails the step here, not later
          eval "$test_env"
          # The owner password is inside TEST_DATABASE_URL now; the raw value never reaches a test process or the live API.
          unset TWENTY_MODE_TESTS CREWFLOW_OWNER_BOOTSTRAP_PASSWORD
          # In band: the integration suites share ONE database, and the email/offer dispatchers of one suite claim rows
          # another suite created (first real GitHub run, PR #19). One suite at a time, as the local regression runs them.
          # JSON results (one file per project) and a per-file summary: the classification of the owner-login differences
          # (behaviour-change catalogue / schema-role test / removed in PR #9) is made from these, not from truncated output.
          status=0
          mkdir -p "${RUNNER_TEMP}/jest-results"
          npx nx run-many -t test -p rab-shared --runInBand --output-style=stream \n            --json "--outputFile=${RUNNER_TEMP}/jest-results/rab-shared.json" || status=$?
          npx nx run-many -t test -p rab-server --runInBand --testTimeout=180000 --output-style=stream \n            --json "--outputFile=${RUNNER_TEMP}/jest-results/rab-server.json" || status=$?
          node -e 'const fs=require("fs");for(const f of process.argv.slice(1)){if(!fs.existsSync(f)){console.log(`no jest result: ${f}`);continue}const r=JSON.parse(fs.readFileSync(f,"utf8"));for(const t of r.testResults){const n=s=>t.assertionResults.filter(a=>a.status===s).length;const name=t.name.split(/[\\/]/).slice(-2).join("/");if(t.status!=="passed"||n("failed"))console.log(`FAILED-FILE ${name} passed=${n("passed")} failed=${n("failed")}${t.testExecError||(!t.assertionResults.length&&t.failureMessage)?" (file failed to run)":""}`)}console.log(`jest ${f.split(/[\\/]/).pop()}: suites=${r.numTotalTestSuites} failedSuites=${r.numFailedTestSuites} tests=${r.numTotalTests} failed=${r.numFailedTests}`)}' "${RUNNER_TEMP}"/jest-results/*.json
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: jest-results-server
          path: ${{ runner.temp }}/jest-results/
          if-no-files-found: ignore
      - run: npx nx run-many -t build -p rab-server,rab-shared,rab-ui
      - uses: ./.github/actions/save-cache
        if: always()
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f disposable-postgres > /dev/null 2>&1 || true
