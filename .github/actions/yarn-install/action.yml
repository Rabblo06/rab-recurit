name: Yarn install
description: >-
  Sets up Node + Corepack and runs a cached, immutable Yarn install. Two caches: Yarn's zip cache (every run, as before) and,
  since CI audit 2026-11-12 S5, the linked node_modules trees plus Yarn's install state. `yarn install --immutable` always
  runs: with an exact node_modules hit it is a quick check (lockfile unchanged, hardened-mode registry check, nothing to
  link) instead of a 15 s link.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Get Yarn cache directory
      id: yarn-cache-dir
      shell: bash
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.yarn-cache-dir.outputs.dir }}
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          yarn-${{ runner.os }}-

    # node_modules holds native addons (argon2, msgpackr-extract) built for one Node ABI and one libc, so the key is exact:
    # OS, architecture, host or container (ci-e2e's web-ai-visual job runs in the Playwright image), the Node version
    # setup-node installed, and the lockfile + Yarn configuration. No restore-keys: a near miss is never restored.
    - name: node_modules cache key
      id: node-modules-key
      shell: bash
      run: |
        set -euo pipefail
        if [ -f /.dockerenv ]; then where=container; else where=host; fi
        echo "key=node-modules-${RUNNER_OS}-${RUNNER_ARCH}-${where}-$(node -p process.version)-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      id: node-modules
      with:
        path: |
          node_modules
          packages/*/node_modules
          .yarn/install-state.gz
        key: ${{ steps.node-modules-key.outputs.key }}

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    # Saved right after the install, before any job step can write into node_modules, and only by pushes to main (as the
    # Nx cache, S6): a pull request restores main's entry and never writes one, so a PR cannot plant node_modules for
    # another ref, and dependency-bump PRs do not fill the 10 GB Actions cache with one tree each.
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      if: steps.node-modules.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      with:
        path: |
          node_modules
          packages/*/node_modules
          .yarn/install-state.gz
        key: ${{ steps.node-modules-key.outputs.key }}
