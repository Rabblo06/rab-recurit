name: Restore Nx cache
description: Restores the Nx computation cache so unaffected tasks replay instantly

runs:
  using: composite
  steps:
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          nx-${{ runner.os }}-
