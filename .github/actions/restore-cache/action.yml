name: Restore Nx cache
description: Restores the Nx computation cache so unaffected tasks replay instantly

runs:
  using: composite
  steps:
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .nx/cache
        key: nx-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          nx-${{ runner.os }}-
