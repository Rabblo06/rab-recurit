services:
  - type: web
    name: rab-server
    runtime: docker
    plan: free
    dockerfilePath: packages/rab-docker/rab/Dockerfile
    dockerContext: .
    # No dockerCommand override — the image's own CMD (start.sh) runs
    # migrations against DATABASE_URL_UNPOOLED then execs main.js. Render
    # doesn't shell-parse a dockerCommand string the way `docker run` does
    # with a CMD string, so quoting/&&-chaining there silently breaks;
    # baking it into the image sidesteps that entirely.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon pooled connection string (hostname has the -pooler suffix) — get it with:
      #   neon connection-string production --pooled --project-id lucky-grass-30655804
      - key: DATABASE_URL
        sync: false
      # Neon direct connection string (no -pooler suffix), migrations only:
      #   neon connection-string production --project-id lucky-grass-30655804
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Upstash Redis — use the "TLS" / rediss:// URL from the Upstash console.
      - key: REDIS_URL
        sync: false
      # openssl rand -hex 32
      - key: APP_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      # Vercel deployment URL, e.g. https://rab-console.vercel.app — no trailing slash, no wildcard.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: EMAIL_DRIVER
        value: LOGGER
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: APP_VERSION
        sync: false
