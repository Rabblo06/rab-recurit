services:
  - type: web
    name: rab-server
    runtime: docker
    plan: free
    dockerfilePath: packages/rab-docker/rab/Dockerfile
    dockerContext: .
    # Migrations run against DATABASE_URL_UNPOOLED, never the pooled
    # DATABASE_URL — Neon's pooled endpoint is PgBouncer in transaction
    # mode, which doesn't support the session state migration tooling
    # relies on (see the neon-postgres skill's pooling gotcha). main.js
    # itself keeps using the pooled DATABASE_URL as normal.
    dockerCommand: >-
      sh -c "DATABASE_URL=$DATABASE_URL_UNPOOLED node packages/rab-server/dist/database/typeorm/scripts/setup-db.js &&
      node packages/rab-server/dist/main.js"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon pooled connection string (hostname has the -pooler suffix) — get it with:
      #   neon connection-string production --pooled --project-id lucky-grass-30655804
      - key: DATABASE_URL
        sync: false
      # Neon direct connection string (no -pooler suffix), migrations only:
      #   neon connection-string production --project-id lucky-grass-30655804
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Upstash Redis — use the "TLS" / rediss:// URL from the Upstash console.
      - key: REDIS_URL
        sync: false
      # openssl rand -hex 32
      - key: APP_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      # Vercel deployment URL, e.g. https://rab-console.vercel.app — no trailing slash, no wildcard.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: EMAIL_DRIVER
        value: LOGGER
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: APP_VERSION
        sync: false
