services:
  - type: web
    name: rab-server
    runtime: docker
    plan: free
    dockerfilePath: packages/rab-docker/rab/Dockerfile
    dockerContext: .
    # No dockerCommand override — the image's own CMD (start.sh) runs
    # migrations against DATABASE_URL_UNPOOLED then execs main.js. Render
    # doesn't shell-parse a dockerCommand string the way `docker run` does
    # with a CMD string, so quoting/&&-chaining there silently breaks;
    # baking it into the image sidesteps that entirely.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon pooled connection string, as rab_app (NOBYPASSRLS — see
      # DEPLOYMENT.md), not neondb_owner. rab_app's password isn't
      # Neon-managed (the role was created via plain SQL, not the API/CLI,
      # specifically so it wouldn't get auto-enrolled in neon_superuser /
      # BYPASSRLS) so `neon connection-string --role-name` can't retrieve
      # it — build the URL by hand: swap neondb_owner:<password> for
      # rab_app:<password> in a `neon connection-string production
      # --pooled --role-name neondb_owner --project-id lucky-grass-30655804` output.
      - key: DATABASE_URL
        sync: false
      # Same, direct/unpooled, as rab_owner — migrations only.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Upstash Redis — use the "TLS" / rediss:// URL from the Upstash console.
      - key: REDIS_URL
        sync: false
      # openssl rand -hex 32
      - key: APP_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      # Vercel deployment URL, e.g. https://rab-console.vercel.app — no trailing slash, no wildcard.
      - key: CORS_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # LOGGER until you've filled in either the SMTP or RESEND block below
      # and flipped this to SMTP or RESEND in the dashboard — leaving it
      # LOGGER means a half-configured deploy still boots, it just logs
      # email instead of failing to send it. Never set to SMTP/RESEND here
      # in the committed file — set it in the Render dashboard once the
      # matching credentials below are actually filled in, so a deploy
      # never races ahead of its own config.
      - key: EMAIL_DRIVER
        sync: false
      # Any SMTP provider, including a personal Gmail account (unlike
      # Resend, SMTP doesn't require a verified sending domain) — e.g.
      # smtp.gmail.com : 587 with a Google App Password, matching local dev.
      - key: EMAIL_SMTP_HOST
        sync: false
      - key: EMAIL_SMTP_PORT
        sync: false
      - key: EMAIL_SMTP_USER
        sync: false
      # Google App Password (or equivalent) — never committed — set only here.
      - key: EMAIL_SMTP_PASSWORD
        sync: false
      - key: EMAIL_SMTP_NO_TLS
        sync: false
      # Resend dashboard → API Keys. Never committed — set only here.
      - key: RESEND_API_KEY
        sync: false
      # Must be on a domain verified in Resend (SPF/DKIM) if EMAIL_DRIVER=
      # RESEND — Resend rejects a `from` on an unverified domain, so it
      # cannot be a personal mailbox address there. No such restriction for
      # SMTP — an ordinary Gmail address is fine as the From for that driver.
      - key: EMAIL_FROM_ADDRESS
        sync: false
      # Optional — where replies should land if EMAIL_FROM_ADDRESS is a
      # no-reply-style address on the verified domain.
      - key: EMAIL_REPLY_TO
        sync: false
      - key: APP_VERSION
        sync: false
